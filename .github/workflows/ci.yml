name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test tests/
      # skills 模板渲染门(runInit vs 快照基线 + .agents/skills 新鲜度,版本号归一化)
      - run: bun run check:skills-template-render
      # pending 计量门 + config schema 产物漂移门(与 just qa 同集合)
      - run: bun run pending-gate
      - run: bun run check:schema
      # 双运行时兼容冒烟(spec monorepo-structure r1:Node >= 24)
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node apps/cli/src/main.ts --version
