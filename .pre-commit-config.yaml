# prek(https://github.com/j178/prek)驱动的 git hooks。
# 安装:prek install;手动全量跑:prek run --all-files。
repos:
  - repo: local
    hooks:
      - id: lint
        name: oxlint
        language: system
        entry: bun run lint
        pass_filenames: false
        always_run: true
      - id: format
        name: oxfmt --write
        language: system
        entry: bun run format:write
        pass_filenames: false
        always_run: true
      - id: check-schema
        name: config schema artifact drift
        language: system
        entry: bun run check:schema
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # docs/research/ 的 markdown 用行尾双空格作硬换行,删掉会改变渲染段落。
        exclude: ^(\.agents/skills/|docs/research/)
      - id: end-of-file-fixer
        exclude: ^\.agents/skills/
      - id: check-yaml
        # 冻结平铺卡存在双格式(见 review-freeze r24/r54):新卡是无围栏单文档
        # YAML;存量前代卡为 `---` 围栏形态,按契约保留不迁移,单文档解析器
        # 必然报多文档。归档卡由 check:schema 之外的 graph/archive 读取器覆盖。
        exclude: ^llmanspec/changes/archive/[0-9]{4}-[0-9]{2}-[0-9]{2}-.*\.yaml$
      - id: check-added-large-files
        args: ['--maxkb=1000']
