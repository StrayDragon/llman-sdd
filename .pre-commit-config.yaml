# prek(https://github.com/j178/prek)驱动的 git hooks。
# 安装:prek install;手动全量跑:prek run --all-files。
repos:
  - repo: local
    hooks:
      - id: lint
        name: oxlint
        language: system
        entry: bun run lint
        pass_filenames: false
        always_run: true
      - id: format
        name: oxfmt --write
        language: system
        entry: bun run format:write
        pass_filenames: false
        always_run: true
      - id: check-schema
        name: config schema artifact drift
        language: system
        entry: bun run check:schema
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # markdown 行尾双空格是硬换行;用官方开关保留,而不是按目录豁免
        # (豁免会让真正的尾随空白在该目录漏检)。多余空格仍被清理。
        args: ['--markdown-linebreak-ext=md']
        exclude: ^\.agents/skills/
      - id: end-of-file-fixer
        exclude: ^\.agents/skills/
      # 冻结平铺卡一律为无围栏单文档 YAML(review-freeze r24/r121),通用严格校验即可。
      # 存量围栏卡由 `llman-sdd project migrate frozen-cards-unfence` 归一,不在这里豁免。
      - id: check-yaml
        exclude: ^\.agents/skills/
      - id: check-added-large-files
        args: ['--maxkb=1000']
