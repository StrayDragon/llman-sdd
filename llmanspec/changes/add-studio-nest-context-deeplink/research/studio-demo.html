            </div>`;
        } else {
          const diffBadge = diff.hasChanges
            ? `<span class="badge-chip badge-green" style="font-size:10px;">实时同步 +${diff.statesAdded.length}态 ~${diff.statesRenamed.length + diff.edgesModified.length}改</span>`
            : `<span style="color:var(--text-muted);">点击图中状态高亮入/出流转（绿虚线=入 · 蓝实线=出）</span>`;
          focusStripHtml = `
            <div style="display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;">
              ${diffBadge}
              <span style="color:var(--text-muted);">${m.states.length} 节 · ${m.transitions.length} 边</span>
            </div>`;
        }

        return `
          <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px;margin-bottom:8px;">
            <svg viewBox="0 0 ${vbW} ${vbH}" style="width:100%;height:210px;display:block;">
              <defs>
                <marker id="ipArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="${bdHex}"/></marker>
                <marker id="ipArrOut" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="${accentHex}"/></marker>
                <marker id="ipArrIn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="${tealHex}"/></marker>
              </defs>
              ${edgesSvg}${nodesSvg}
            </svg>
          </div>
          ${focusStripHtml}`;
      }

      // Doc / Decision Table In-Place Preview (absorbs TextFold 5-level + Tags + Deep Drill!)
      const doc = TF_DOCS[n.docKey] || TF_DOCS['validation'];
      const rootTree = DEEP_DRILL_TREE[`spec:${n.id}`];
      return `${crumbHtml}
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px;flex-wrap:wrap;">
          <div data-inplace-tf="1"></div>
          <span style="font-family:var(--mono);font-size:10px;color:var(--text-muted);">${esc(n.blame)}</span>
        </div>
        <div class="card card-warm" style="white-space:pre-wrap;font-size:12px;margin-bottom:8px;">${esc(doc.levels[store.textFoldLevel])}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
          <div style="display:flex;gap:4px;flex-wrap:wrap;">${(n.tags || []).map(t => `<span class="badge-chip badge-muted" style="font-size:10px;padding:1px 6px;">${esc(t)}</span>`).join('')}</div>
          <span style="font-family:var(--mono);font-size:10px;color:var(--accent);">${doc.hash}</span>
        </div>
        ${rootTree?.children?.length ? `
          <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px;">
            <div style="font-size:10.5px;font-weight:600;color:var(--text-muted);">查看子规则与源码证据：</div>
            ${rootTree.children.map(ch => `
              <button class="fe-row" style="cursor:pointer;text-align:left;justify-content:space-between;width:100%;" data-drill-node="${ch.nodeKey}" data-drill-lbl="${esc(ch.label)}">
                <span style="font-size:11.5px;font-weight:600;color:var(--ink);">${esc(ch.label)}</span>
                <span style="font-family:var(--mono);font-size:10px;color:var(--accent);">${esc(ch.meta)} →</span>
              </button>`).join('')}
          </div>` : ''}
        ${n.kind === 'decision' ? `
          <table class="truth-table" style="font-size:11px;margin-top:0;">
            <thead><tr><th>design.md</th><th>tasks.md</th><th>分支绑定</th><th>stage</th></tr></thead>
            <tbody>
              <tr><td>无</td><td>无</td><td>无</td><td><strong>draft</strong></td></tr>
              <tr><td>有</td><td>有</td><td>无</td><td><strong>planned</strong></td></tr>
              <tr><td>有</td><td>有</td><td>有</td><td><strong>full</strong></td></tr>
            </tbody>
          </table>` : ''}`;
    }

    function wireInPlaceEvents(div, n) {
      const tfSlot = div.querySelector('[data-inplace-tf]');
      if (tfSlot) tfSlot.appendChild(renderTextFoldPill());
      div.querySelectorAll('[data-drill-pop]').forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const lvl = Number(btn.dataset.drillPop);
          store.inPlaceDrill[n.id] = (store.inPlaceDrill[n.id] || []).slice(0, lvl);
          render();
        };
      });
      div.querySelectorAll('[data-ip-state]').forEach(g => {
        g.onclick = (ev) => {
          ev.stopPropagation();
          const targetUid = g.dataset.ipState;
          store.inPlaceFocusState[n.id] = store.inPlaceFocusState[n.id] === targetUid ? null : targetUid;
          render();
        };
      });
      div.querySelectorAll('[data-ip-clear]').forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          store.inPlaceFocusState[n.id] = null;
          render();
        };
      });
      div.querySelectorAll('[data-drill-node]').forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const cur = store.inPlaceDrill[n.id] || [];
          store.inPlaceDrill[n.id] = [...cur, { level: cur.length + 1, nodeKey: btn.dataset.drillNode, label: btn.dataset.drillLbl }];
          render();
        };
      });
      div.querySelectorAll('[data-jump-sub]').forEach(btn => {
        btn.onclick = (ev) => { ev.stopPropagation(); openInNewTab('doc', btn.dataset.jumpSub, btn.dataset.jumpSub); };
      });
      div.querySelectorAll('[data-open-subtab]').forEach(btn => {
        btn.onclick = (ev) => {
          ev.stopPropagation();
          const subId = btn.dataset.openSubtab;
          openInNewTab('machine', n.machineId, n.title);
          diveIntoSubMachine(subId, store.baselines[subId]?.capability || subId);
        };
      });
      div.querySelectorAll('[data-open-float]').forEach(btn => {
        btn.onclick = (ev) => { ev.stopPropagation(); openFloatingWindow(n.kind === 'machine' ? 'machine' : 'doc', n.kind === 'machine' ? n.machineId : n.id, n.title, div); };
      });
    }

    // =========================================================================
    // 8a-1. Minimizable Live Floating Editor Windows + Minimized Tray!
    // =========================================================================
    function renderFloatWindows() {
      // Simplified 2-layer navigation: In-Place Preview + Dedicated Tab (Floating Editor Windows removed!)
      const layer = document.getElementById('floatWindowsLayer');
      const tray = document.getElementById('minimizedTray');
      if (layer) layer.innerHTML = '';
      if (tray) { tray.classList.add('hidden'); tray.innerHTML = ''; }
      return;
      /* legacy floating windows retired */

      const minimized = store.floatWins.filter(w => w.minimized);
      if (!minimized.length || store.dagExpanded) {
        tray.classList.add('hidden');
      } else {
        tray.classList.remove('hidden');
        const bottomDockHidden = document.getElementById('bottomCenterDock')?.style.display === 'none';
        tray.style.bottom = bottomDockHidden ? '12px' : '58px';
        minimized.forEach(w => {
          const diff = w.kind === 'machine' ? computeDiff(w.targetId) : null;
          const chip = document.createElement('div');
          chip.className = 'min-chip';
          chip.innerHTML = `${w.kind === 'machine' ? ICONS.machine(12) : ICONS.decision(12)}<span>${esc(w.title)}</span>${diff?.hasChanges ? `<span class="live-dot" title="有实时草稿改动"></span>` : ''}<span data-x="1" style="opacity:0.6;display:inline-flex;">${ICONS.close(10)}</span>`;
          chip.onclick = () => { w.minimized = false; render(); focusWindow(document.getElementById(w.id)); };
          chip.querySelector('[data-x]').onclick = (ev) => { ev.stopPropagation(); store.floatWins = store.floatWins.filter(x => x.id !== w.id); render(); };
          tray.appendChild(chip);
        });
      }

      if (store.dagExpanded) return;

      store.floatWins.filter(w => !w.minimized).forEach(w => {
        const win = document.createElement('div');
        win.className = 'float-editor-win float-win';
        win.id = w.id;
        win.style.left = `${w.x}px`;
        win.style.top = `${w.y}px`;

        if (w.kind === 'machine' && store.drafts[w.targetId]) {
          const m = store.drafts[w.targetId];
          const diff = computeDiff(w.targetId);
          const diffTag = diff.hasChanges
            ? `<span class="badge-chip badge-green" style="font-size:10px;">+${diff.statesAdded.length}态 ~${diff.statesRenamed.length + diff.edgesModified.length}改</span>`
            : `<span class="badge-chip badge-muted" style="font-size:10px;">与基准一致</span>`;

          const hlMap = new Map(), eColMap = new Map();
          diff.statesAdded.forEach(u => hlMap.set(u, 'add'));
          diff.statesRenamed.forEach(r => hlMap.set(r.uid, 'mod'));
          diff.edgesAdded.forEach(u => eColMap.set(u, '#0f7b55'));
          diff.edgesModified.forEach(x => eColMap.set(x.uid, '#9a5b13'));

          win.innerHTML = `
            <div class="fe-head drag-handle" data-drag="1" title="拖动移动 · 双击居中">
              <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                <span class="drag-grip">⋮⋮</span>
                ${ICONS.machine(13)}
                <strong style="font-size:12.5px;color:var(--ink);">${esc(w.title)}</strong>
                ${diffTag}
              </div>
              <div style="display:flex;align-items:center;gap:2px;">
                <button class="ibtn icon-only" data-min="1" title="最小化到底部托盘">${ICONS.minimize(12)}</button>
                <button class="ibtn icon-only" data-tab="1" title="升格为独立沉浸 Tab">${ICONS.external(12)}</button>
                <button class="ibtn icon-only" data-close="1" title="关闭悬浮窗">${ICONS.close(12)}</button>
              </div>
            </div>
            <div class="fe-body">
              <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:4px;">
                ${renderMiniMachineSvg(m, hlMap, eColMap).replace('height:240px', 'height:142px')}
              </div>
              <div class="section">
                <div class="section-title">
                  <span>实时状态编辑（同步全景画布）</span>
                  <button class="mini-act" data-add-st="1">${ICONS.plus(10)}新状态</button>
                </div>
                <div style="display:flex;flex-direction:column;gap:5px;" data-st-list="1"></div>
              </div>
              <div class="section">
                <div class="section-title"><span>转移守卫快速编辑</span></div>
                <div style="display:flex;flex-direction:column;gap:5px;" data-ed-list="1"></div>
              </div>
            </div>
          `;

          const stList = win.querySelector('[data-st-list]');
          m.states.forEach(s => {
            const row = document.createElement('div'); row.className = 'fe-row';
            row.innerHTML = `<span style="font-family:var(--mono);font-size:10px;color:var(--text-muted);width:26px;">${s.uid}</span><input value="${esc(s.name)}" title="回车或失焦实时同步"/><button class="ibtn icon-only" style="height:22px;width:22px;" title="删除状态">${ICONS.trash(11)}</button>`;
            const inp = row.querySelector('input');
            inp.onchange = () => {
              const nv = inp.value.trim();
              if (!nv || nv === s.name) return;
              const old = s.name;
              s.name = nv; recordMachineCommit(`悬浮窗改名: ${old} → ${nv}`, w.targetId); toast(`已同步改名 →「${nv}」`); render();
            };
            row.querySelector('button').onclick = () => {
              if (m.states.length <= 2) { toast('至少保留 2 个状态（E1 门禁）'); return; }
              m.states = m.states.filter(x => x.uid !== s.uid);
              m.transitions = m.transitions.filter(e => e.fromUid !== s.uid && e.toUid !== s.uid);
              recordMachineCommit(`悬浮窗删态: ${s.name}`, w.targetId);
              toast(`已删除状态「${s.name}」（全景已同步）`); render();
            };
            stList.appendChild(row);
          });

          const edList = win.querySelector('[data-ed-list]');
          m.transitions.slice(0, 4).forEach(e => {
            const fn = m.states.find(x => x.uid === e.fromUid)?.name || e.fromUid;
            const tn = m.states.find(x => x.uid === e.toUid)?.name || e.toUid;
            const row = document.createElement('div'); row.className = 'fe-row';
            row.innerHTML = `<span style="font-size:11px;color:var(--text-muted);white-space:nowrap;">${esc(fn.slice(0,4))}→${esc(tn.slice(0,4))}</span><input value="${esc(e.event)}" placeholder="事件" style="max-width:72px;"/><input value="${esc(e.guard || '')}" placeholder="守卫(可空)" style="font-family:var(--mono);font-size:10.5px;"/>`;
            const [evInp, gdInp] = row.querySelectorAll('input');
            evInp.onchange = () => { e.event = evInp.value.trim() || e.event; recordMachineCommit(`改事件: ${e.event}`, w.targetId); toast('已同步转移事件'); render(); };
            gdInp.onchange = () => { e.guard = gdInp.value.trim(); recordMachineCommit(`改守卫: ${e.guard || '清空'}`, w.targetId); toast('已同步转移守卫'); render(); };
            edList.appendChild(row);
          });

          win.querySelector('[data-add-st]').onclick = () => {
            const uid = `s${Date.now() % 10000}`;
            const nm = `新状态${m.states.length + 1}`;
            m.states.push({ uid, name: nm, x: 520, y: 520, desc: '悬浮窗新建' });
            recordMachineCommit(`悬浮窗新增: ${nm}`, w.targetId);
            toast('已新增状态（全景原地预览实时更新）'); render();
          };
        } else {
          const doc = TF_DOCS[w.targetId] || TF_DOCS['change-lifecycle'];
          win.innerHTML = `
            <div class="fe-head drag-handle" data-drag="1">
              <div style="display:flex;align-items:center;gap:6px;"><span class="drag-grip">⋮⋮</span>${ICONS.decision(13)}<strong style="font-size:12.5px;">${esc(w.title)}</strong></div>
              <div style="display:flex;align-items:center;gap:2px;">
                <button class="ibtn icon-only" data-min="1" title="最小化">${ICONS.minimize(12)}</button>
                <button class="ibtn icon-only" data-tab="1" title="转为独立 Tab">${ICONS.external(12)}</button>
                <button class="ibtn icon-only" data-close="1" title="关闭">${ICONS.close(12)}</button>
              </div>
            </div>
            <div class="fe-body">
              <div data-tf="1"></div>
              <div class="card card-warm" style="white-space:pre-wrap;">${esc(doc.levels[store.textFoldLevel])}</div>
            </div>
          `;
          win.querySelector('[data-tf]').appendChild(renderTextFoldPill());
        }

        win.querySelector('[data-min]').onclick = () => { w.minimized = true; toast(`已最小化「${w.title}」到底部托盘`); render(); };
        win.querySelector('[data-tab]').onclick = () => { store.floatWins = store.floatWins.filter(x => x.id !== w.id); openInNewTab(w.kind, w.targetId, w.title); };
        win.querySelector('[data-close]').onclick = () => { store.floatWins = store.floatWins.filter(x => x.id !== w.id); render(); };

        // Draggable by titlebar
        win.onmousedown = () => focusWindow(win);
        const handle = win.querySelector('[data-drag]');
        handle.onmousedown = (ev) => {
          if (ev.button !== 0 || ev.target.closest('button')) return;
          ev.preventDefault(); focusWindow(win); closeAllTransient(true);
          const r = win.getBoundingClientRect(), ox = ev.clientX - r.left, oy = ev.clientY - r.top;
          startDragSession((m) => {
            w.x = Math.max(8, Math.min(window.innerWidth - 160, m.clientX - ox));
            w.y = Math.max(50, Math.min(window.innerHeight - 70, m.clientY - oy));
            win.style.left = `${w.x}px`; win.style.top = `${w.y}px`;
          });
        };
        layer.appendChild(win);
      });
    }

    // =========================================================================
    // 7.5 Interactive Edge Operations & Port-to-Port Drag-to-Connect
    // =========================================================================
    function getActiveMacroGraphRefs() {
      const tab = TABS.find(t => t.id === store.activeTabId);
      return tab?.stress ? { nodes: store.largeForest.nodes, edges: store.largeForest.edges } : { nodes: store.forestNodes, edges: store.forestEdges };
    }

    function reverseMacroEdge(edgeId) {
      if (!guardEditable('__macro__')) return;
      const { edges } = getActiveMacroGraphRefs();
      const e = edges.find(x => x.id === edgeId);
      if (!e) return;
      const tmp = e.from; e.from = e.to; e.to = tmp;
      recordMacroCommit(`反转连线: ${e.from} → ${e.to}`);
      toast(`已反转连线方向：${e.from} → ${e.to}`);
      render();
    }

    function toggleMacroEdgeKind(edgeId) {
      if (!guardEditable('__macro__')) return;
      const { edges } = getActiveMacroGraphRefs();
      const e = edges.find(x => x.id === edgeId);
      if (!e) return;
      e.kind = e.kind === 'spec-ref' ? 'manual' : 'spec-ref';
      recordMacroCommit(`切线型: ${e.from}→${e.to} (${e.kind === 'spec-ref' ? '实线' : '虚线'})`);
      toast(e.kind === 'spec-ref' ? '已切换为「规格引用」（实线）' : '已切换为「手工关联」（虚线）');
      render();
    }

    function deleteMacroEdge(edgeId) {
      if (!guardEditable('__macro__')) return;
      const tab = TABS.find(t => t.id === store.activeTabId);
      const { edges } = getActiveMacroGraphRefs();
      const old = edges.find(x => x.id === edgeId);
      if (tab?.stress) store.largeForest.edges = store.largeForest.edges.filter(x => x.id !== edgeId);
      else store.forestEdges = store.forestEdges.filter(x => x.id !== edgeId);
      if (store.selected?.kind === 'macro-edge' && store.selected.id === edgeId) {
        store.selected = null; store.selectedEdgeAnchor = null;
      }
      if (!tab?.stress && old) recordMacroCommit(`删除连线: ${old.from}→${old.to}`);
      toast('已删除规格连线');
      render();
    }

    function focusMacroNode(nodeId) {
      const { nodes } = getActiveMacroGraphRefs();
      const n = nodes.find(x => x.id === nodeId);
      if (!n) return;
      store.smoothCam = true;
      store.cam.x = window.innerWidth / 2 - n.x * store.cam.zoom;
      store.cam.y = window.innerHeight / 2 - n.y * store.cam.zoom;
      store.selected = { kind: 'forest', id: n.id }; store.selectedEdgeAnchor = null;
      render();
    }

    function reverseDrillEdge(edgeUid) {
      if (!guardEditable(store.activeMachineId)) return;
      const draft = store.drafts[store.activeMachineId];
      const e = draft.transitions.find(x => x.uid === edgeUid);
      if (!e) return;
      const tmp = e.fromUid; e.fromUid = e.toUid; e.toUid = tmp;
      enterDraft();
      recordMachineCommit(`反转转移: ${stateName(e.fromUid, draft)} → ${stateName(e.toUid, draft)}`);
      toast(`已反转转移方向：${stateName(e.fromUid, draft)} → ${stateName(e.toUid, draft)}`);
      render();
    }

    function insertStateOnEdge(edgeUid) {
      if (!guardEditable(store.activeMachineId)) return;
      const draft = store.drafts[store.activeMachineId];
      const e = draft.transitions.find(x => x.uid === edgeUid);
      if (!e) return;
      const a = draft.states.find(s => s.uid === e.fromUid);
      const b = draft.states.find(s => s.uid === e.toUid);
      if (!a || !b) return;
      const newUid = `s${Date.now() % 10000}`;
      const newName = `中间态${draft.states.length + 1}`;
      const mx = a.uid === b.uid ? a.x : Math.round((a.x + b.x) / 2);
      const my = a.uid === b.uid ? a.y - 130 : Math.round((a.y + b.y) / 2 - 22);
      draft.states.push({ uid: newUid, name: newName, x: mx, y: my, desc: `由「${e.event}」拆入` });
      const oldTo = e.toUid;
      e.toUid = newUid;
      draft.transitions.push({ uid: `e${Date.now() % 10000 + 1}`, fromUid: newUid, toUid: oldTo, event: '继续', guard: '' });
      enterDraft();
      recordMachineCommit(`线上插态: ${newName}`);
      store.selected = { kind: 'state', id: newUid }; store.selectedEdgeAnchor = null;
      store.drawerTab = 'edit';
      toast('已在线上插入中间状态（已记入时间线）');
      render();
    }

    function deleteDrillEdge(edgeUid) {
      if (!guardEditable(store.activeMachineId)) return;
      const draft = store.drafts[store.activeMachineId];
      const old = draft.transitions.find(x => x.uid === edgeUid);
      draft.transitions = draft.transitions.filter(x => x.uid !== edgeUid);
      if (store.selected?.kind === 'edge' && store.selected.id === edgeUid) {
        store.selected = null; store.selectedEdgeAnchor = null;
      }
      enterDraft();
      if (old) recordMachineCommit(`删转移: ${stateName(old.fromUid, draft)}→${stateName(old.toUid, draft)}`);
      toast('已删除状态转移');
      render();
    }

    function spawnDownstreamState(fromUid) {
      if (!guardEditable(store.activeMachineId)) return;
      const draft = store.drafts[store.activeMachineId];
      const src = draft.states.find(s => s.uid === fromUid);
      if (!src) return;
      const isFlow = curBase()?.graphKind === 'flow';
      const newUid = `${isFlow ? 'f' : 's'}${Date.now() % 10000}`;
      const newName = `${isFlow ? '新步骤' : '新状态'}${draft.states.length + 1}`;
      draft.states.push({ uid: newUid, name: newName, x: Math.round(src.x + 280), y: Math.round(src.y + (Math.random() * 80 - 40)), desc: 'Tab 快捷新建' });
      draft.transitions.push({ uid: `e${Date.now() % 10000 + 1}`, fromUid, toUid: newUid, event: '下一步', guard: '' });
      enterDraft();
      recordMachineCommit(`Tab 速建: ${src.name} → ${newName}`);
      store.selected = { kind: 'state', id: newUid }; store.selectedEdgeAnchor = null;
      toast(`已快捷新建下游${isFlow ? '步骤' : '状态'}「${newName}」并连线`);
      render();
    }

    function openInlineEdgeEditor(kind, id, worldX, worldY) {
      if (!guardEditable(kind === 'macro-edge' ? '__macro__' : store.activeMachineId)) return;
      const box = document.getElementById('inlineEdgeEditor');
      if (!box) return;
      let curText = '', placeholder = '';
      if (kind === 'macro-edge') {
        const e = getActiveMacroGraphRefs().edges.find(x => x.id === id);
        if (!e) return;
        curText = e.label;
        placeholder = '输入关系标签，回车保存...';
      } else {
        const e = store.drafts[store.activeMachineId].transitions.find(x => x.uid === id);
        if (!e) return;
        curText = e.guard ? `${e.event} [${e.guard}]` : e.event;
        placeholder = '事件 [可选守卫]，回车保存...';
      }
      const sx = Math.max(120, Math.min(window.innerWidth - 120, worldX * store.cam.zoom + store.cam.x));
      const sy = Math.max(70, Math.min(window.innerHeight - 70, worldY * store.cam.zoom + store.cam.y));
      box.style.left = `${Math.round(sx)}px`;
      box.style.top = `${Math.round(sy)}px`;
      box.classList.remove('hidden');
      box.innerHTML = `<input id="inlineEdgeInp" value="${esc(curText)}" placeholder="${placeholder}"/>`;
      const inp = box.querySelector('#inlineEdgeInp');
      inp.focus(); inp.select();
      let committed = false;
      const closeBox = () => { box.classList.add('hidden'); box.innerHTML = ''; };
      const commit = () => {
        if (committed) return;
        committed = true;
        const val = inp.value.trim();
        closeBox();
        if (!val) return;
        if (kind === 'macro-edge') {
          const e = getActiveMacroGraphRefs().edges.find(x => x.id === id);
          if (e && e.label !== val) {
            e.label = val;
            recordMacroCommit(`改连线标签: ${val}`);
            toast('已更新连线标签');
            render();
          }
        } else {
          const draft = store.drafts[store.activeMachineId];
          const e = draft.transitions.find(x => x.uid === id);
          if (!e) return;
          const m = val.match(/^([^\[\]]+?)(?:\s*\[(.*)\])?$/);
          const evName = (m?.[1] || val).trim();
          const gdName = (m?.[2] || '').trim();
          if (evName !== e.event || gdName !== (e.guard || '')) {
            e.event = evName || e.event;
            e.guard = gdName;
            enterDraft();
            recordMachineCommit(`改转移: ${e.event}${e.guard ? ` [${e.guard}]` : ''}`);
            toast('已就地更新转移事件/守卫');
            render();
          }
        }
      };
      inp.onkeydown = (ev) => {
        ev.stopPropagation();
        if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
        else if (ev.key === 'Escape') { committed = true; closeBox(); }
      };
      inp.onblur = () => commit();
    }

    function startEdgeEndpointDrag(ev, mode, edgeId, endKind, fixedX, fixedY) {
      if (!guardEditable(mode === 'macro' ? '__macro__' : store.activeMachineId)) return;
      ev.stopPropagation(); ev.preventDefault();
      closeAllTransient(true);
      const svgEl = document.querySelector('#worldLayer svg.edges-layer');
      if (!svgEl) return;
      const livePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      livePath.setAttribute('class', 'live-connect-line');
      svgEl.appendChild(livePath);

      let hoveredTargetEl = null;
      const selClass = mode === 'macro' ? '.forest-node' : '.sm-node';

      startDragSession((m) => {
        const mx = (m.clientX - store.cam.x) / store.cam.zoom;
        const my = (m.clientY - store.cam.y) / store.cam.zoom;
        const sx = endKind === 'source' ? mx : fixedX, sy = endKind === 'source' ? my : fixedY;
        const tx = endKind === 'source' ? fixedX : mx, ty = endKind === 'source' ? fixedY : my;
        const { d } = computeEdgeGeom(sx, sy, tx, ty, store.edgePreset, 0, -24);
        livePath.setAttribute('d', d);
        const el = document.elementFromPoint(m.clientX, m.clientY)?.closest(selClass);
        if (hoveredTargetEl && hoveredTargetEl !== el) hoveredTargetEl.classList.remove('connect-target');
        hoveredTargetEl = el;
        if (hoveredTargetEl?.dataset.nodeId) hoveredTargetEl.classList.add('connect-target');
      }, (cancelled) => {
        livePath.remove();
        if (hoveredTargetEl) hoveredTargetEl.classList.remove('connect-target');
        if (cancelled || !hoveredTargetEl) return;
        const targetId = hoveredTargetEl.dataset.nodeId;
        if (!targetId) return;
        if (mode === 'macro') {
          const e = getActiveMacroGraphRefs().edges.find(x => x.id === edgeId);
          if (!e) return;
          if (endKind === 'source') {
            if (targetId === e.to) { toast('规格连线暂不支持自环'); return; }
            if (targetId !== e.from) { e.from = targetId; recordMacroCommit(`重连起点: ${e.from}→${e.to}`); toast(`已将连线起点重连至「${targetId}」`); render(); }
          } else {
            if (targetId === e.from) { toast('规格连线暂不支持自环'); return; }
            if (targetId !== e.to) { e.to = targetId; recordMacroCommit(`重连终点: ${e.from}→${e.to}`); toast(`已将连线终点重连至「${targetId}」`); render(); }
          }
        } else {
          const draft = store.drafts[store.activeMachineId];
          const e = draft.transitions.find(x => x.uid === edgeId);
          if (!e) return;
          if (endKind === 'source' && targetId !== e.fromUid) {
            e.fromUid = targetId; enterDraft();
            recordMachineCommit(`重连起点: ${stateName(e.fromUid, draft)}→${stateName(e.toUid, draft)}`);
            toast(`已将转移起点重连至「${stateName(targetId, draft)}」`); render();
          } else if (endKind === 'target' && targetId !== e.toUid) {
            e.toUid = targetId; enterDraft();
            recordMachineCommit(`重连终点: ${stateName(e.fromUid, draft)}→${stateName(e.toUid, draft)}`);
            toast(`已将转移终点重连至「${stateName(targetId, draft)}」`); render();
          }
        }
      });
    }

    function startPortDrag(ev, mode, sourceId, side) {
      if (!guardEditable(mode === 'macro' ? '__macro__' : store.activeMachineId)) return;
      if (mode === 'drill' && store.mode === 'simulate') { toast('当前为单步试跑模式，退出试跑后再连线'); return; }
      ev.stopPropagation();
      ev.preventDefault();
      closeAllTransient(true);
      const svgEl = document.querySelector('#worldLayer svg.edges-layer');
      if (!svgEl) return;
      const srcRect = ev.currentTarget.getBoundingClientRect();
      const sx = (srcRect.left + srcRect.width / 2 - store.cam.x) / store.cam.zoom;
      const sy = (srcRect.top + srcRect.height / 2 - store.cam.y) / store.cam.zoom;

      const livePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      livePath.setAttribute('class', 'live-connect-line');
      svgEl.appendChild(livePath);

      let hoveredTargetEl = null;
      let lastWorldX = sx, lastWorldY = sy, lastClientX = ev.clientX, lastClientY = ev.clientY, movedDist = 0;
      const selClass = mode === 'macro' ? '.forest-node' : '.sm-node';

      startDragSession((m) => {
        const tx = (m.clientX - store.cam.x) / store.cam.zoom;
        const ty = (m.clientY - store.cam.y) / store.cam.zoom;
        lastWorldX = tx; lastWorldY = ty; lastClientX = m.clientX; lastClientY = m.clientY;
        movedDist = Math.hypot(tx - sx, ty - sy);
        const dx = Math.max(40, Math.abs(tx - sx) * 0.45) * (side === 'r' ? 1 : -1);
        livePath.setAttribute('d', `M ${sx} ${sy} C ${sx + dx} ${sy}, ${tx - dx * 0.5} ${ty}, ${tx} ${ty}`);
        const el = document.elementFromPoint(m.clientX, m.clientY)?.closest(selClass);
        if (hoveredTargetEl && hoveredTargetEl !== el) hoveredTargetEl.classList.remove('connect-target');
        hoveredTargetEl = el;
        if (hoveredTargetEl) {
          const tid = hoveredTargetEl.dataset.nodeId;
          if (tid && (mode === 'drill' || tid !== sourceId)) hoveredTargetEl.classList.add('connect-target');
          else { hoveredTargetEl.classList.remove('connect-target'); hoveredTargetEl = null; }
        }
      }, (cancelled) => {
        livePath.remove();
        if (hoveredTargetEl) hoveredTargetEl.classList.remove('connect-target');
        if (cancelled) return;
        if (hoveredTargetEl) {
          const targetId = hoveredTargetEl.dataset.nodeId;
          if (targetId) {
            if (mode === 'macro' && targetId !== sourceId) {
              const { edges } = getActiveMacroGraphRefs();
              const eid = `me_${Date.now() % 10000}`;
              edges.push({ id: eid, from: sourceId, to: targetId, kind: 'manual', label: '手工关联' });
              recordMacroCommit(`拖线关联: ${sourceId} → ${targetId}`);
              store.selected = { kind: 'macro-edge', id: eid }; store.edgeDrawerOpen = false;
              toast(`已拖拽新建关联：${sourceId} → ${targetId}（双击标签可就地改名）`);
              render();
            } else if (mode === 'drill') {
              const draft = store.drafts[store.activeMachineId];
              const eid = `e${Date.now() % 10000}`;
              draft.transitions.push({ uid: eid, fromUid: sourceId, toUid: targetId, event: sourceId === targetId ? '重试' : '新事件', guard: '' });
              enterDraft();
              recordMachineCommit(`拖线转移: ${stateName(sourceId, draft)} → ${stateName(targetId, draft)}`);
              store.selected = { kind: 'edge', id: eid }; store.edgeDrawerOpen = false;
              toast(sourceId === targetId ? '已拖拽新建自环转移' : `已拖拽新建转移（双击标签就地改事件/守卫）`);
              render();
            }
          }
        } else if (movedDist > 42) {
          // ThoughtDAG-inspired Connect-Drop Choice Menu: ask what to create or cancel!
          store.pendingDropWire = { mode, sourceId, side, sx, sy, wx: lastWorldX, wy: lastWorldY };
          if (mode === 'macro') renderMacro(); else renderDrillMachine();
          openRadialMenu(lastClientX, lastClientY, { kind: 'connect-drop', mode, sourceId, wx: lastWorldX, wy: lastWorldY });
        }
      });
    }

    function createGroupFromSelection() {
      const ids = [...store.selectedNodeIds];
      if (!ids.length) { toast('请先框选或 Shift+点击至少 1 个节点'); return; }
      const tones = ['blue', 'teal', 'amber'];
      const nextIdx = store.macroGroups.length + 1;
      openGroupNamePrompt(
        `打包为领域分组（${ids.length} 个规格）`,
        '例如：订单履约域 / 财务对账域',
        `业务领域组 ${nextIdx}`,
        '创建分组',
        (name) => {
          // Remove selected ids from any old groups so each spec belongs cleanly to one spatial group
          store.macroGroups.forEach(g => { g.nodeIds = g.nodeIds.filter(id => !ids.includes(id)); });
          store.macroGroups = store.macroGroups.filter(g => g.nodeIds.length > 0);
          store.macroGroups.push({
            id: `grp_${Date.now() % 10000}`,
            title: name,
            tone: tones[store.macroGroups.length % tones.length],
            nodeIds: ids,
            collapsed: false,
          });
          enforceExclusiveGroupSpaces(store.forestNodes, store.macroGroups);
          store.selectedNodeIds.clear();
          store.toolMode = 'pan';
          toast(`已创建领域分组「${name}」（支持整组拖拽、折叠与一键建 Tab）`);
          render();
        }
      );
    }

      const ids = [...new Set(nodeIds)];
      if (!ids.length) return;
      openGroupNamePrompt(
        `创建专属领域 Tab 视图（${ids.length} 个规格）`,
        '输入新 Tab 名称...',
        suggestedTitle || `领域视图 (${ids.length})`,
        '创建并打开 Tab',
        (name) => {
          const tabId = sourceGroupId ? `grp_tab_${sourceGroupId}` : `grp_tab_${Date.now() % 100000}`;
          store.selectedNodeIds.clear();
          store.toolMode = 'pan';
          openInNewTab('macro', tabId, name, { nodeIds: ids, sourceGroupId, showExternalHops: false });
        }
      );

    function batchTagSelection() {
      const ids = [...store.selectedNodeIds];
      if (!ids.length) return;
      openGroupNamePrompt(
        `批量添加领域 Tag（${ids.length} 个规格）`,
        '例如：#checkout 或 #risk',

        '批量打标',
        (rawTag) => {

    function getMultiSelBarAnchor() {
      if (store.view === 'macro' && store.selectedNodeIds.size > 0) {
        const { nodes } = getVisibleMacroGraph();
        const picked = nodes.filter(n => store.selectedNodeIds.has(n.id));
        if (!picked.length) return null;
        let minX = Infinity, maxX = -Infinity, minY = Infinity;
        picked.forEach(n => {
          minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
          minY = Math.min(minY, n.y - 78);
        });
        return { x: (minX + maxX) / 2, y: minY };
      }
      if (store.view === 'drill-machine' && store.mode !== 'simulate' && store.selected?.kind === 'state') {
        const st = curDraft()?.states.find(s => s.uid === store.selected.id);
        if (!st) return null;
        return { x: st.x, y: st.y - (store.tier === 'work' ? 76 : 52) };
      }
      return null;
    }

    function renderMacro() {
      const { stage, world } = createWorldLayer();
      stage.classList.toggle('select-mode', store.toolMode === 'select');
      const { tab, nodes, edges, hiddenCount, extHopIds } = getVisibleMacroGraph();

      if (!nodes.length) {
        const ws = curWs();
        const empty = document.createElement('div');
        empty.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;';
        empty.innerHTML = `<div class="card" style="max-width:400px;padding:18px 20px;text-align:center;box-shadow:var(--shadow-float);">
          <div style="font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:6px;">当前视角暂无匹配规格</div>
          <div style="font-size:12px;color:var(--text-secondary);line-height:1.55;margin-bottom:12px;">工作区 <code style="font-family:var(--mono);">${esc(ws.repo)} · ${esc(ws.branch)}</code> 下没有命中「${esc(tab.tagFilter || tab.title)}」的规格节点。</div>
          <div style="display:flex;gap:8px;justify-content:center;">
            <button class="ibtn accent" id="emptyBackAll">回到全景</button>
            <button class="ibtn" id="emptySwitchLlman">切回 llman-sdd 示例</button>
          </div>
        </div>`;
        empty.querySelector('#emptyBackAll').onclick = () => activateTab('default');
        empty.querySelector('#emptySwitchLlman').onclick = () => switchWorkspace('llman-sdd@main@.', false);
        stage.appendChild(empty);
        return;
      }

      // Identify active domain groups visible on this Macro canvas (skip on stress 28-node view)
      const nodeMap = new Map(nodes.map(n => [n.id, n]));
      const activeGroups = tab.stress ? [] : store.macroGroups
        .map(g => ({ ...g, members: g.nodeIds.map(id => nodeMap.get(id)).filter(Boolean) }))
        .filter(g => g.members.length >= 2);
      const collapsedGroupOfNode = new Map();
      const collapsedGroupPos = new Map();
      activeGroups.forEach(g => {
        if (g.collapsed) {
          const cx = Math.round(g.members.reduce((s, n) => s + n.x, 0) / g.members.length);
          const cy = Math.round(g.members.reduce((s, n) => s + n.y, 0) / g.members.length);
          collapsedGroupPos.set(g.id, { x: cx, y: cy, group: g });
          g.members.forEach(m => collapsedGroupOfNode.set(m.id, g.id));
        }
      });

      const gOf = (id) => tab.groups ? tab.groups.findIndex(g => g.includes(id)) : 0;
      const isBr = (e) => tab.groups && gOf(e.from) !== gOf(e.to) && e.kind === 'spec-ref';
      const brNodes = new Set();
      if (store.bridgeOnly) edges.forEach(e => { if (isBr(e)) { brNodes.add(e.from); brNodes.add(e.to); } });

      const hoverDimOn = isHoverDimActive();
      const hvNbr = new Set();
      if (hoverDimOn) {
        hvNbr.add(store.hoveredId);
        edges.forEach(e => { if (e.from === store.hoveredId) hvNbr.add(e.to); if (e.to === store.hoveredId) hvNbr.add(e.from); });
      }
      const isDense = nodes.length > 12;
      const accentHex = cssVar('--accent', '#2f54eb'), mutedStroke = '#98a2b3';
      let foundSelectedEdge = false;

      // Render expanded Domain Group Frame containers behind edges & nodes (L0 hierarchy!)
      for (const g of activeGroups) {
        if (g.collapsed) continue;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        g.members.forEach(m => {
          const hw = store.expandedNodeIds.has(m.id) ? 258 : (store.tier === 'glyph' ? 75 : store.tier === 'map' ? 136 : 160);
          const hh = store.expandedNodeIds.has(m.id) ? 185 : (store.tier === 'glyph' ? 72 : store.tier === 'map' ? 86 : 122);
          minX = Math.min(minX, m.x - hw); maxX = Math.max(maxX, m.x + hw);
          minY = Math.min(minY, m.y - hh); maxY = Math.max(maxY, m.y + hh);
        });
        const padX = 28, padTop = 34, padBot = 24;
        const frame = document.createElement('div');
        frame.className = `group-frame tone-${g.tone || 'blue'}`;
        frame.style.left = `${Math.round(minX - padX)}px`;
        frame.style.top = `${Math.round(minY - padTop)}px`;
        frame.style.width = `${Math.round((maxX - minX) + padX * 2)}px`;
        frame.style.height = `${Math.round((maxY - minY) + padTop + padBot)}px`;
        frame.innerHTML = `
          <div class="group-head" data-grp-drag="1" title="按住拖动整组移动 · 双击标题改名">
            ${ICONS.folder(12)}
            <span class="group-title" data-grp-title="1">${esc(g.title)}</span>
            <span class="group-count">${g.members.length}</span>
            <span class="group-acts">
              <button class="group-btn" data-grp-tab="1" title="在专属 Tab 中专注编辑此分组">${ICONS.external(10)}<span>Tab</span></button>
              <button class="group-btn" data-grp-col="1" title="折叠为紧凑领域聚合卡">${ICONS.collapse(10)}</button>
              <button class="group-btn danger" data-grp-del="1" title="拆散此分组（保留节点）">${ICONS.close(10)}</button>
            </span>
          </div>
        `;
        const head = frame.querySelector('[data-grp-drag]');
        head.querySelector('[data-grp-tab]').onclick = (ev) => { ev.stopPropagation(); createTabFromNodeIds(g.nodeIds, g.title, g.id); };
        head.querySelector('[data-grp-col]').onclick = (ev) => { ev.stopPropagation(); toggleGroupCollapse(g.id); };
        head.querySelector('[data-grp-del]').onclick = (ev) => { ev.stopPropagation(); ungroupDomain(g.id); };
        head.ondblclick = (ev) => { if (ev.target.closest('button')) return; ev.stopPropagation(); renameGroup(g.id); };
        head.onmousedown = (ev) => {
          if (ev.button !== 0 || ev.target.closest('button')) return;
          ev.stopPropagation(); ev.preventDefault(); closeAllTransient(true);
          const sx = ev.clientX, sy = ev.clientY;
          const origPositions = g.members.map(m => ({ m, x: m.x, y: m.y }));
          startDragSession((mv) => {
            const dx = (mv.clientX - sx) / store.cam.zoom;
            const dy = (mv.clientY - sy) / store.cam.zoom;
            origPositions.forEach(({ m, x, y }) => { m.x = Math.round(x + dx); m.y = Math.round(y + dy); });
            render();
          });
        };
        world.appendChild(frame);
      }

      const wlDiff = getWorldlineLiveDiff('__macro__');
      const renderNodes = wlDiff
        ? [...nodes, ...wlDiff.removedItems.filter(r => !nodes.some(x => x.id === r.id))]
        : nodes;
      const renderEdges = wlDiff
        ? [...edges, ...wlDiff.removedEdges.filter(re => !edges.some(x => x.from === re.from && x.to === re.to && x.label === re.label))]
        : edges;

      const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svgEl.setAttribute('class', 'edges-layer'); svgEl.setAttribute('viewBox', '-1400 -1400 5200 4200');
      svgEl.innerHTML = `<defs>
        <marker id="ta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="${accentHex}"/></marker>
        <marker id="ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="${mutedStroke}"/></marker>
        <marker id="ta-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/></marker>
        <marker id="ta-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/></marker>
      </defs>`;

      const macroPlacedSegments = [];
      const macroPlacedLabels = [];
      for (const e of renderEdges) {
        const cgA = collapsedGroupOfNode.get(e.from), cgB = collapsedGroupOfNode.get(e.to);
        if (cgA && cgA === cgB) continue; // Internal edges hidden while domain group is collapsed
        const a = cgA ? collapsedGroupPos.get(cgA) : renderNodes.find(n => n.id === e.from);
        const b = cgB ? collapsedGroupPos.get(cgB) : renderNodes.find(n => n.id === e.to);
        if (!a || !b) continue;
        const br = isBr(e);
        const wlAddE = wlDiff?.addedEdgeIds.has(e.id);
        const wlRemE = !!e._wlRemoved;
        const isSel = !wlRemE && store.selected?.kind === 'macro-edge' && store.selected.id === e.id;
        const dim = !isSel && !wlAddE && !wlRemE && ((store.bridgeOnly && !br) || (hoverDimOn && e.from !== store.hoveredId && e.to !== store.hoveredId));
        const hl = isSel || wlAddE || wlRemE || (store.bridgeOnly && br) || (hoverDimOn && !dim);

        const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy) || 1;
        const hwA = cgA ? 136 : (store.expandedNodeIds.has(e.from) ? 250 : (store.tier === 'glyph' ? 68 : store.tier === 'map' ? 128 : 152));
        const hhA = cgA ? 82 : (store.expandedNodeIds.has(e.from) ? 180 : (store.tier === 'glyph' ? 66 : store.tier === 'map' ? 82 : 116));
        const hwB = cgB ? 136 : (store.expandedNodeIds.has(e.to) ? 250 : (store.tier === 'glyph' ? 68 : store.tier === 'map' ? 128 : 152));
        const hhB = cgB ? 82 : (store.expandedNodeIds.has(e.to) ? 180 : (store.tier === 'glyph' ? 66 : store.tier === 'map' ? 82 : 116));
        const trimA = hwA, trimB = hwB;
        const sx = a.x + (dx / dist) * Math.min(trimA, dist * 0.36), sy = a.y + (dy / dist) * Math.min(hhA, dist * 0.36);
        const tx = b.x - (dx / dist) * Math.min(trimB + 8, dist * 0.38), ty = b.y - (dy / dist) * Math.min(hhB + 8, dist * 0.38);
        const obsRects = [];
        for (const on of renderNodes) {
          if (on.id === e.from || on.id === e.to || collapsedGroupOfNode.has(on.id)) continue;
          const ohw = store.expandedNodeIds.has(on.id) ? 252 : (store.tier === 'glyph' ? 68 : store.tier === 'map' ? 130 : 154);
          const ohh = store.expandedNodeIds.has(on.id) ? 182 : (store.tier === 'glyph' ? 66 : store.tier === 'map' ? 82 : 116);
          obsRects.push({ x1: on.x - ohw, y1: on.y - ohh, x2: on.x + ohw, y2: on.y + ohh });
        }
        const geomRes = computeEdgeGeom(
          sx, sy, tx, ty, store.edgePreset, -(dy / dist) * 26, (dx / dist) * 26,
          obsRects, { ax: a.x, ay: a.y, bx: b.x, by: b.y, hwA, hhA, hwB, hhB },
          { placedSegments: macroPlacedSegments, manualOffset: e._bendOffset }
        );
        const dPath = geomRes.d;
        let lx = geomRes.lx, ly = geomRes.ly;
        if (geomRes.samplePts) {
          for (let i = 0; i < geomRes.samplePts.length - 1; i++) macroPlacedSegments.push([geomRes.samplePts[i], geomRes.samplePts[i + 1]]);
        }

        if (isSel) { store.selectedEdgeAnchor = { x: lx, y: ly }; foundSelectedEdge = true; }

        const grp = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        grp.setAttribute('class', 'edge-grp');

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'edge-vis');
        path.setAttribute('d', dPath); path.setAttribute('fill', 'none');
        path.setAttribute('stroke', wlRemE ? '#dc2626' : wlAddE ? '#15803d' : (hl ? accentHex : mutedStroke));
        path.setAttribute('stroke-width', store.tier === 'glyph' ? '3' : (isSel ? '2.6' : (wlAddE || wlRemE ? '2.2' : hl ? '2' : '1.5')));
        if (e.kind === 'manual' || wlRemE) path.setAttribute('stroke-dasharray', '5 4');
        path.setAttribute('opacity', dim ? '0.1' : (wlRemE ? '0.72' : (isDense && !hl ? '0.25' : '0.86')));
        path.setAttribute('marker-end', wlRemE ? 'url(#ta-r)' : wlAddE ? 'url(#ta-g)' : (hl ? 'url(#ta)' : 'url(#ga)'));
        grp.appendChild(path);

        const onEdgeClick = (ev) => {
          ev.stopPropagation();
          closeAllTransient(true);
          store.selected = { kind: 'macro-edge', id: e.id };
          store.edgeDrawerOpen = false;
          store.selectedEdgeAnchor = { x: lx, y: ly };
          if (checkDoubleClick(`macro-edge:${e.id}`)) {
            render();
            openInlineEdgeEditor('macro-edge', e.id, lx, ly);
            return;
          }
          render();
        };
        const onEdgeDblClick = (ev) => {
          ev.stopPropagation();
          store.selected = { kind: 'macro-edge', id: e.id };
          store.selectedEdgeAnchor = { x: lx, y: ly };
          openInlineEdgeEditor('macro-edge', e.id, lx, ly);
        };
        const onEdgeCtx = (ev) => {
          ev.preventDefault(); ev.stopPropagation();
          store.selected = { kind: 'macro-edge', id: e.id };
          store.selectedEdgeAnchor = { x: lx, y: ly };
          openRadialMenu(ev.clientX, ev.clientY, { kind: 'macro-edge', id: e.id });
        };

        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hit.setAttribute('d', dPath); hit.setAttribute('fill', 'none'); hit.setAttribute('stroke', 'transparent'); hit.setAttribute('stroke-width', '20');
        hit.setAttribute('class', 'edge-hit');
        hit.onclick = onEdgeClick; hit.ondblclick = onEdgeDblClick; hit.oncontextmenu = onEdgeCtx;
        grp.appendChild(hit);

        if (isSel) {
          const hSrc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          hSrc.setAttribute('class', 'edge-ep-handle'); hSrc.setAttribute('cx', sx); hSrc.setAttribute('cy', sy); hSrc.setAttribute('r', '6');
          hSrc.innerHTML = '<title>按住拖拽直接重连起点</title>';
          hSrc.onmousedown = (ev) => startEdgeEndpointDrag(ev, 'macro', e.id, 'source', tx, ty);
          grp.appendChild(hSrc);

          const hDst = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          hDst.setAttribute('class', 'edge-ep-handle'); hDst.setAttribute('cx', tx); hDst.setAttribute('cy', ty); hDst.setAttribute('r', '6');
          hDst.innerHTML = '<title>按住拖拽直接重连终点</title>';
          hDst.onmousedown = (ev) => startEdgeEndpointDrag(ev, 'macro', e.id, 'target', sx, sy);
          grp.appendChild(hDst);
        }

        if (store.tier !== 'glyph' && ((!isDense && !dim) || hl)) {
          const cCnt = store.comments.filter(c => c.machineId === '__macro__' && c.anchorKind === 'macro-edge' && c.anchorId === e.id && c.status !== 'resolved').length;
          const lbl = `${e.label}${cCnt ? ` (${cCnt})` : ''}`;
          const tw = lbl.length * 7.4 + 18;
          const lp = resolveLabelPos(lx, ly, tw, 20, macroPlacedLabels, obsRects);
          lx = lp.lx; ly = lp.ly;
          if (isSel) store.selectedEdgeAnchor = { x: lx, y: ly };
          const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          bg.setAttribute('class', 'edge-lbl-bg edge-label-hit');
          bg.setAttribute('x', lx - tw / 2); bg.setAttribute('y', ly - 10); bg.setAttribute('width', tw); bg.setAttribute('height', 20); bg.setAttribute('rx', 5);
          bg.setAttribute('fill', isSel ? cssVar('--accent-soft', '#edf2ff') : cssVar('--surface', '#ffffff'));
          bg.setAttribute('stroke', hl ? accentHex : cssVar('--border', '#dfe3eb'));
          bg.setAttribute('stroke-width', isSel ? '1.4' : '1');
          attachEdgeBendDrag(bg, e, onEdgeClick, onEdgeDblClick, onEdgeCtx);
          grp.appendChild(bg);
          const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          t.setAttribute('x', lx); t.setAttribute('y', ly + 3.5); t.setAttribute('text-anchor', 'middle');
          t.setAttribute('font-size', '10.5'); t.setAttribute('fill', hl ? accentHex : cssVar('--text-secondary', '#4b5465'));
          t.setAttribute('style', 'pointer-events:none;');
          t.textContent = lbl; grp.appendChild(t);
        }
        svgEl.appendChild(grp);
      }
      if (store.pendingDropWire && store.pendingDropWire.mode === 'macro') {
        const w = store.pendingDropWire;
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('class', 'live-connect-line');
        const dx = Math.max(40, Math.abs(w.wx - w.sx) * 0.45) * (w.side === 'r' ? 1 : -1);
        p.setAttribute('d', `M ${w.sx} ${w.sy} C ${w.sx + dx} ${w.sy}, ${w.wx - dx * 0.5} ${w.wy}, ${w.wx} ${w.wy}`);
        svgEl.appendChild(p);
      }
      if (store.selected?.kind === 'macro-edge' && !foundSelectedEdge) store.selectedEdgeAnchor = null;
      world.appendChild(svgEl);

      // Render collapsed Domain Group Cluster Cards (L0 folded view!)
      for (const [gid, info] of collapsedGroupPos.entries()) {
        const g = info.group;
        const card = document.createElement('div');
        card.className = `group-collapsed-card tone-${g.tone || 'blue'}`;
        card.style.left = `${info.x}px`; card.style.top = `${info.y}px`;
        card.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <div style="display:flex;align-items:center;gap:7px;">
              ${ICONS.layers(14)}
              <strong style="font-size:13px;color:var(--ink);">${esc(g.title)}</strong>
            </div>
            <span class="badge-chip badge-muted" style="font-size:10px;">${g.members.length} 规格</span>
          </div>
          <div class="group-member-chips">
            ${g.members.map(m => `<span class="group-member-chip">${esc(m.title)}</span>`).join('')}
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:7px;border-top:1px solid var(--surface-subtle);">
            <button class="mini-act" data-g-exp="1">${ICONS.expand(10)}展开组内节点</button>
            <button class="mini-act" data-g-tab="1">${ICONS.external(10)}在专属 Tab 打开</button>
          </div>
        `;
        card.querySelector('[data-g-exp]').onclick = (ev) => { ev.stopPropagation(); toggleGroupCollapse(gid); };
        card.querySelector('[data-g-tab]').onclick = (ev) => { ev.stopPropagation(); createTabFromNodeIds(g.nodeIds, g.title, g.id); };
        card.ondblclick = (ev) => { if (ev.target.closest('button')) return; ev.stopPropagation(); toggleGroupCollapse(gid); };
        card.onmousedown = (ev) => {
          if (ev.button !== 0 || ev.target.closest('button')) return;
          ev.stopPropagation(); ev.preventDefault(); closeAllTransient(true);
          const sx = ev.clientX, sy = ev.clientY;
          const origPositions = g.members.map(m => ({ m, x: m.x, y: m.y }));
          startDragSession((mv) => {
            const dx = (mv.clientX - sx) / store.cam.zoom;
            const dy = (mv.clientY - sy) / store.cam.zoom;
            origPositions.forEach(({ m, x, y }) => { m.x = Math.round(x + dx); m.y = Math.round(y + dy); });
            render();
          });
        };
        world.appendChild(card);
      }

      for (const n of renderNodes) {
        if (collapsedGroupOfNode.has(n.id)) continue;
        const div = document.createElement('div');
        const dim = (store.bridgeOnly && !brNodes.has(n.id)) || (hoverDimOn && !hvNbr.has(n.id));
        const rem = n.kind === 'machine' && store.draftModes[n.machineId] === 'remove';
        const isMulti = store.selectedNodeIds.has(n.id);
        const isExt = extHopIds && extHopIds.has(n.id);
        const sel = !n._wlRemoved && ((store.selected?.kind === 'forest' && store.selected.id === n.id) || (tab.stress && store.egoMode && n.id === store.egoFocusId));
        const km = KIND_META[n.kind] || KIND_META.doc, doc = resolveTextFold(n.machineId || n.docKey);
        const inPlace = !n._wlRemoved && store.expandedNodeIds.has(n.id);

        const wlAdded = wlDiff?.addedIds.has(n.id);
        const wlRemoved = !!n._wlRemoved;
        const wlTagHtml = wlAdded ? '<span class="wl-diff-tag add">+新增</span>' : wlRemoved ? '<span class="wl-diff-tag rem">-移除</span>' : '';
        div.className = ['forest-node', inPlace ? 'in-place-expanded' : `lod-${store.tier}`, `kind-${n.kind}`, sel ? 'selected' : '', isMulti ? 'multi-selected' : '', isExt ? 'ext-hop' : '', dim ? 'dimmed' : '', rem ? 'is-removed' : '', wlAdded ? 'wl-added' : '', wlRemoved ? 'wl-removed' : ''].filter(Boolean).join(' ');
        div.dataset.nodeId = n.id;
        div.style.left = `${n.x}px`; div.style.top = `${n.y}px`;

        const cCnt = store.comments.filter(c => c.machineId === '__macro__' && c.anchorKind === 'forest' && c.anchorId === n.id && c.status !== 'resolved').length;
        const mRepItem = store.executionReports['__macro__']?.items.find(it => it.anchorKind === 'forest' && it.anchorId === n.id);
        const repPinHtml = mRepItem
          ? `<div class="report-pin ${mRepItem.status === 'verified' ? 'verified' : mRepItem.status === 'blocked' ? 'blocked' : 'counter'}" data-mrep-id="${mRepItem.id}" title="${esc(mRepItem.title)}（点击查看回执证据）">${mRepItem.status === 'verified' ? '✓ 已验' : mRepItem.status === 'blocked' ? '⛔ 不可达' : '⇄ 反提案'}</div>`
          : '';
        const pinHtml = `${wlTagHtml}${repPinHtml}${cCnt ? `<div class="comment-pin" title="点击查看此规格的 ${cCnt} 条未解决评论">${cCnt}</div>` : ''}`;
        const vLvl = n.verifyLevel || (n.kind === 'doc' ? 'L0' : 'L1');
        const vLbl = vLvl === 'L0' ? '仅文档' : vLvl === 'L1' ? '已绑测试' : vLvl === 'L2' ? '防漂移' : '形式化';
        const vPillHtml = `<span class="hardness-pill ${vLvl}" title="约束强度：仅文档 / 已绑测试 / 防漂移 / 形式化">${vLbl}</span>`;
        if (inPlace) {
          div.innerHTML = `
            <span class="node-port l" title="按住拖拽拉出连线"></span><span class="node-port r" title="按住拖拽拉出连线"></span>
            <div class="inplace-head">
              <div style="display:flex;align-items:center;gap:7px;">
                <span class="type-icon-box ${n.kind}" style="width:24px;height:24px;">${km.icon(13)}</span>
                <strong style="font-size:13px;color:var(--ink);">${n.title}</strong>
              </div>
              <div class="mini-act-row">
                <button class="mini-act" data-open-tab="1" title="在独立新 Tab 沉浸编辑">${ICONS.external(11)}进入 Tab</button>
                <button class="mini-act" data-collapse="1" title="收起原地透视">${ICONS.collapse(11)}收起</button>
              </div>
            </div>
            <div class="inplace-body">${buildInPlaceContent(n)}</div>
          `;
          div.querySelector('[data-open-tab]').onclick = (ev) => { ev.stopPropagation(); (n.kind === 'machine' || n.kind === 'flow') ? openInNewTab('machine', n.machineId, n.title) : openInNewTab('doc', n.id, n.title); };
