      border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
      padding: 12px; overflow: auto;
    }
    .whatif-bar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 8px 10px; border-radius: 8px; background: var(--surface-subtle);
      border: 1px solid var(--border); margin-bottom: 10px; font-size: 11.5px;
    }
    .truth-table tr.wi-hit td { background: var(--green-soft); font-weight: 600; }
    .truth-table tr.wi-dim { opacity: 0.34; }

    /* Clickable Legend Filter Chips (Fig 3: unified into bottom-left legend!) */
    .legend-filter-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px;
      border: 1px solid transparent; background: transparent; color: var(--ink);
      font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.12s;
    }
    .legend-filter-btn:hover { background: var(--surface-subtle); border-color: var(--border); }
    .legend-filter-btn.off { opacity: 0.4; text-decoration: line-through; color: var(--text-muted); }
    .legend-cnt { font-family: var(--mono); font-size: 9.5px; color: var(--text-muted); font-weight: 500; }

    /* Unified [DEMO-SIM] Isolation Container (never shipped in production C3/C5/C6!) */
    .demo-sim-box {
      border: 1px dashed var(--amber); border-radius: 8px; padding: 7px 8px;
      background: var(--amber-soft); width: 100%;
    }
    .demo-sim-tag {
      display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono);
      font-size: 9.5px; font-weight: 700; color: var(--amber); margin-bottom: 5px;
    }

    /* Multi-Branch Timeline Tree & Worktree Bar */
    .tl-wt-strip {
      padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 10.5px; color: var(--text-secondary);
      flex-wrap: wrap;
    }
    .tl-item.branch-d1 { margin-left: 14px; border-left: 2px solid var(--accent); padding-left: 8px; }
    .tl-item.branch-d2 { margin-left: 28px; border-left: 2px solid var(--t-machine); padding-left: 8px; }
    .tl-item.is-agent-node { background: rgba(13, 122, 108, 0.04); }

    /* Steins;Gate Worldline Right Drawer (Proximity-Anchored to Top-Right Trigger!) + Live 1:1 Interactive Canvas Overlay Diff */
    .worldline-page {
      position: fixed; right: 12px; top: 56px; bottom: 14px; width: 344px; z-index: 44;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow-float); display: flex; flex-direction: column; overflow: hidden;
    }
    .worldline-page.hidden { display: none; }
    .wl-head {
      padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .wl-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .wl-foot { padding: 9px 10px; border-top: 1px solid var(--border); background: var(--surface-subtle); display: flex; flex-direction: column; gap: 6px; }
    .wl-tree-row {
      position: relative; padding: 8px 10px; border-radius: 9px; border: 1.5px solid var(--border);
      background: var(--surface); cursor: pointer; transition: border-color 0.12s, background 0.12s;
    }
    .wl-tree-row:hover { border-color: var(--border-strong); }
    .wl-tree-row.is-head { border-color: var(--green); background: var(--green-soft); }
    .wl-tree-row.is-cmp-a { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .wl-tree-row.is-lane-1 { margin-left: 16px; border-left: 3px solid var(--amber); }
    .wl-tree-row.is-lane-2 { margin-left: 30px; border-left: 3px solid var(--t-machine); }
    .wl-compare-banner {
      position: fixed; top: 54px; left: 50%; transform: translateX(-50%); z-index: 45;
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
      background: var(--ink); color: var(--surface); font-size: 11.5px; box-shadow: var(--shadow-float);
      transition: left 0.18s ease;
    }
    body.wl-open .wl-compare-banner { left: calc((100vw - 356px) / 2); }
    .wl-compare-banner.hidden { display: none; }
    .forest-node.wl-added, .sm-node.wl-added {
      border-color: var(--green) !important; box-shadow: 0 0 0 2.5px var(--green-soft) !important;
      background: var(--green-soft) !important;
    }
    .forest-node.wl-removed, .sm-node.wl-removed {
      border-style: dashed !important; border-color: var(--red) !important;
      background: var(--red-soft) !important; opacity: 0.82;
    }
    .forest-node.wl-changed, .sm-node.wl-changed {
      border-color: var(--amber) !important; box-shadow: 0 0 0 2.5px var(--amber-soft) !important;
    }
    .wl-diff-tag {
      position: absolute; top: -10px; right: 10px; z-index: 7; padding: 1px 6px; border-radius: 999px;
      font-size: 9.5px; font-weight: 700; font-family: var(--mono); box-shadow: var(--shadow-card);
    }
    .wl-diff-tag.add { background: var(--green); color: #fff; }
    .wl-diff-tag.rem { background: var(--red); color: #fff; }
    .wl-diff-tag.mod { background: var(--amber); color: #fff; }
    .rule-acc-item {
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface-subtle); overflow: hidden;
    }
    .rule-acc-head {
      padding: 8px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      cursor: pointer; user-select: none;
    }
    .rule-acc-head:hover { background: var(--surface); }
    .rule-acc-body { padding: 0 11px 9px; font-size: 12px; color: var(--text-secondary); line-height: 1.55; border-top: 1px dashed var(--border); padding-top: 7px; }
  </style>
</head>
<body>
  <div class="canvas-root" id="canvasRoot">

    <!-- L2: Docked Chrome -->
    <div class="top-left-dock" id="topLeftDock"></div>
    <div class="island return-pill hidden" id="returnOriginPill"></div>
    <div class="funnel-bar hidden" id="funnelBar"></div>
    <div class="top-right-dock" id="topRightDock"></div>
    <div class="triage-pill" id="triagePill" style="display:none"></div>
    <div class="island left-palette" id="leftPalette"></div>
    <div class="bottom-left-stack" id="bottomLeftStack">
      <div class="island legend-pill" id="legendPill"></div>
      <div class="island" id="lensDock"></div>
    </div>
    <div class="min-tray hidden" id="minimizedTray"></div>
    <div class="bottom-center-dock" id="bottomCenterDock"></div>
    <div class="minimap-island" id="minimapIsland"></div>

    <!-- L1: Canvas Stage -->
    <div class="stage" id="stage"></div>

    <!-- L3 / L5: Draggable Floating Windows -->
    <div class="dag-backdrop" id="dagBackdrop"></div>
    <aside class="dag-panel float-win hidden" id="dagPanel"></aside>

    <!-- Minimizable Floating Spec Editor Windows -->
    <div id="floatWindowsLayer"></div>

    <aside class="drawer float-win hidden" id="drawer">
      <div class="drawer-head drag-handle" id="drawerDragHead" title="拖动标题栏移动 · 双击复位">
        <div>
          <div class="drawer-eyebrow" id="drawerEyebrow">INSPECTOR</div>
          <h3 id="drawerTitle"><span class="drag-grip">⋮⋮</span>操作栏</h3>
          <p id="drawerSub"></p>
        </div>
        <button class="ibtn icon-only" id="btnCloseDrawer" aria-label="关闭"></button>
      </div>
      <div class="drawer-tabs hidden" id="drawerTabs"></div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot" id="drawerFoot"></div>
    </aside>

    <div id="hookSlot"></div>
    <div class="marquee-box hidden" id="marqueeBox"></div>
    <div class="edge-quickbar hidden" id="edgeQuickBar"></div>
    <div class="edge-quickbar hidden" id="multiSelBar"></div>
    <div class="tl-preview-banner hidden" id="timelinePreviewBanner"></div>
    <aside class="timeline-panel float-win hidden" id="timelinePanel"></aside>
    <div class="inline-edge-editor hidden" id="inlineEdgeEditor"></div>
    <div class="inline-state-editor hidden" id="inlineStateEditor"></div>

    <!-- L4: Top-Level Transient Popovers -->
    <div class="top-popover hidden" id="canvasSettingsPopover" style="width:300px;"></div>
    <div class="top-popover hidden" id="dagStylePopover" style="width:248px;"></div>
    <div class="top-popover hidden" id="linterPopover" style="width:360px;"></div>
    <div class="top-popover hidden" id="wsPopover" style="width:372px;"></div>
    <div class="top-popover float-win hidden" id="commentPopover" style="width:356px;"></div>
    <div class="top-popover float-win hidden" id="sharePopover" style="width:452px;"></div>
    <div class="top-popover float-win hidden" id="reportPopover" style="width:396px;"></div>
    <section class="worldline-page hidden" id="worldlinePage"></section>
    <div class="wl-compare-banner hidden" id="wlCompareBanner"></div>
    <script type="application/json" id="studio-focus-context">{}</script>

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        members.forEach(m => {
          minX = Math.min(minX, m.x - halfW); maxX = Math.max(maxX, m.x + halfW);
          minY = Math.min(minY, m.y - halfH); maxY = Math.max(maxY, m.y + halfH);
        });
        const bx1 = minX - padX, bx2 = maxX + padX, by1 = minY - padY, by2 = maxY + padY;
        nodes.forEach(n => {
          if (memberSet.has(n.id)) return;
          const overlapX = n.x + halfW > bx1 && n.x - halfW < bx2;
          const overlapY = n.y + halfH > by1 && n.y - halfH < by2;
          if (overlapX && overlapY) {
            // Push intruder cleanly outside nearest edge (prefer below/right for natural reading flow)
            const dDown = Math.abs(by2 + halfH + 24 - n.y);
            const dRight = Math.abs(bx2 + halfW + 24 - n.x);
            if (dDown <= dRight) n.y = Math.round(by2 + halfH + 28);
            else n.x = Math.round(bx2 + halfW + 28);
          }
        });
      }
    }

    function formatMachineDelta(mid) {
      const d = computeDiff(mid);
      if (!d.hasChanges) return '同实际基准';
      if (d.mode === 'remove') return '标记下线';
      const parts = [];
      if (d.statesAdded.length) parts.push(`+${d.statesAdded.length}态`);
      if (d.statesRemoved.length) parts.push(`-${d.statesRemoved.length}态`);
      if (d.statesRenamed.length) parts.push(`~${d.statesRenamed.length}名`);
      if (d.edgesAdded.length) parts.push(`+${d.edgesAdded.length}边`);
      if (d.edgesRemoved.length) parts.push(`-${d.edgesRemoved.length}边`);
      if (d.edgesModified.length) parts.push(`~${d.edgesModified.length}边`);
      return parts.join(' ') || '已调整';
    }

    function formatMacroDelta() {
      const baseNodes = store.forestBaseNodes || [];
      const baseEdges = store.forestBaseEdges || [];
      const baseN = new Set(baseNodes.map(n => n.id));
      const curN = new Set(store.forestNodes.map(n => n.id));
      const baseE = new Map(baseEdges.map(e => [e.id, e]));
      const curE = new Map(store.forestEdges.map(e => [e.id, e]));
      const nAdd = store.forestNodes.filter(n => !baseN.has(n.id)).length;
      const nDel = baseNodes.filter(n => !curN.has(n.id)).length;
      const eAdd = store.forestEdges.filter(e => !baseE.has(e.id)).length;
      const eDel = baseEdges.filter(e => !curE.has(e.id)).length;
      const eMod = store.forestEdges.filter(e => {
        const b = baseE.get(e.id);
        return b && (b.from !== e.from || b.to !== e.to || b.label !== e.label || b.kind !== e.kind);
      }).length;
      const parts = [];
      if (nAdd) parts.push(`+${nAdd}规格`);
      if (nDel) parts.push(`-${nDel}规格`);
      if (eAdd) parts.push(`+${eAdd}连线`);
      if (eDel) parts.push(`-${eDel}连线`);
      if (eMod) parts.push(`~${eMod}连线`);
      return parts.join(' ') || '同实际基准';
    }

    function recordMachineCommit(label, mid = store.activeMachineId, actor = 'human') {
      const tl = ensureTimeline(mid);

      const parentEntry = tl.entries[tl.headIdx] || tl.entries[0];
      const seq = tl.entries.length;
      tl.entries.push({
        seq, id: `#${seq}`, parentId: parentEntry?.id || 'BASE', actor, ts: nowTimeStr(), isBase: false,
        label,
        delta: formatMachineDelta(mid),
        snapshot: { draft: clone(store.drafts[mid]), modeFlag: store.draftModes[mid] },
      });
      tl.headIdx = tl.entries.length - 1;
    }

    function shortHashStr(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return (h >>> 0).toString(16).padStart(8, '0').slice(0, 6);

    function resolveTextFold(docKey) {
      const m = store.drafts[docKey] ? activeMachineDraft(docKey) : null;
      const baseM = store.baselines[docKey];
      const detail = DOC_DETAILS[docKey];
      const staticDoc = TF_DOCS[docKey] || TF_DOCS['validation'];
      const mode = store.textFoldProvider || 'ast';

      let levels;
      let dirty = false;
      let rawSeed = '';

      if (m) {
        const diff = computeDiff(docKey);
        dirty = diff.hasChanges;
        const isFlow = baseM?.graphKind === 'flow';
        const initNames = m.states.filter(s => s.initial).map(s => s.name);
        const outDeg = new Map(m.states.map(s => [s.uid, 0]));
        m.transitions.forEach(e => outDeg.set(e.fromUid, (outDeg.get(e.fromUid) || 0) + 1));
        const termNames = m.states.filter(s => (outDeg.get(s.uid) || 0) === 0).map(s => s.name);
        const guards = [...new Set(m.transitions.map(e => e.guard).filter(Boolean))];
        const subNodes = m.states.filter(s => s.subMachineId).map(s => s.name);
        const edgeLines = m.transitions.slice(0, 8).map(e => `${m.states.find(x => x.uid === e.fromUid)?.name || e.fromUid} -[${e.event}${e.guard ? ` | ${e.guard}` : ''}]-> ${m.states.find(x => x.uid === e.toUid)?.name || e.toUid}`);
        rawSeed = JSON.stringify({ s: m.states.map(x => [x.uid, x.name]), t: m.transitions.map(x => [x.fromUid, x.event, x.guard, x.toUid]) });
        levels = [
          `${baseM?.capability || docKey}（${isFlow ? '流程图' : '状态机'}，实时 AST 投影 · 共 ${m.states.length} 节点 / ${m.transitions.length} 转移）：入口为「${initNames.join('、') || '未指定'}」${termNames.length ? `，终态/出口为「${termNames.join('、')}」` : '（循环流转无显式终态）'}${guards.length ? `，含守卫约束 [${guards.join('、')}]` : ''}。主要路径：${edgeLines.join('；')}。`,
          `${baseM?.capability || docKey}：共 ${m.states.length} ${isFlow ? '步骤' : '状态'}、${m.transitions.length} 条连线${subNodes.length ? `，含 ${subNodes.length} 个可下钻子图（${subNodes.join('、')}）` : ''}${dirty ? '（当前含未保存草稿改动，已实时重折）' : ''}。`,
          `入口「${initNames[0] || '-'}」驱动 ${m.transitions.length} 条${isFlow ? '流程路径' : '状态转移'}${guards.length ? `，受 ${guards.length} 项守卫约束` : ''}。`,
          `• ${m.states.length} ${isFlow ? '步骤' : '状态'} / ${m.transitions.length} 条连线${dirty ? '（草稿已更新）' : ''}\n• 入口：${initNames.join('、') || '-'}${termNames.length ? ` → 终态：${termNames.join('、')}` : ''}\n• ${guards.length ? `守卫：${guards.join('、')}` : '无显式守卫'}`,
          `${baseM?.capability || docKey} (${m.states.length}态)`,
        ];
      } else if (detail) {
        if (detail.kind === 'decision') {
          rawSeed = JSON.stringify({ h: detail.headers, r: detail.rows });
          const conclusions = [...new Set((detail.rows || []).map(r => r[r.length - 1]))];
          levels = [
            `${detail.title}（决策真值表实时 AST 投影）：输入列 [${detail.headers.slice(0, -1).join(' / ')}] → 输出列「${detail.headers[detail.headers.length - 1]}」，共 ${detail.rows.length} 条互斥组合规则，输出结论集合为 [${conclusions.join(' / ')}]。`,
            `${detail.title}：由 ${detail.headers.length - 1} 个条件维度组合决定「${detail.headers[detail.headers.length - 1]}」，覆盖 ${detail.rows.length} 条确定性判定行。`,
            `确定性真值表（${detail.rows.length} 行组合 → ${conclusions.join(' / ')}）。`,
            `• 条件列：${detail.headers.slice(0, -1).join(' × ')}\n• 结论域：${conclusions.join(' / ')}\n• 共 ${detail.rows.length} 条确定性判定`,
            `${docKey} 真值表`,
          ];
        } else {
          const rules = detail.rules || [];
          rawSeed = JSON.stringify(rules);
          const headReqs = rules.slice(0, 3).map(r => r.req).join(' / ');
          const moreTxt = rules.length > 3 ? ` 等共 ${rules.length} 条` : '';
          levels = [
            `${detail.title}（共 ${rules.length} 条约束）：\n${rules.map(r => `[${r.req}] ${r.title}：${r.body}`).join('\n')}`,
            `${detail.title}：包含 ${rules.slice(0, 4).map(r => `${r.req} ${r.title}`).join('；')}${rules.length > 4 ? ` 等 ${rules.length} 条` : ''}。`,
            `共 ${rules.length} 条规格约束（${headReqs}${moreTxt}）。`,
            rules.slice(0, 5).map(r => `• ${r.req} ${r.title}`).join('\n') + (rules.length > 5 ? `\n• … 其余 ${rules.length - 5} 条` : ''),
            `${docKey} (${rules.length} 条款)`,
          ];
        }
      } else {
        rawSeed = staticDoc.levels[0];
        levels = staticDoc.levels;
      }

      const hash = `sha256:${shortHashStr(rawSeed)}`;
      if (mode === 'serve') {
        return {
          hash, dirty, levels,
          sourceLabel: 'Tier 1 · 外部 TextFold 服务缓存',
          sourceTone: 'badge-accent',
          fallback: false,
        };
      }
      if (mode === 'serve-offline') {
        return {
          hash, dirty, levels,
          sourceLabel: '外部服务不可达 · 已自动降级本地 AST',
          sourceTone: 'badge-amber',
          fallback: true,
        };
      }
      return {
        hash, dirty, levels,
        sourceLabel: dirty ? 'Tier 0 · 本地 AST 实时重折 (0 Token)' : 'Tier 0 · 本地 AST 折展 (0 Token)',
        sourceTone: dirty ? 'badge-green' : 'badge-muted',
        fallback: false,
      };
    }

    function lockIntentSnapshot(scopeId) {
      const tl = ensureTimeline(scopeId);
      const id = `intent#${Object.keys(store.intentSnapshots).length + 1}`;
      const ts = new Date().toTimeString().slice(0, 8);
      const isMacro = scopeId === '__macro__';
      const rawSnap = isMacro

        : clone(store.drafts[scopeId]);
      // Timeline entries for machines MUST wrap { draft, modeFlag } so time-travel preview & rollback never crash!
      const tlSnap = isMacro ? clone(rawSnap) : { draft: clone(rawSnap), modeFlag: curModeFlag(scopeId) };
      const diffSummary = isMacro ? formatMacroDelta() : formatMachineDelta(scopeId);
      const parentEntry = tl.entries[tl.headIdx] || tl.entries[0];
      store.intentSnapshots[scopeId] = { id, ts, snapshot: rawSnap, diffSummary };

        isBase: false,

        snapshot: tlSnap,

      renderTimelinePanel();
    }

      delete store.executionReports[scopeId];

    function renderReportPopover() {
      const pop = document.getElementById('reportPopover');
      if (!pop) return;

      if (!rp || store.dagExpanded || store.view === 'start') { pop.classList.add('hidden'); pop.innerHTML = ''; return; }
      const rep = store.executionReports[rp.scopeId];
      const item = rep?.items.find(x => x.id === rp.itemId);
      if (!rep || !item) { pop.classList.add('hidden'); pop.innerHTML = ''; return; }
      pop.classList.remove('hidden');
      const tone = item.status === 'verified' ? 'badge-green' : item.status === 'blocked' ? 'badge-red' : 'badge-amber';

          </div>
          <pre class="share-pre" style="max-height:140px;">${esc(item.evidence)}</pre>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
            ${item.status === 'blocked' ? `<button class="ibtn" id="rpOverride">放行并同步修改上游 @req</button>` : ''}
            ${item.status !== 'verified' ? `<button class="ibtn" id="rpDiff">三视角对比</button>` : ''}

            ${item.status === 'verified' ? `<button class="dock-cta primary" id="rpPromote">确认升为新 BASE</button>` : ''}

        </div>
      `;
      pop.querySelector('#rpClose').onclick = () => { store.reportPopover = null; renderReportPopover(); };

      const ovBtn = pop.querySelector('#rpOverride');
      if (ovBtn) ovBtn.onclick = () => {
        store.reportPopover = null;
        openPromptWorkbench(
          `# 高维 DDD 裁决：覆盖既有上游约束\n- 阻塞回执: ${item.title} (${item.reasonCode})\n- 证据:\n${item.evidence}\n\n## 人类裁决\n- 确认业务意图优先，请同步修改上游 @req 约束与相关测试，并在完成后回传新的验收回执。`,
          '覆盖既有约束 · 补充裁决 Prompt',
          '明确放行改动上游强约束，复制前可补充业务背景'
        );
      };
      const accBtn = pop.querySelector('#rpAccept');
      if (accBtn) accBtn.onclick = () => {
        const rev = store.revisions.find(r => r.status === 'pending' && r.machineId === rp.scopeId);
        if (rev && store.drafts[rp.scopeId]) {
          const draft = store.drafts[rp.scopeId];
          if (rev.addState && !draft.states.some(s => s.uid === rev.addState.uid)) draft.states.push(clone(rev.addState));
          rev.addEdges.forEach(ae => draft.transitions.push(clone(ae)));
          rev.status = 'accepted';
          recordMachineCommit(`采纳 Agent 反提案: ${rev.addState?.name || '替代路径'}`);

        store.reportPopover = null;
        toast('已采纳 Agent 替代方案并写入草稿时间线');
        render();
      };
      const proBtn = pop.querySelector('#rpPromote');
      if (proBtn) proBtn.onclick = () => { store.reportPopover = null; promoteDeliveredToBase(rp.scopeId); };

      const pw = 396, ph = pop.offsetHeight || 250;
      const vw = window.innerWidth, vh = window.innerHeight;
      const left = Math.max(12, Math.min(vw - pw - 12, rp.x + 14 > vw - pw - 12 ? rp.x - pw - 14 : rp.x + 14));
      const top = Math.max(54, Math.min(vh - ph - 14, rp.y - 24));
      pop.style.left = `${Math.round(left)}px`;
      pop.style.top = `${Math.round(top)}px`;
      bindWindowDrag(pop, pop.querySelector('#rpDragHead'), 'reportPop');

    function openPromptWorkbench(initialText, title = 'Prompt 预编辑与发送', subtitle = '复制前可自由补充上下文、约束或验收标准', onSync = null) {
      const bd = document.getElementById('promptModalBackdrop');
      if (!bd) return;
      const original = String(initialText ?? '');
      try {
        bd.innerHTML = `
        <div class="prompt-modal ${store.promptFullscreen ? 'fullscreen' : ''}" id="promptModalBox">
          <div class="prompt-modal-head">
            <div>
              <div class="drawer-eyebrow">PROMPT WORKBENCH · 调整指令预览</div>
              <div style="font-size:14px;font-weight:700;color:var(--ink);margin-top:2px;">${esc(title)}</div>

                <span style="font-family:var(--mono);font-size:11px;color:var(--accent);" id="pmTok">~${Math.round(original.length / 2.2)} tok</span>
                <button class="q-chip" id="pmReset">${ICONS.reset(10)} 重置原文</button>

            </div>

          </div>
          <div class="prompt-modal-foot">
            <span style="font-size:11px;color:var(--text-muted);">⌘/Ctrl+Enter 确认复制 · Esc 取消</span>

      const ta = bd.querySelector('#pmTa');

      const tagEl = bd.querySelector('#pmStateTag');
      ta.value = original;

      const refreshMeta = () => {
        tokEl.textContent = `~${Math.round(ta.value.length / 2.2)} tok`;
        const changed = ta.value !== original;
        tagEl.textContent = changed ? '已自定义编辑' : '原文预览';
        tagEl.className = `badge-chip ${changed ? 'badge-amber' : 'badge-muted'}`;
        if (onSync) onSync(changed ? ta.value : null);

      const chipsEl = bd.querySelector('#pmChips');

        ['+ 验收标准', '\n## 验收标准\n- 补充 BDD 场景与单测，确保 just qa 全绿\n'],

      bd.querySelector('#pmClose').onclick = closeModal;
      bd.querySelector('#pmFull').onclick = () => {

    function renderTimelinePanel() {
      const banner = document.getElementById('timelinePreviewBanner');
      const panel = document.getElementById('timelinePanel');
      if (store.dagExpanded || store.view === 'start' || store.view === 'drill-doc') {
        banner.classList.add('hidden'); panel.classList.add('hidden'); return;
      }
      const scopeId = currentTimelineScope();
      const tl = ensureTimeline(scopeId);

      // Top-center Preview Banner when time-traveling
      if (tl.previewIdx !== null && tl.entries[tl.previewIdx]) {
        const cur = tl.entries[tl.previewIdx];
        banner.classList.remove('hidden');
        banner.innerHTML = `
          ${ICONS.history(13)}
          <span>时间线观测：${cur.id} · ${esc(cur.label)}（只读）</span>
          <button class="ibtn accent" id="tlBannerRb" style="height:22px;padding:0 8px;font-size:11px;">回滚到此</button>

        `;
        banner.querySelector('#tlBannerRb').onclick = () => rollbackTimelineTo(scopeId, tl.previewIdx);
        banner.querySelector('#tlBannerExit').onclick = () => exitTimelinePreview(scopeId);

      if (!store.timelineOpen) { panel.classList.add('hidden'); return; }

      // Anti-Collision: avoid overlapping #drawer on the right edge!
      if (!store.winPos.timeline) {

        if (drawerVisible && window.innerWidth >= 1260) {
          panel.style.right = '344px'; panel.style.left = '';
        } else {
          panel.style.right = '12px'; panel.style.left = '';
          if (drawerVisible && window.innerWidth < 1260) { store.selected = null; store.edgeDrawerOpen = false; }
        }
      }

      const netDelta = scopeId === '__macro__' ? formatMacroDelta() : formatMachineDelta(scopeId);
      const userCommits = tl.headIdx;
      const scopeTitle = scopeId === '__macro__' ? '全景拓扑' : scopeId;
      const rep = store.executionReports[scopeId];
      const scopeLabel = scopeId === '__macro__' ? '主视图' : scopeId;
      const ws = curWs();
      const peerWorktrees = WORKSPACES.filter(w => w.repo === ws.repo && w.key !== ws.key && w.instanceRel === ws.instanceRel);
      const wtStripHtml = `
        <div class="tl-wt-strip">
          <span style="display:inline-flex;align-items:center;gap:5px;">${ICONS.branch(12)} 当前分支：<strong style="color:var(--ink);font-family:var(--mono);">${esc(ws.branch)}</strong></span>
          ${peerWorktrees.length ? `<span style="display:inline-flex;align-items:center;gap:4px;">并行 Worktree：${peerWorktrees.map(pw => `<button class="mini-act" data-tl-wt="${esc(pw.key)}" style="height:19px;font-size:10px;padding:0 5px;" title="切换到该 Git Worktree 分叉">${esc(pw.branch)}</button>`).join('')}</span>` : '<span style="opacity:0.7;">单工作树</span>'}
        </div>`;

      panel.innerHTML = `
        <div class="tl-head drag-handle" id="tlDragHead" title="拖动移动 · 双击复位">
          <div>
            <div class="cl-eyebrow">BRANCHING TIMELINE · ${esc(scopeLabel)}</div>
            <div style="font-size:13px;font-weight:700;color:var(--ink);margin-top:2px;display:flex;align-items:center;gap:4px;">
              <span class="drag-grip">⋮⋮</span>${ICONS.history(13)}<span>多叉演进时间线</span>
            </div>
          </div>
          <button class="ibtn icon-only" id="tlCloseBtn" style="height:24px;width:24px;">${ICONS.close(12)}</button>
        </div>

        </div>
        <div class="tl-body" id="tlList"></div>
        <div class="tl-foot" style="gap:6px;">
          <button class="dock-cta primary" id="tlPromptBtn" style="justify-content:center;width:100%;">
            ${ICONS.commit(12)}<span>生成调整 Prompt</span>
          </button>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%;">
            <button class="ibtn" id="tlVisualDiffBtn" style="justify-content:center;font-size:11px;">${ICONS.split(11)}<span>前后对比</span></button>
            <button class="ibtn" id="tlResetBaseBtn" style="justify-content:center;font-size:11px;">${ICONS.reset(11)}<span>切回原规格</span></button>
          </div>
          <!-- [DEMO-ONLY] Simulation triggers; production C3/C5/C6 never renders this box (driven by real CLI/SSE) -->
          <div class="demo-sim-box">
            <div class="demo-sim-tag">[DEMO-SIM] 仅原型演示 · 上线版由 CLI / SSE 自动驱动</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">
              <button class="mini-act" id="tlSimOk" style="justify-content:center;background:var(--surface);color:var(--green);border-color:var(--green);">✓ 模拟对齐过测</button>
              <button class="mini-act" id="tlSimBlk" style="justify-content:center;background:var(--surface);color:var(--red);border-color:var(--red);">⛔ 模拟冲突+建议</button>
            </div>
          </div>
        </div>
      `;

      // Compute multi-branch depth per node from parentId (non-destructive tree!)
      const childCount = new Map();
      tl.entries.forEach(e => { if (e.parentId) childCount.set(e.parentId, (childCount.get(e.parentId) || 0) + 1); });
      const branchLane = new Map([['BASE', 0]]);
      const seenFirstChild = new Set();
      tl.entries.forEach(e => {
        if (!e.parentId) return;
        const pLane = branchLane.get(e.parentId) || 0;
        if (!seenFirstChild.has(e.parentId)) { seenFirstChild.add(e.parentId); branchLane.set(e.id, pLane); }
        else { branchLane.set(e.id, Math.min(2, pLane + 1)); }
      });

      const listEl = panel.querySelector('#tlList');
      for (let i = tl.entries.length - 1; i >= 0; i--) {
        const e = tl.entries[i];
        const isHead = i === tl.headIdx;
        const isPrev = i === tl.previewIdx;
        const lane = branchLane.get(e.id) || 0;
        const isAgent = e.actor === 'agent';
        const row = document.createElement('div');
        row.className = ['tl-item', e.isBase ? 'is-base' : '', isHead ? 'is-head' : '', isPrev ? 'is-preview' : '', lane === 1 ? 'branch-d1' : lane >= 2 ? 'branch-d2' : '', isAgent ? 'is-agent-node' : ''].filter(Boolean).join(' ');
        const actorBadge = e.isBase ? '' : (isAgent ? '<span class="badge-chip badge-accent" style="font-size:9px;padding:0 4px;">Agent</span>' : '');
