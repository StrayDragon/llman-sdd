<!doctype html>
<html lang="zh-CN" data-skin="linear" data-paper="dots">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>llman-sdd studio</title>
  <style>
    /* =========================================================================
       4 Crafted Light Visual Dialects (Restrained, Tactile, Engineering-Grade)
       ========================================================================= */
    :root,
    html[data-skin="linear"] {
      --bg: #f5f6f8;
      --grid-dot: #d0d5df;
      --grid-line: rgba(148, 163, 184, 0.14);
      --surface: #ffffff;
      --surface-subtle: #f1f3f6;
      --surface-hover: #e8ebf0;
      --paper-warm: #f7f5f0;
      --paper-border: #e5e0d5;
      --border: #dfe3eb;
      --border-strong: #c5ccd9;
      --ink: #14171f;
      --ink-hover: #252a38;
      --text: #171b24;
      --text-secondary: #4b5465;
      --text-muted: #7f899b;

      --accent: #2f54eb;
      --accent-soft: #eef2ff;
      --accent-border: #bac8ff;

      /* Semantic Type Inks (Monochrome-first, Subtle Tinted Wells) */
      --t-machine: #0d7a6c; --t-machine-bg: #eefaf7; --t-machine-bd: #b5e4db;
      --t-flow: #6d28d9; --t-flow-bg: #f5f3ff; --t-flow-bd: #d8c8ff;
      --t-decision: #2f54eb; --t-decision-bg: #eef2ff; --t-decision-bd: #c5d1ff;
      --t-doc: #9a5b13; --t-doc-bg: #fcf6ec; --t-doc-bd: #ebd4b0;

      --green: #0f7b55; --green-soft: #eefaf4; --green-border: #b7e4cf;
      --amber: #9a5b13; --amber-soft: #fcf6ec; --amber-border: #ebd4b0;
      --red: #c92a2a; --red-soft: #fdf0f0; --red-border: #f5c2c2;

      --radius-island: 9px;
      --radius-card: 10px;
      --shadow-island: 0 1px 2px rgba(20, 23, 31, 0.05), 0 6px 18px rgba(20, 23, 31, 0.045);
      --shadow-card: 0 1px 2px rgba(20, 23, 31, 0.04), 0 4px 12px rgba(20, 23, 31, 0.04);
      --shadow-float: 0 12px 32px rgba(20, 23, 31, 0.12), 0 2px 6px rgba(20, 23, 31, 0.05);
      --font: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Noto Sans SC", sans-serif;
      --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
    }

    html[data-skin="swiss"] {
      --bg: #f6f4ee; --grid-dot: #d4cec2; --grid-line: rgba(168, 159, 145, 0.16);
      --surface: #fffefb; --surface-subtle: #f0ece3; --surface-hover: #e7e2d6;
      --paper-warm: #f4f0e6; --paper-border: #e2dac9;
      --border: #e2dcd0; --border-strong: #cbc2b2;
      --ink: #1c1a16; --ink-hover: #312e27; --text: #1c1a16; --text-secondary: #575248; --text-muted: #8c8679;
      --accent: #146c43; --accent-soft: #edf7f1; --accent-border: #a9dbc0;
      --t-machine: #146c43; --t-machine-bg: #edf7f1; --t-machine-bd: #a9dbc0;
      --t-decision: #1c1a16; --t-decision-bg: #f0ece3; --t-decision-bd: #cbc2b2;
      --t-doc: #945d14; --t-doc-bg: #fbf6ea; --t-doc-bd: #e8d5ae;
      --radius-island: 7px; --radius-card: 8px;
      --shadow-island: 0 1px 2px rgba(28, 26, 22, 0.05), 0 5px 14px rgba(28, 26, 22, 0.04);
      --shadow-card: 0 1px 2px rgba(28, 26, 22, 0.04), 0 3px 10px rgba(28, 26, 22, 0.035);
      --shadow-float: 0 12px 30px rgba(28, 26, 22, 0.11), 0 2px 5px rgba(28, 26, 22, 0.05);
    }

    html[data-skin="blueprint"] {
      --bg: #f2f6fb; --grid-dot: #b9cbe2; --grid-line: rgba(37, 99, 235, 0.09);
      --surface: #ffffff; --surface-subtle: #eaf0f8; --surface-hover: #dee8f4;
      --paper-warm: #f5f8fc; --paper-border: #d3e1f2;
      --border: #d2dfee; --border-strong: #b0c5df;
      --ink: #0f172a; --ink-hover: #1e293b; --text: #0f172a; --text-secondary: #475569; --text-muted: #7688a1;
      --accent: #0369a1; --accent-soft: #e6f4fc; --accent-border: #93d5f7;
      --t-machine: #0369a1; --t-machine-bg: #e6f4fc; --t-machine-bd: #93d5f7;
      --t-decision: #0f766e; --t-decision-bg: #e8f8f5; --t-decision-bd: #99e2d8;
      --t-doc: #475569; --t-doc-bg: #f1f5f9; --t-doc-bd: #cbd5e1;
      --radius-island: 6px; --radius-card: 7px;
      --shadow-island: 0 1px 2px rgba(15, 23, 42, 0.05), 0 4px 12px rgba(15, 23, 42, 0.04);
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 3px 10px rgba(15, 23, 42, 0.035);
      --shadow-float: 0 12px 32px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(15, 23, 42, 0.05);
    }

    html[data-skin="washi"] {
      --bg: #f9f8f4; --grid-dot: #dcd5c8; --grid-line: rgba(180, 170, 154, 0.12);
      --surface: #ffffff; --surface-subtle: #f3f0e8; --surface-hover: #eae5da;
      --paper-warm: #f7f4ec; --paper-border: #e8e1d3;
      --border: #e7e2d6; --border-strong: #d4ccbc;
      --ink: #24211d; --ink-hover: #38332d; --text: #24211d; --text-secondary: #5d574e; --text-muted: #948c7e;
      --accent: #b54116; --accent-soft: #fdf2ec; --accent-border: #f0c0aa;
      --t-machine: #b54116; --t-machine-bg: #fdf2ec; --t-machine-bd: #f0c0aa;
      --t-decision: #476f16; --t-decision-bg: #f2f8e9; --t-decision-bd: #c5df9d;
      --t-doc: #6e675e; --t-doc-bg: #f3f0e8; --t-doc-bd: #d4ccbc;
      --radius-island: 11px; --radius-card: 12px;
      --shadow-island: 0 2px 8px rgba(36, 33, 29, 0.05), 0 6px 20px rgba(36, 33, 29, 0.035);
      --shadow-card: 0 2px 10px rgba(36, 33, 29, 0.045), 0 1px 2px rgba(36, 33, 29, 0.04);
      --shadow-float: 0 16px 40px rgba(36, 33, 29, 0.11), 0 2px 6px rgba(36, 33, 29, 0.04);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 13px;
      font-variant-numeric: tabular-nums;
      overflow: hidden; -webkit-font-smoothing: antialiased;
    }

    /* =========================================================================
       Strict Semantic Z-Layer Architecture (Zero Stacking-Context Collisions!)
       L1 (10-15): Canvas World & In-Place Expanded Cards
       L2 (25-30): Docked Chrome (Top/Bottom/Left/Minimap)
       L3 (40-49): Draggable Floating Windows (Dynamic Click-to-Front)
       L4 (60)   : Top-Level Transient Popovers (Skin, Canvas Settings, DAG Style)
       L5 (68-70): Exclusive Fullscreen DAG Backdrop & Panel
       L6 (80)   : Right-Click Radial Pie Menu
       L7 (90)   : Cmd+K Palette
       L8 (100)  : Toast
       ========================================================================= */
    .canvas-root {
      position: relative; width: 100vw; height: 100vh; overflow: hidden;
      background-color: var(--bg); transition: background-color 0.2s ease;
    }
    html[data-paper="plain"] .canvas-root { background-image: none; }
    html[data-paper="dots"] .canvas-root {
      background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    html[data-paper="grid"] .canvas-root {
      background-image:
        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px),
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 24px 24px, 120px 120px, 120px 120px;
    }

    /* Tactile Crisp Surface Islands (Solid 1px structural border, no blurry soup) */
    .island {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-island);
      box-shadow: var(--shadow-island);
      display: inline-flex; align-items: center; gap: 2px; padding: 3px;
    }

    .top-left-dock {
      position: fixed; top: 12px; left: 12px; z-index: 28;
      display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
      max-width: calc(100vw - 440px);
    }
    .top-left-dock .island {
      overflow-x: auto; scrollbar-width: none; max-width: 100%;
    }
    .top-left-dock .island::-webkit-scrollbar { display: none; }
    .top-right-dock {
      position: fixed; top: 12px; right: 12px; z-index: 28;
      display: flex; align-items: center; gap: 6px;
    }

    .brand-mark {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0 7px 0 5px; height: 28px;
      font-family: var(--mono); font-size: 11.5px; font-weight: 700;
      letter-spacing: -0.02em; color: var(--ink); user-select: none;
    }
    .brand-glyph {
      width: 19px; height: 19px; border-radius: 5px;
      background: var(--ink); color: #ffffff;
      display: inline-flex; align-items: center; justify-content: center;
    }

    .tab-close {
      margin-left: 3px; width: 15px; height: 15px; border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; opacity: 0.65;
    }
    .tab-close:hover { background: rgba(255,255,255,0.22); opacity: 1; }

    /* Crisp Buttons */
    .ibtn {
      height: 28px; padding: 0 9px; border-radius: 6px; border: none;
      background: transparent; color: var(--text-secondary);
      font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      transition: background 0.12s, color 0.12s; white-space: nowrap;
    }
    .ibtn:hover { background: var(--surface-subtle); color: var(--ink); }
    .ibtn.muted-dis { opacity: 0.42; }
    .ibtn.active { background: var(--ink); color: #ffffff; }
    .ibtn.accent { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .ibtn.icon-only { width: 28px; padding: 0; justify-content: center; }

    .badge-chip {
      font-size: 11px; padding: 2px 7px; border-radius: 5px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-amber { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-border); }
    .badge-green { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }
    .badge-red { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
    .badge-accent { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }
    .badge-ink { background: var(--ink); color: #ffffff; }
    .badge-muted { background: var(--surface-subtle); color: var(--text-secondary); }
    .sep-v { width: 1px; height: 14px; background: var(--border); margin: 0 3px; }

    /* Extensible IDE-Style Linter Summary Pill & Findings List */
    .linter-pill {
      display: inline-flex; align-items: center; gap: 5px;
      height: 28px; padding: 0 9px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--surface);
      font-family: var(--font); font-size: 11.5px; font-weight: 600;
      color: var(--green); cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .linter-pill:hover { background: var(--surface-subtle); border-color: var(--border-strong); }
    .linter-pill.has-warn { color: var(--amber); border-color: #d9b98b; background: var(--amber-soft); }
    .linter-pill.has-err { color: var(--red); border-color: #e6b3b3; background: var(--red-soft); }
    .linter-pill.open { box-shadow: 0 0 0 1.5px var(--ink); }
    .linter-row {
      display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px;
      border-bottom: 1px solid var(--surface-subtle); font-size: 11.5px;
    }
    .linter-row:last-child { border-bottom: none; }
    .linter-row:hover { background: var(--surface-subtle); }
    .linter-code {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      padding: 1px 5px; border-radius: 4px; flex: none; margin-top: 1px;
    }
    .linter-code.err { background: var(--red-soft); color: var(--red); }
    .linter-code.warn { background: var(--amber-soft); color: var(--amber); }
    .linter-code.ok { background: var(--green-soft); color: var(--green); }
    .linter-acts { display: inline-flex; align-items: center; gap: 4px; flex: none; }

    /* Workspace / Sub-Project Instance / Branch Switcher Pill & Popover */
    .ws-pill {
      display: inline-flex; align-items: center; gap: 5px;
      height: 28px; padding: 0 9px; border-radius: 7px;
      border: 1px solid transparent; background: transparent;
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      color: var(--ink); cursor: pointer; max-width: 240px;
      transition: background 0.12s, border-color 0.12s;
    }
    .ws-pill:hover { background: var(--surface-subtle); border-color: var(--border); }
    .ws-pill.open { background: var(--surface-subtle); border-color: var(--ink); }
    .ws-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .ws-dot.protected { background: var(--amber); }
    .ws-dot.writable { background: var(--green); }
    .ws-repo-hdr {
      padding: 6px 10px 4px; font-family: var(--mono); font-size: 10px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em;
      display: flex; align-items: center; justify-content: space-between;
    }
    .ws-item {
      width: 100%; border: none; background: transparent; text-align: left;
      padding: 7px 10px; cursor: pointer; font: inherit;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      border-radius: 6px; transition: background 0.12s;
    }
    .ws-item:hover { background: var(--surface-subtle); }
    .ws-item.active { background: var(--accent-soft); }
    .ws-sub-indent { padding-left: 22px; position: relative; }
    .ws-sub-indent::before {
      content: ""; position: absolute; left: 12px; top: 0; bottom: 0;
      width: 1px; background: var(--border);
    }

    .kbd-hint {
      font-family: var(--mono); font-size: 10.5px; color: var(--text-muted);
      background: var(--surface-subtle); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px;
    }

    /* Left Drafting Quick-Shape Palette */
    .left-palette {
      position: fixed; left: 12px; top: 50%; transform: translateY(-50%);
      z-index: 27; flex-direction: column; padding: 4px; gap: 3px;
      transition: left 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.16s;
    }
    .left-palette.shifted { left: 356px; }
    .left-palette.hidden { opacity: 0; pointer-events: none; }
    .pal-btn {
      width: 32px; height: 32px; border-radius: 6px; border: none;
      background: transparent; color: var(--text-secondary);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .pal-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .pal-btn.active { background: var(--ink); color: #ffffff; }
    .pal-sep { width: 18px; height: 1px; background: var(--border); margin: 2px 0; }

    /* Draggable Window Grip */
    .drag-handle { cursor: move; user-select: none; }
    .drag-grip { font-size: 11px; color: var(--text-muted); opacity: 0.6; margin-right: 4px; letter-spacing: -1px; }
    .drag-handle:hover .drag-grip { opacity: 1; color: var(--ink); }

    /* Bottom-Left Compact Stack (Never Collides with Center Dock!) */
    .bottom-left-stack {
      position: fixed; left: 12px; bottom: 12px; z-index: 28;
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    }
    .legend-pill { padding: 4px 9px; gap: 9px; font-size: 11px; color: var(--text-secondary); }
    .legend-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .zoom-pct {
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      color: var(--text-secondary); min-width: 36px; text-align: center; user-select: none;
    }
    .lens-seg {
      display: inline-flex; align-items: center;
      background: var(--surface-subtle); border-radius: 6px; padding: 2px; gap: 1px;
    }
    .lens-stop {
      border: none; background: transparent; color: var(--text-muted);
      font: inherit; font-size: 11px; font-weight: 500; padding: 3px 7px;
      border-radius: 4px; cursor: pointer;
    }
    .lens-stop:hover { color: var(--ink); }
    .lens-stop.active { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

    /* Top-Level Transient Popovers (L4: z-index 60 — NEVER clipped or occluded!) */
    .top-popover {
      position: fixed; z-index: 60;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-card); box-shadow: var(--shadow-float);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .top-popover.hidden { display: none; }
    .pop-head {
      padding: 8px 11px; border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .pop-body { padding: 10px 11px; display: flex; flex-direction: column; gap: 9px; }

    .cl-eyebrow { font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
    .cl-group-lbl { font-size: 10.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .cl-seg { display: inline-flex; flex-wrap: wrap; gap: 2px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-subtle); padding: 2px; }
    .cl-seg-btn {
      height: 25px; padding: 0 8px; border-radius: 5px; border: none; background: transparent;
      color: var(--text-secondary); font: inherit; font-size: 11px; font-weight: 500;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .cl-seg-btn:hover { background: var(--surface); color: var(--ink); }
    .cl-seg-btn.active { background: var(--ink); color: #ffffff; font-weight: 600; }

    .cl-chip {
      height: 26px; padding: 0 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); font: inherit; font-size: 11.5px; font-weight: 500;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .cl-chip:hover { background: var(--surface-subtle); color: var(--ink); }
    .cl-chip.open { border-color: var(--ink); background: var(--ink); color: #ffffff; }

    /* Skin Swatches inside Top-Level Skin Popover */
    .skin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .skin-card {
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 9px;
      background: var(--surface); cursor: pointer; text-align: left; font: inherit;
    }
    .skin-card:hover { border-color: var(--border-strong); background: var(--surface-subtle); }
    .skin-card.active { border-color: var(--ink); background: var(--surface-subtle); box-shadow: inset 0 0 0 1px var(--ink); }
    .skin-swatches { display: flex; gap: 4px; margin-bottom: 5px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, 0.12); }
    .skin-title { font-size: 12px; font-weight: 600; color: var(--ink); }
    .skin-desc { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }

    /* Bottom-Center Command Dock */
    .bottom-center-dock {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 28;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-island); padding: 4px 5px;
      box-shadow: var(--shadow-island);
      display: inline-flex; align-items: center; gap: 3px;
      max-width: calc(100vw - 560px); flex-wrap: wrap; justify-content: center;
    }
    .dock-tool {
      height: 30px; padding: 0 9px; border-radius: 6px; border: none;
      background: transparent; color: var(--text-secondary); font: inherit;
      font-size: 12px; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .dock-tool:hover { background: var(--surface-subtle); color: var(--ink); }
    .dock-tool.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .dock-cta {
      height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface-subtle); color: var(--ink); font: inherit;
      font-size: 12px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .dock-cta:hover { background: var(--surface-hover); }
    .dock-cta.muted-dis { opacity: 0.45; }
    .dock-cta.primary { background: var(--ink); border-color: var(--ink); color: #ffffff; }
    .dock-cta.primary:hover { background: var(--ink-hover); }
    .dock-cta.accent { background: var(--accent); border-color: var(--accent); color: #ffffff; }
    .dock-cta.danger { background: var(--red-soft); color: var(--red); border-color: var(--red-border); }

    /* Hover-Enlarging Draggable Minimap */
    .minimap-island {
      position: fixed; right: 12px; bottom: 12px; z-index: 29;
      width: 170px; height: 106px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-island); box-shadow: var(--shadow-island);
      overflow: hidden; padding: 7px; cursor: crosshair;
      transform-origin: bottom right;
      transition: right 0.18s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease;
    }
    body.wl-open .minimap-island { right: 368px; }
    .minimap-island:hover,
    .minimap-island.dragging {
      transform: scale(1.82);
      box-shadow: var(--shadow-float);
      z-index: 52;
    }
    .minimap-label { position: absolute; left: 7px; top: 5px; font-family: var(--mono); font-size: 8.5px; color: var(--text-muted); pointer-events: none; }
    .minimap-hint { position: absolute; right: 7px; bottom: 4px; font-size: 7.5px; color: var(--text-muted); opacity: 0; transition: opacity 0.15s; pointer-events: none; }
    .minimap-island:hover .minimap-hint { opacity: 0.85; }
    .minimap-viewport { position: absolute; border: 1.5px solid var(--accent); background: rgba(47, 84, 235, 0.08); border-radius: 2px; pointer-events: none; }

    /* Triage Banner */
    .triage-pill {
      position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 26;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-island); padding: 4px 10px; box-shadow: var(--shadow-island);
      display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary);
    }
    .triage-dot { width: 7px; height: 7px; border-radius: 2px; flex: none; }
    .triage-nav-btn {
      width: 21px; height: 21px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-secondary);
    }
    .triage-nav-btn:hover { background: var(--surface-subtle); color: var(--ink); }

    /* TextFold 5-Level Warm Cream Capsule (Authentic Reading Control) */
    .textfold-pill {
      display: inline-flex; align-items: center; gap: 2px; padding: 3px;
      border-radius: 999px; background: var(--paper-warm); border: 1px solid var(--paper-border);
    }
    .tf-step {
      border: none; background: transparent; color: #6b655a; font: inherit;
      font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px; cursor: pointer;
    }
    .tf-step:hover { color: var(--ink); }
    .tf-step.active { background: #ffffff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.09); }
    .tf-sep { color: #c7c0b3; font-size: 10px; user-select: none; }

    /* =========================================================================
       Canvas World Stage (L1)
       ========================================================================= */
    .stage { position: absolute; inset: 0; overflow: hidden; user-select: none; cursor: grab; z-index: 10; }
    .sm-node.sub-peeking {
      width: 360px !important; z-index: 12;
      border-color: var(--accent);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12), 0 0 0 2px var(--accent-soft);
    }
    .sub-peek-box {
      margin-top: 8px; padding: 6px; border-radius: 9px;
      background: var(--surface-subtle); border: 1px solid var(--border);
    }
    .sub-peek-head {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      font-size: 10.5px; color: var(--text-muted); margin-bottom: 4px; padding: 0 2px;
    }
    .sub-act-row {
      display: flex; align-items: center; gap: 5px; margin-top: 7px; flex-wrap: wrap;
    }
    .sub-act-row .sub-drill-pill { margin-top: 0; }
    .sub-peek-toggle {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); font: inherit; font-size: 10.5px; font-weight: 600;
      cursor: pointer; transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .sub-peek-toggle:hover { border-color: var(--ink); color: var(--ink); }
    .sub-peek-toggle.active { background: var(--ink); color: #ffffff; border-color: var(--ink); }
    .stage.panning { cursor: grabbing; }
    .world-layer { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }
    .world-layer.smooth { transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1); }
    .world-layer svg.edges-layer {
      position: absolute; left: -1400px; top: -1400px; width: 5200px; height: 4200px;
      overflow: visible; pointer-events: none; z-index: 2;
    }
    .world-layer svg.edges-layer .edge-hit { pointer-events: stroke; cursor: pointer; }
    .world-layer svg.edges-layer .edge-label-hit { pointer-events: all; cursor: pointer; }
    .world-layer svg.edges-layer .edge-grp:hover .edge-vis {
      stroke-width: 2.6;
      filter: drop-shadow(0 0 4px rgba(47, 84, 235, 0.28));
    }
    .world-layer svg.edges-layer .edge-grp:hover .edge-lbl-bg {
      stroke: var(--accent);
    }
    .world-layer svg.edges-layer .live-connect-line {
      fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4;
      pointer-events: none;
    }
    .world-layer svg.edges-layer .edge-ep-handle {
      fill: var(--surface); stroke: var(--accent); stroke-width: 2.2;
      pointer-events: all; cursor: crosshair;
      transition: r 0.12s, fill 0.12s;
    }
    .world-layer svg.edges-layer .edge-ep-handle:hover {
      fill: var(--accent);
    }

    /* Inline Canvas Edge Label Editor */
    .inline-edge-editor {
      position: fixed; z-index: 62; transform: translate(-50%, -50%);
      background: var(--surface); border: 1.5px solid var(--accent);
      border-radius: 7px; padding: 3px 5px; box-shadow: var(--shadow-float);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .inline-edge-editor.hidden { display: none; }
    .inline-edge-editor input {
      border: none; outline: none; background: transparent;
      font-family: var(--font); font-size: 11.5px; color: var(--ink);
      width: 190px; padding: 2px 4px;
    }

    /* Git-Like Change Timeline Floating Panel (L3) & Preview Banner */
    .tl-preview-banner {
      position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 34;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px 6px 12px; border-radius: 999px;
      background: var(--amber-soft); border: 1px solid #d9b98b; color: var(--amber);
      font-size: 11.5px; font-weight: 600; box-shadow: var(--shadow-float);
    }
    .tl-preview-banner.hidden { display: none; }
    .timeline-panel {
      position: fixed; right: 12px; top: 54px; bottom: 72px; width: 320px; z-index: 42;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-panel); box-shadow: var(--shadow-float);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .timeline-panel.hidden { display: none; }
    .tl-head {
      padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .tl-summary-bar {
      padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--paper-warm);
      display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11px;
    }
    .tl-body {
      flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;
    }
    .tl-item {
      position: relative; padding: 8px 9px 8px 24px; border-radius: 8px;
      border: 1px solid transparent; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .tl-item::before {
      content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 1.5px;
      background: var(--border);
    }
    .tl-item:first-child::before { top: 16px; }
    .tl-item:last-child::before { bottom: calc(100% - 16px); }
    .tl-dot {
      position: absolute; left: 5px; top: 12px; width: 9px; height: 9px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--border-strong); z-index: 1;
    }
    .tl-item.is-base .tl-dot { background: var(--ink); border-color: var(--ink); }
    .tl-item.is-head .tl-dot { background: var(--green); border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .tl-item.is-preview .tl-dot { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
    .tl-item.is-future { opacity: 0.48; }
    .tl-item:hover { background: var(--surface-subtle); border-color: var(--border); }
    .tl-item.is-preview { background: var(--amber-soft); border-color: #d9b98b; }
    .tl-item.is-head:not(.is-preview) { background: var(--surface-subtle); border-color: var(--border-strong); }
    .tl-item-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink); }
    .tl-item-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-family: var(--mono); font-size: 10px; color: var(--text-muted); margin-top: 3px; }
    .tl-item-acts { display: none; gap: 5px; margin-top: 6px; }
    .tl-item:hover .tl-item-acts, .tl-item.is-preview .tl-item-acts { display: flex; }
    .tl-foot {
      padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; flex-direction: column; gap: 6px;
    }

    /* Floating Edge Quick Action Toolbar (L2.5: z-index 33, tracks selected edge midpoint) */
    .edge-quickbar {
      position: fixed; z-index: 33;
      transform: translate(-50%, -100%);
      display: inline-flex; align-items: center; gap: 3px;
      padding: 4px; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-float);
      white-space: nowrap;
    }
    .edge-quickbar.hidden { display: none; }
    .eq-btn {
      height: 24px; padding: 0 7px; border-radius: 6px; border: none;
      background: transparent; color: var(--text-secondary);
      font: inherit; font-size: 11px; font-weight: 500; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .eq-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .eq-btn.danger:hover { background: var(--red-soft); color: var(--red); }
    .eq-sep { width: 1px; height: 14px; background: var(--border); margin: 0 2px; }

    .type-icon-box { display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; flex: none; }
    .type-icon-box.machine { background: var(--t-machine-bg); color: var(--t-machine); border: 1px solid var(--t-machine-bd); }
    .type-icon-box.flow { background: var(--t-flow-bg); color: var(--t-flow); border: 1px solid var(--t-flow-bd); }
    .type-icon-box.decision { background: var(--t-decision-bg); color: var(--t-decision); border: 1px solid var(--t-decision-bd); }
    .type-icon-box.doc { background: var(--t-doc-bg); color: var(--t-doc); border: 1px solid var(--t-doc-bd); }

    /* Signature Spec Drafting Nodes (with Interactive Connector Port Dots) */
    .forest-node {
      position: absolute; transform: translate(-50%, -50%); z-index: 4;
      cursor: grab; transition: opacity 0.16s, box-shadow 0.14s, border-color 0.14s;
    }
    .forest-node:active { cursor: grabbing; }
    .forest-node.dimmed { opacity: 0.16; }
    .forest-node.connect-target,
    .sm-node.connect-target {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 2.5px var(--accent-soft), 0 0 0 1.5px var(--accent) !important;
    }

    .node-port {
      position: absolute; width: 9px; height: 9px; border-radius: 50%;
      background: var(--surface); border: 1.5px solid var(--border-strong);
      pointer-events: auto; cursor: crosshair; z-index: 4;
      transition: transform 0.12s, background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .node-port.l { left: -5px; top: 50%; transform: translateY(-50%); }
    .node-port.r { right: -5px; top: 50%; transform: translateY(-50%); }
    .node-port:hover {
      transform: translateY(-50%) scale(1.45);
      border-color: var(--accent); background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .forest-node.selected .node-port,
    .sm-node.selected .node-port { border-color: var(--ink); background: var(--ink); }

    .forest-node.lod-glyph { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .glyph-seal {
      width: 90px; height: 90px; border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-card); border: 2px solid;
    }
    .kind-machine .glyph-seal { background: var(--t-machine-bg); color: var(--t-machine); border-color: var(--t-machine-bd); }
    .kind-flow .glyph-seal { background: var(--t-flow-bg); color: var(--t-flow); border-color: var(--t-flow-bd); }
    .kind-decision .glyph-seal { background: var(--t-decision-bg); color: var(--t-decision); border-color: var(--t-decision-bd); }
    .kind-doc .glyph-seal { background: var(--t-doc-bg); color: var(--t-doc); border-color: var(--t-doc-bd); }
    .is-removed .glyph-seal { background: var(--red-soft); color: var(--red); border-color: var(--red); }
    .selected .glyph-seal { box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--ink); }
    .glyph-name {
      font-size: 22px; font-weight: 700; color: var(--ink);
      background: var(--surface); border: 1px solid var(--border);
      padding: 4px 13px; border-radius: 8px; white-space: nowrap;
    }

    .forest-node.lod-map {
      width: 248px; border-radius: var(--radius-card);
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-card); padding: 12px 13px;
    }
    .forest-node.lod-map:hover { border-color: var(--border-strong); }
    .forest-node.lod-map.selected { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow-float); }
    .forest-node.lod-map.is-removed { background: var(--red-soft); border-color: var(--red); }
    .map-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
    .map-title { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.25; }
    .map-type-lbl { font-family: var(--mono); font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .map-takeaway {
      font-size: 12px; line-height: 1.5; color: var(--text-secondary); margin-bottom: 9px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px;
    }
    .map-foot {
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--mono); font-size: 10.5px; color: var(--text-muted);
      padding-top: 7px; border-top: 1px solid var(--surface-subtle);
    }

    .forest-node.lod-work {
      width: 296px; border-radius: var(--radius-card);
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-card); padding: 13px 14px; text-align: left;
    }
    .forest-node.lod-work:hover { border-color: var(--border-strong); }
    .forest-node.lod-work.selected { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow-float); }
    .work-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .work-ident { display: flex; align-items: center; gap: 8px; }
    .work-title { font-size: 13.5px; font-weight: 700; color: var(--ink); }
    .work-sub { font-family: var(--mono); font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .work-summary-box {
      background: var(--paper-warm); border: 1px solid var(--paper-border);
      border-radius: 7px; padding: 9px 10px; font-size: 12px; line-height: 1.55;
      color: var(--text-secondary); margin-bottom: 9px; max-height: 132px; overflow-y: auto;
      white-space: pre-wrap; user-select: text;
    }
    .work-meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

    .mini-act-row { display: inline-flex; align-items: center; gap: 4px; }
    .forest-node:not(.in-place-expanded) .mini-act-row {
      opacity: 0; pointer-events: none; transition: opacity 0.14s ease;
    }
    .forest-node:not(.in-place-expanded):hover .mini-act-row,
    .forest-node:not(.in-place-expanded).selected .mini-act-row {
      opacity: 1; pointer-events: auto;
    }
    .mini-act {
      border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
      border-radius: 5px; padding: 2px 7px; font-family: var(--font); font-size: 10.5px; font-weight: 500;
      cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
    }
    .mini-act:hover { border-color: var(--ink); background: var(--ink); color: #ffffff; }

    /* In-Place Expanded Spec Card on Macro Canvas */
    .forest-node.in-place-expanded {
      width: 532px; border-radius: 12px; background: var(--surface);
      border: 1.5px solid var(--ink); box-shadow: var(--shadow-float);
      padding: 0; overflow: hidden; z-index: 14; cursor: default;
    }
    .inplace-head {
      padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: grab;
    }
    .inplace-head:active { cursor: grabbing; }
    .inplace-body { padding: 12px 13px; background: var(--surface); user-select: text; }

    /* Drafting Note Card (Warm Archival Paper, Zero Loud Yellow Emoji) */
    .sticky-note {
      position: absolute; transform: translate(-50%, -50%);
      width: 204px; border-radius: 8px;
      background: var(--paper-warm); border: 1px solid #d9cfb8; color: var(--text);
      box-shadow: var(--shadow-card); padding: 8px 10px; cursor: grab; z-index: 12;
    }
    .sticky-note:active { cursor: grabbing; }
    .sticky-note textarea {
      width: 100%; border: none; background: transparent; resize: none;
      font: inherit; font-size: 12px; color: var(--text-secondary); outline: none; line-height: 1.48;
    }

    /* Statechart Nodes */
    .sm-node {
      position: absolute; transform: translate(-50%, -50%); z-index: 4;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-card); box-shadow: var(--shadow-card);
      cursor: grab; transition: opacity 0.16s, box-shadow 0.14s, border-color 0.14s;
    }
    .sm-node:active { cursor: grabbing; }
    .sm-node:hover:not(.lod-glyph):not(.selected) { border-color: var(--border-strong); }
    .sm-node.dimmed { opacity: 0.16; }
    .sm-node.selected { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow-float); }
    .sm-node.diff-added { background: var(--green-soft); border-color: var(--green); }
    .sm-node.diff-renamed { background: var(--amber-soft); border-color: var(--amber); }
    .sm-node.diff-removed { background: var(--red-soft); border-color: var(--red); text-decoration: line-through; }
    .sm-node.has-error { border-color: var(--red); box-shadow: 0 0 0 1.5px var(--red), var(--shadow-card); }
    .sm-node.sim-active { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .sm-node.ghost { background: var(--green-soft); border: 1.5px dashed var(--green); box-shadow: none; }

    .sm-node.lod-glyph { background: transparent; border: none; box-shadow: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .sm-glyph-seal {
      width: 76px; height: 76px; border-radius: 20px; background: var(--surface);
      border: 2px solid var(--border-strong); color: var(--ink);
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card);
    }
    .sm-node.is-init .sm-glyph-seal { background: var(--ink); color: #fff; border-color: var(--ink); }
    .sm-node.is-term .sm-glyph-seal { background: var(--t-machine-bg); color: var(--t-machine); border-color: var(--t-machine); }
    .sm-node.has-error .sm-glyph-seal { background: var(--red); color: #fff; border-color: var(--red); }
    .sm-node.diff-added .sm-glyph-seal { background: var(--green); color: #fff; border-color: var(--green); }
    .sm-glyph-name { font-size: 19px; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--border); padding: 3px 11px; border-radius: 7px; white-space: nowrap; }
    .sm-node.lod-map { width: 188px; padding: 10px 12px; }
    .sm-node.lod-work { width: 244px; padding: 12px 14px; }
    .sm-head-row { display: flex; align-items: center; gap: 7px; }
    .sm-title { font-weight: 700; font-size: 13px; color: var(--ink); }
    .sm-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; line-height: 1.45; }
    .sm-inline-input {
      margin-top: 8px; width: 100%; border: 1px solid var(--paper-border);
      background: var(--paper-warm); border-radius: 6px; padding: 6px 8px;
      font: inherit; font-size: 11.5px; outline: none;
    }
    .sm-inline-input:focus { border-color: var(--ink); background: #fff; }
    .comment-pin {
      position: absolute; top: -8px; right: -8px; min-width: 19px; height: 19px; padding: 0 5px;
      border-radius: 5px; background: var(--ink); color: #fff; font-family: var(--mono);
      font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    }

    .portal-world {
      position: absolute; transform: translate(-50%, -50%); z-index: 4;
      padding: 7px 11px; border-radius: 8px; background: var(--surface);
      border: 1px dashed var(--border-strong); display: flex; align-items: center; gap: 7px;
      cursor: pointer; white-space: nowrap; max-width: 190px;
      transition: border-color 0.14s, background 0.14s, box-shadow 0.14s;
    }
    .portal-world:hover { border-color: var(--ink); background: var(--surface-subtle); }
    .portal-world.is-parent-ctx {
      border-style: solid; border-color: var(--border);
      background: var(--surface); box-shadow: var(--shadow-card);
    }
    .portal-world.is-parent-ctx:hover {
      border-color: var(--accent); box-shadow: 0 4px 12px rgba(47, 84, 235, 0.12);
    }

    /* Outer Parent Context Frame (Box-in-Box when viewing nested sub-machine / sub-flowchart!) */
    .parent-context-frame {
      position: absolute; z-index: 0; pointer-events: none;
      border-radius: 20px;
      border: 1.5px dashed var(--border);
      background: rgba(148, 163, 184, 0.025);
    }
    .nest-frame-crumb {
      position: absolute; left: 16px; top: -16px; z-index: 6;
      pointer-events: auto;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px 3px 5px; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-island); white-space: nowrap;
    }
    .nest-crumb-btn {
      border: none; background: transparent; color: var(--text-secondary);
      font: inherit; font-size: 11.5px; font-weight: 500;
      padding: 2px 7px; border-radius: 6px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
      transition: background 0.12s, color 0.12s;
    }
    .nest-crumb-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .nest-crumb-btn.back {
      background: var(--accent-soft); color: var(--accent); font-weight: 600;
    }
    .nest-crumb-btn.back:hover { background: var(--accent); color: #ffffff; }
    .nest-crumb-btn.current {
      background: var(--ink); color: #ffffff; font-weight: 600; cursor: default;
    }

    /* Statechart Machine Boundary Frame (Isolates Internal States from Upstream/Downstream Portals!) */
    .machine-boundary-frame {
      position: absolute; z-index: 1; pointer-events: none;
      border-radius: 16px;
      border: 1.5px dashed var(--border-strong);
      background: rgba(148, 163, 184, 0.032);
    }
    .machine-boundary-frame.is-nested {
      border-style: solid; border-color: rgba(47, 84, 235, 0.34);
      background: rgba(47, 84, 235, 0.028);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65);
    }
    .machine-boundary-frame.is-nested.is-flow {
      border-color: var(--t-flow-bd);
      background: rgba(109, 40, 217, 0.025);
    }
    .machine-boundary-label {
      position: absolute; left: 14px; top: -13px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 9px; border-radius: 7px;
      background: var(--surface); border: 1px solid var(--border);
      font-family: var(--mono); font-size: 10.5px; font-weight: 600;
      color: var(--text-secondary); box-shadow: var(--shadow-card);
      white-space: nowrap;
    }

    /* Draggable Floating Windows (L3: Base 40, Click-to-Front elevates within 40-49!) */
    .float-win { z-index: 40; }

    .portal-popover {
      position: fixed; width: 278px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-card);
      box-shadow: var(--shadow-float); overflow: hidden;
    }
    .portal-pop-head {
      padding: 8px 11px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600;
    }
    .portal-pop-body { padding: 11px 12px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .doc-frame {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(820px, calc(100vw - 80px)); max-height: calc(100vh - 150px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-card); box-shadow: var(--shadow-card);
      overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px;
    }

    .drawer {
      position: fixed; top: 54px; right: 12px; height: calc(100vh - 190px); width: 356px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-card); box-shadow: var(--shadow-float);
      display: flex; flex-direction: column; overflow: hidden; transition: opacity 0.16s ease;
    }
    .drawer.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    .drawer-head {
      padding: 11px 14px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
      background: var(--surface-subtle);
    }
    .drawer-eyebrow { font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 2px; }
    .drawer-head h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--ink); }
    .drawer-head p { margin: 2px 0 0; font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
    .drawer-tabs { display: flex; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .drawer-tabs.hidden { display: none; }
    .drawer-tab-btn {
      border: none; background: transparent; color: var(--text-secondary); font: inherit;
      font-size: 11.5px; font-weight: 500; padding: 4px 10px; border-radius: 5px; cursor: pointer;
    }
    .drawer-tab-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .drawer-tab-btn.active { background: var(--ink); color: #ffffff; font-weight: 600; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 13px 14px; display: flex; flex-direction: column; gap: 12px; }
    .drawer-foot { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

    /* Change Dependency Panel (L3 sidebar / L5 expanded fullscreen) */
    .dag-backdrop {
      position: fixed; inset: 0; background: rgba(20, 23, 31, 0.22);
      z-index: 68; opacity: 0; pointer-events: none; transition: opacity 0.18s;
    }
    .dag-backdrop.show { opacity: 1; pointer-events: auto; }
    .dag-panel {
      position: fixed; top: 54px; left: 12px; height: calc(100vh - 166px); width: 332px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-card); box-shadow: var(--shadow-float);
      display: flex; flex-direction: column; overflow: hidden; transition: opacity 0.16s;
    }
    .dag-panel.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    .dag-panel.expanded {
      top: 54px !important; left: 16px !important; right: 16px !important; bottom: 16px !important;
      width: auto !important; height: auto !important; z-index: 70 !important;
    }
    .dag-head {
      padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 6px; flex: none;
    }
    .dag-body { flex: 1; overflow: auto; background: var(--bg); padding: 14px; display: flex; align-items: flex-start; justify-content: center; }
    .dag-panel.expanded .dag-body { align-items: center; padding: 24px; }
    .dag-node-hit { cursor: pointer; }
    .dag-node-hit:hover rect { stroke-width: 2; }
    .dag-detail-foot { flex: none; border-top: 1px solid var(--border); background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .dag-detail-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    /* Drift Calibration Notification Island (L3 Draggable, Anchored Near Trigger!) */
    .hook-island {
      position: fixed; width: 352px;
      background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--amber);
      border-radius: var(--radius-card); box-shadow: var(--shadow-float); overflow: hidden; font-size: 12px;
    }
    .hook-head {
      padding: 8px 11px; background: var(--amber-soft); border-bottom: 1px solid var(--amber-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .hook-body { padding: 10px 12px; }

    /* =========================================================================
       Right-Click Radial Pie Menu (L6: z-index 80 — Crisp Monochrome SVG Petals!)
       ========================================================================= */
    .radial-menu { position: fixed; z-index: 80; width: 0; height: 0; pointer-events: none; }
    .radial-menu.hidden { display: none; }
    .radial-ring-halo {
      position: absolute; left: 0; top: 0; border-radius: 50%;
      border: 1px dashed var(--border-strong); background: rgba(255, 255, 255, 0.35);
      transform: translate(-50%, -50%); pointer-events: none;
      animation: radPop 0.13s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .radial-core {
      position: absolute; left: 0; top: 0; width: 32px; height: 32px;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: var(--ink); color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-float); pointer-events: auto; cursor: pointer;
      transition: transform 0.12s ease;
      animation: radPop 0.13s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .radial-core:hover { transform: translate(-50%, -50%) scale(1.08); }
    .radial-petal {
      position: absolute; transform: translate(-50%, -50%);
      height: 30px; padding: 0 11px; border-radius: 999px;
      border: 1px solid var(--border-strong); background: var(--surface);
      color: var(--ink); font: inherit; font-size: 11.5px; font-weight: 600;
      box-shadow: 0 4px 14px rgba(20, 23, 31, 0.11);
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      cursor: pointer; pointer-events: auto; white-space: nowrap;
      transition: transform 0.11s, background 0.11s, border-color 0.11s, color 0.11s;
      animation: radPop 0.15s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .radial-petal:hover {
      background: var(--ink); color: #ffffff; border-color: var(--ink);
      transform: translate(-50%, -50%) scale(1.06);
    }
    @keyframes radPop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* Shared Forms & Cards */
    .section { display: flex; flex-direction: column; gap: 7px; }
    .section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    .input {
      width: 100%; border: 1px solid var(--border); border-radius: 7px;
      padding: 7px 9px; font: inherit; color: var(--text); background: var(--surface); outline: none;
    }
    .input:focus { border-color: var(--ink); }
    .card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 11px; background: var(--surface); font-size: 12px; line-height: 1.55; }
    .card-warm { background: var(--paper-warm); border-color: var(--paper-border); }
    .card-err { background: var(--red-soft); border-color: var(--red-border); color: #991b1b; cursor: pointer; }
    .card-green { background: var(--green-soft); border-color: var(--green-border); color: #065f46; }
    .card-amber { background: var(--amber-soft); border-color: var(--amber-border); color: #92400e; }
    .code-box {
      font-family: var(--mono); font-size: 11px; line-height: 1.55;
      background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 7px;
      padding: 9px 10px; white-space: pre-wrap; overflow-x: auto; margin: 0;
    }
    .diff-add { color: var(--green); } .diff-del { color: var(--red); } .diff-mod { color: var(--amber); }
    .truth-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    .truth-table th, .truth-table td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; }
    .truth-table th { background: var(--surface-subtle); color: var(--text-secondary); font-family: var(--mono); font-size: 11px; }

    /* Cmd+K (L7: 90) */
    .cmdk-backdrop {
      position: fixed; inset: 0; background: rgba(20, 23, 31, 0.24);
      z-index: 90; display: flex; align-items: flex-start; justify-content: center; padding-top: 13vh;
    }
    .cmdk-backdrop.hidden { display: none; }
    .cmdk-box { width: min(520px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-float); overflow: hidden; }
    .cmdk-input { width: 100%; padding: 13px 15px; border: none; border-bottom: 1px solid var(--border); font: inherit; font-size: 13.5px; outline: none; }
    .cmdk-list { max-height: 320px; overflow-y: auto; padding: 6px; }
    .cmdk-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; }
    .cmdk-item:hover, .cmdk-item.active { background: var(--surface-subtle); }
    .cmdk-item.active { box-shadow: inset 2px 0 0 var(--accent); }
    .cmdk-item span { font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); }

    /* Toast (L8: 100) */
    .toast {
      position: fixed; top: 54px; left: 50%; z-index: 100;
      background: var(--ink); color: #ffffff; padding: 7px 13px; border-radius: 8px;
      font-size: 12px; box-shadow: var(--shadow-float); max-width: 380px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      opacity: 0; transform: translateY(-4px) scale(0.98);
      transition: opacity 0.15s ease, transform 0.15s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .check-row { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
    .check-row:hover { background: var(--surface-subtle); }

    /* Editable Prompt Box */
    .prompt-editor {
      width: 100%; min-height: 168px; resize: vertical;
      font-family: var(--mono); font-size: 11px; line-height: 1.55;
      background: var(--surface-subtle); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px;
      outline: none; transition: border-color 0.14s, background 0.14s;
    }
    .prompt-editor:focus { border-color: var(--ink); background: var(--surface); }
    .quick-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .q-chip {
      border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
      border-radius: 5px; padding: 2px 7px; font: inherit; font-size: 10.5px; cursor: pointer;
    }
    .q-chip:hover { border-color: var(--ink); color: var(--ink); background: var(--surface-subtle); }

    /* Deleted Ghost Node on Canvas during ReviewDiff */
    .sm-node.diff-deleted-ghost {
      background: var(--red-soft); border: 1.5px dashed var(--red);
      opacity: 0.72; box-shadow: none; cursor: default;
    }
    .sm-node.diff-deleted-ghost .sm-title { text-decoration: line-through; color: var(--red); }

    /* Split Before / After Visual Graph Diff Modal (L5: z-index 74) */
    .diff-modal-backdrop {
      position: fixed; inset: 0; background: rgba(20, 23, 31, 0.28);
      z-index: 74; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .diff-modal-backdrop.hidden { display: none; }
    .diff-modal {
      width: min(1060px, 100%); max-height: calc(100vh - 48px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-card); box-shadow: var(--shadow-float);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .diff-modal-head {
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .diff-split-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 16px;
      background: var(--bg); overflow: auto;
    }
    .diff-pane {
      background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .diff-pane-head {
      padding: 8px 11px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; font-weight: 600;
    }
    .diff-pane-svg { padding: 10px; background: var(--bg); flex: 1; }
    .diff-modal-foot {
      padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface);
      display: flex; flex-direction: column; gap: 8px;
    }

    /* Browser-Style Tab Context Menu (L4: z-index 62) */
    .tab-ctx-menu {
      position: fixed; z-index: 62; min-width: 172px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 9px; box-shadow: var(--shadow-float); padding: 4px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .tab-ctx-menu.hidden { display: none; }
    .tab-ctx-item {
      border: none; background: transparent; color: var(--text); font: inherit; font-size: 12px;
      padding: 6px 9px; border-radius: 6px; text-align: left; cursor: pointer;
      display: flex; align-items: center; gap: 7px;
    }
    .tab-ctx-item:hover { background: var(--surface-subtle); }
    .tab-ctx-sep { height: 1px; background: var(--border); margin: 3px 4px; }
    .pin-dot { opacity: 0.72; display: inline-flex; }

    /* Empty-Tab / New-Tab Start Guide View */
    .start-guide-wrap {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 72px 24px 36px; overflow-y: auto;
    }
    .start-guide {
      width: min(740px, 100%); display: flex; flex-direction: column; gap: 20px;
    }
    .start-hero { display: flex; flex-direction: column; gap: 6px; }
    .start-hero h1 { margin: 0; font-size: 20px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
    .start-hero p { margin: 0; font-size: 12.5px; color: var(--text-muted); }
    .start-search {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
      padding: 10px 13px; box-shadow: var(--shadow-card); cursor: text;
      color: var(--text-muted); font-size: 13px;
    }
    .start-search:hover { border-color: var(--border-strong); }
    .start-sec-lbl { font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
    .start-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .start-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
      padding: 12px 14px; text-align: left; cursor: pointer; font: inherit;
      display: flex; align-items: flex-start; gap: 10px; box-shadow: var(--shadow-card);
      transition: border-color 0.13s, transform 0.13s;
    }
    .start-card:hover { border-color: var(--ink); transform: translateY(-1px); }
    .start-card .type-icon-box { flex: none; margin-top: 1px; }
    .start-card strong { display: block; font-size: 13px; color: var(--ink); margin-bottom: 2px; }
    .start-card > div > span { display: block; font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
    .start-chips { display: flex; flex-wrap: wrap; gap: 7px; }

    /* Return-to-Origin Floating Capsule (when jumping into a New Tab!) */
    .return-pill {
      position: fixed; top: 52px; left: 12px; z-index: 28;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .return-pill.hidden { display: none; }

    /* Minimizable Live Floating Editor Windows (L3: Draggable, Click-to-Front!) */
    .float-editor-win {
      position: fixed; width: 420px; max-height: calc(100vh - 140px);
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius-card); box-shadow: var(--shadow-float);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .fe-head {
      padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .fe-body { flex: 1; overflow-y: auto; padding: 11px 12px; display: flex; flex-direction: column; gap: 10px; }
    .fe-row {
      display: flex; align-items: center; gap: 6px; padding: 5px 7px;
      border: 1px solid var(--border); border-radius: 7px; background: var(--surface);
    }
    .fe-row input {
      border: none; background: transparent; font: inherit; font-size: 12px; color: var(--ink);
      outline: none; flex: 1; min-width: 0;
    }
    .fe-row input:focus { color: var(--accent); }

    /* Minimized Floating Windows Dock Tray */
    .min-tray {
      position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%); z-index: 30;
      display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
      max-width: calc(100vw - 380px);
    }
    .min-tray.hidden { display: none; }
    .min-chip {
      height: 29px; padding: 0 9px; border-radius: 7px;
      background: var(--surface); border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-island); color: var(--ink); font: inherit; font-size: 11.5px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    }
    .min-chip:hover { border-color: var(--ink); background: var(--surface-subtle); }

    /* In-Place Nested Drill Breadcrumb & Live-Sync Indicator */
    .drill-crumb-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      margin-bottom: 8px; padding: 5px 8px; border-radius: 6px;
      background: var(--surface-subtle); font-size: 11px; color: var(--text-secondary);
    }
    .drill-crumbs { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .drill-crumb-btn {
      border: none; background: transparent; padding: 1px 4px; border-radius: 4px;
      font: inherit; font-size: 11px; font-weight: 600; color: var(--text-secondary); cursor: pointer;
    }
    .drill-crumb-btn:hover { background: var(--surface); color: var(--ink); }
    .drill-crumb-btn.cur { color: var(--ink); cursor: default; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }

    /* Unified Prompt Pre-Edit Workbench Modal (L5: z-index 76 — Zero Blind Copy!) */
    .prompt-modal-backdrop {
      position: fixed; inset: 0; background: rgba(20, 23, 31, 0.34);
      z-index: 76; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .prompt-modal-backdrop.hidden { display: none; }
    .prompt-modal {
      width: min(760px, 94vw); max-height: 86vh;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-panel); box-shadow: var(--shadow-float);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .prompt-modal-head {
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .prompt-modal-body {
      flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
    }
    .prompt-modal-ta {
      width: 100%; min-height: 300px; flex: 1; resize: vertical;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--ink);
      font-family: var(--mono); font-size: 12px; line-height: 1.62;
      padding: 11px 12px; outline: none;
    }
    .prompt-modal-ta:focus { border-color: var(--accent); background: var(--surface); }
    .prompt-modal-foot {
      padding: 11px 16px; border-top: 1px solid var(--border); background: var(--surface-subtle);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .ip-click-state { cursor: pointer; }
    .ip-click-state:hover rect { stroke-width: 2.2; stroke: var(--accent); }
    .sub-drill-card {
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 11px;
      background: var(--surface); display: flex; flex-direction: column; gap: 7px;
    }

    /* Domain Group Frames (L0 Spatial Containers + Collapsible Domain Clusters) */
    .stage.select-mode { cursor: crosshair; }
    .marquee-box {
      position: fixed; z-index: 32; pointer-events: none;
      border: 1.5px solid var(--accent); background: rgba(47, 84, 235, 0.08);
      border-radius: 4px;
    }
    .marquee-box.hidden { display: none; }
    .forest-node.multi-selected {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 2px var(--accent), 0 0 0 5px var(--accent-soft) !important;
    }
    .forest-node.ext-hop { opacity: 0.62; border-style: dashed !important; }
    .group-frame {
      position: absolute; border-radius: 14px;
      border: 1.5px dashed var(--border-strong);
      background: rgba(148, 163, 184, 0.045);
      z-index: 0; pointer-events: none;
      transition: border-color 0.14s, background 0.14s;
    }
    .group-frame.tone-teal { border-color: var(--t-machine-bd); background: rgba(13, 122, 108, 0.035); }
    .group-frame.tone-blue { border-color: var(--t-decision-bd); background: rgba(47, 84, 235, 0.035); }
    .group-frame.tone-amber { border-color: var(--t-doc-bd); background: rgba(154, 91, 19, 0.035); }
    .group-head {
      position: absolute; left: 10px; top: -15px; pointer-events: auto; z-index: 3;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 8px 3px 9px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-card); cursor: grab; user-select: none;
    }
    .group-head:active { cursor: grabbing; }
    .group-title { font-size: 11.5px; font-weight: 700; color: var(--ink); }
    .group-count { font-family: var(--mono); font-size: 10px; color: var(--text-muted); }
    .group-acts { display: inline-flex; align-items: center; gap: 2px; margin-left: 2px; }
    .group-btn {
      border: none; background: transparent; color: var(--text-secondary);
      border-radius: 5px; height: 20px; padding: 0 5px; font: inherit; font-size: 10.5px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
    }
    .group-btn:hover { background: var(--surface-subtle); color: var(--ink); }
    .group-btn.danger:hover { background: var(--red-soft); color: var(--red); }
    .group-collapsed-card {
      position: absolute; transform: translate(-50%, -50%);
      width: 268px; border-radius: 12px; padding: 12px 14px;
      background: var(--surface); border: 1.5px solid var(--border-strong);
      box-shadow: var(--shadow-float); cursor: grab; z-index: 6;
    }
    .group-collapsed-card:active { cursor: grabbing; }
    .group-collapsed-card.tone-teal { border-color: var(--t-machine); }
    .group-collapsed-card.tone-blue { border-color: var(--t-decision); }
    .group-collapsed-card.tone-amber { border-color: var(--t-doc); }
    .group-member-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 9px; }
    .group-member-chip {
      font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: var(--surface-subtle); color: var(--text-secondary); border: 1px solid var(--border);
    }
    .inline-state-editor {
      position: fixed; z-index: 63; transform: translate(-50%, -50%);
      background: var(--surface); border: 1.5px solid var(--accent);
      border-radius: 9px; padding: 8px 9px; box-shadow: var(--shadow-float);
      display: flex; flex-direction: column; gap: 6px; width: 248px;
    }
    .inline-state-editor.hidden { display: none; }
    .inline-state-editor input {
      width: 100%; border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 7px; font: inherit; font-size: 12px; color: var(--ink);
      background: var(--bg); outline: none;
    }
    .inline-state-editor input:focus { border-color: var(--accent); background: var(--surface); }

    /* Nested Sub-Machine / Sub-Flow Badges, Flowchart Condition Nodes & Funnel Guide Bar */
    .sm-node.is-gateway { border-color: var(--t-flow-bd); background: var(--t-flow-bg); }
    .sm-node.has-sub { box-shadow: var(--shadow-card), 4px 4px 0 -1px var(--surface), 4px 4px 0 0 var(--border-strong); }
    .sub-drill-pill {
      margin-top: 7px; display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 5px; border: 1px solid var(--accent-border);
      background: var(--accent-soft); color: var(--accent);
      font-size: 10.5px; font-weight: 600; cursor: pointer;
    }
    .sub-drill-pill:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    .sub-drill-pill.flow-pill { border-color: var(--t-flow-bd); background: var(--t-flow-bg); color: var(--t-flow); }
    .sub-drill-pill.flow-pill:hover { background: var(--t-flow); color: #ffffff; border-color: var(--t-flow); }
    .funnel-bar {
      position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 25;
      display: inline-flex; align-items: center; gap: 8px;
      width: min(600px, calc(100vw - 380px));
      padding: 4px 8px 4px 10px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-island); font-size: 11.5px; color: var(--text-secondary);
    }
    .funnel-bar.hidden { display: none; }
    .funnel-step-tag {
      flex: none; min-width: 68px; text-align: center;
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      padding: 1px 6px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
    }
    .funnel-tip-text {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .funnel-nav { display: inline-flex; align-items: center; gap: 2px; flex: none; }
    .nest-crumb-pill {
      position: fixed; top: 52px; left: 12px; z-index: 27;
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 6px;
    }
    .nest-crumb-pill.hidden { display: none; }

    /* Tab Drag-and-Drop Reorder + Lightweight Tab Groups */
    .ibtn.tab-draggable { cursor: pointer; position: relative; }
    .ibtn.tab-dragging { opacity: 0.45; }
    .ibtn.tab-drop-before::before {
      content: ''; position: absolute; left: -3px; top: 3px; bottom: 3px; width: 2.5px;
      border-radius: 2px; background: var(--accent); pointer-events: none;
    }
    .ibtn.tab-drop-after::after {
      content: ''; position: absolute; right: -3px; top: 3px; bottom: 3px; width: 2.5px;
      border-radius: 2px; background: var(--accent); pointer-events: none;
    }
    .tab-grp-chip {
      display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 7px;
      border-radius: 6px; font-size: 10.5px; font-weight: 700; cursor: pointer; user-select: none;
      border: 1px solid var(--border); background: var(--surface-subtle); color: var(--ink);
    }
    .tab-grp-chip .tg-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .tab-grp-chip.tone-blue { border-color: var(--t-decision-bd); background: var(--accent-soft); color: var(--accent); }
    .tab-grp-chip.tone-blue .tg-dot { background: var(--accent); }
    .tab-grp-chip.tone-teal { border-color: var(--t-machine-bd); background: var(--t-machine-bg); color: var(--t-machine); }
    .tab-grp-chip.tone-teal .tg-dot { background: var(--t-machine); }
    .tab-grp-chip.tone-amber { border-color: var(--t-doc-bd); background: var(--t-doc-bg); color: var(--t-doc); }
    .tab-grp-chip.tone-amber .tg-dot { background: var(--t-doc); }
    .ibtn.tab-in-grp-blue { box-shadow: inset 0 -2px 0 var(--accent); }
    .ibtn.tab-in-grp-teal { box-shadow: inset 0 -2px 0 var(--t-machine); }
    .ibtn.tab-in-grp-amber { box-shadow: inset 0 -2px 0 var(--t-doc); }
    .ui-comp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .ui-comp-btn {
      display: inline-flex; align-items: center; justify-content: space-between; gap: 6px;
      height: 28px; padding: 0 9px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
      font: inherit; font-size: 11.5px; font-weight: 500; cursor: pointer; transition: all 0.12s;
    }
    .ui-comp-btn:hover { border-color: var(--border-strong); color: var(--ink); }
    .ui-comp-btn.active { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
    .ui-comp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); flex: none; }
    .ui-comp-btn.active .ui-comp-dot { background: #34d399; }
    .share-pre {
      margin: 0; padding: 10px 11px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 11px;
      line-height: 1.55; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word;
    }
    .report-pin {
      position: absolute; top: -10px; left: 8px; z-index: 6;
      display: inline-flex; align-items: center; gap: 3px; height: 19px; padding: 0 6px;
      border-radius: 999px; font-size: 10px; font-weight: 700; cursor: pointer;
      box-shadow: var(--shadow-card); border: 1px solid transparent; user-select: none;
    }
    .report-pin.verified { background: var(--green-soft); color: var(--green); border-color: var(--green); }
    .report-pin.blocked { background: var(--red-soft); color: var(--red); border-color: var(--red); }
    .report-pin.counter { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
    .verify-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .verify-cell {
      padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
      display: flex; flex-direction: column; gap: 2px;
    }
    .verify-cell .vc-k { font-size: 10px; color: var(--text-muted); font-family: var(--mono); }
    .verify-cell .vc-v { font-size: 12px; font-weight: 700; color: var(--ink); }
    .verify-cell.ok { border-color: var(--green); background: var(--green-soft); }
    .verify-cell.ok .vc-v { color: var(--green); }
    .verify-cell.err { border-color: var(--red); background: var(--red-soft); }
    .verify-cell.err .vc-v { color: var(--red); }
    .verify-cell.warn { border-color: var(--amber); background: var(--amber-soft); }
    .verify-cell.warn .vc-v { color: var(--amber); }

    /* Fullscreen Modal Expansion (Prompt Workbench & Visual Diff Alignment) */
    .diff-modal.fullscreen, .prompt-modal.fullscreen {
      width: 96vw !important; max-width: 96vw !important;
      height: 92vh !important; max-height: 92vh !important;
    }
    .diff-modal.fullscreen .diff-split-grid { flex: 1; min-height: 0; }
    .diff-modal.fullscreen .diff-pane { display: flex; flex-direction: column; min-height: 0; }
    .diff-modal.fullscreen .diff-pane-svg { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .diff-modal.fullscreen .diff-pane-svg svg { height: 100% !important; max-height: 58vh; }
    .diff-overlay-pane {
      margin: 8px 14px 0; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 260px;
    }
    .diff-modal.fullscreen .diff-overlay-pane svg { height: 56vh !important; }
    .top-left-dock { max-width: calc(100vw - 340px); overflow-x: auto; scrollbar-width: none; }
    .top-left-dock::-webkit-scrollbar { display: none; }
    .kind-filter-chip {
      display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px;
      border-radius: 7px; border: 1px solid var(--border); background: var(--surface);
      color: var(--text-muted); font: inherit; font-size: 11px; font-weight: 500; cursor: pointer;
      transition: all 0.12s; opacity: 0.58;
    }
    .kind-filter-chip.on { opacity: 1; color: var(--ink); border-color: var(--border-strong); font-weight: 600; background: var(--surface); }
    .kind-filter-chip:hover { opacity: 1; }
    .hardness-pill {
      display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px;
      font-family: var(--mono); font-size: 9.5px; font-weight: 700; border: 1px solid var(--border);
    }
    .hardness-pill.L0 { background: var(--surface-subtle); color: var(--text-muted); }
    .hardness-pill.L1 { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
    .hardness-pill.L2 { background: var(--green-soft); color: var(--green); border-color: var(--green); }
    .hardness-pill.L3 { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
    .dt-tree-wrap {
