在项目根执行该命令(与 validate 同一条),","scenarios":["finalize 在合并前跑通验收命令","验收命令失败则不合并不改名","未配置验证命令时跳过并引导收口","声明不改规格时不要求验收命令","no-check 写明跳过验收并仍可收口","嵌套跳过不得当成通过"],"totalScenarios":7},{"req":"@req:r95","title":"attach 分叉源运行时推导与偏离警告","hardness":"L1","body":"change start 缺省记录的 base_branch MUST 按运行时信号推导,优先序 MUST 为 --base 显式 > git config branch.<当前分支>.base(值 MUST 为存在的本地分支,非法值作废该信号)> 本地 upstream(branch.<当前分支>.remote = \".\",@{upstream} 解析为 ","scenarios":["attach 按 branch.<name>.base 推导","attach 按本地 upstream 推导","attach 无信号回退默认且不告警","remote-tracking upstream 不作为分叉源","--base 仅接受本地分支","start --base 记录非默认分叉源时输出偏离警告"],"totalScenarios":6},{"req":"@req:r96","title":"finalize/archive 就地收口","hardness":"L1","body":"change archive 与 change archive 解析出的合并目标等于绑定分支本身时 MUST 就地收口:跳过 switch 与合并(自合并恒为 no-op),经 warnings 通道输出含就地收口声明的提示行,归档改名与收口提交行为 MUST 与常规目标完全一致;r69 的目标优先序(into > base_branch > 默认分支)与合","scenarios":["就地收口跳过合并"],"totalScenarios":1},{"req":"@req:r118","title":"change/archive 命令的实例根解析","hardness":"L1","body":"`change`(new/start/attach/next-id/diff/finalize)与 `archive`(freeze/thaw)命令 MUST 经 cli r109 的同一根发现算子解析实例根,不得以 cwd 字面量为根:在向上存在有效实例的子目录调用时 MUST 归位最近实例根,落盘与读写目标随之锚定该根;向上无有效实例时 MUST 报域错","scenarios":["子包源码子目录下 change new 归位最近实例根","无有效实例时 change new 报域错误且不就地新建","change next-id 只清点命中实例根的编号树","链接 worktree 缺实例目录时编号清点跳过而不泄漏 ENOENT","单根仓库按实例根归位的输出零漂移","子包源码子目录下 freeze 归位子根归档目录"],"totalScenarios":8},{"req":"@req:r119","title":"specs-landed 判据按 change 所属实例根","hardness":"L1","body":"收口门(`specsLanded || !needs_specs_change`,r45)中 `specsLanded` 的判据 MUST 按 change 被解析出的实例根 判定:以 `relative(git toplevel, 实例根)` 为实例前缀,`git diff --name-only <base>...<branch>`(diff 范围现算 ","scenarios":["子根 change 落地子根 specs 即过收口门","子根 change 只动根实例 specs 不过收口门"],"totalScenarios":2}]},"real:cli":{"kind":"doc","title":"cli（真实生产 · 6 规则 / 17 场景 / 158 行）","rules":[{"req":"@req:r75","title":"错误出口单一前缀与退出码","hardness":"L1","body":"CLI 的未知命令与未知选项错误 MUST 由统一出口渲染为单一 `Error: ` 前缀(commander 自带的 `error: ` 短前缀 MUST 被剥离,不得出现 `Error: error:` 双前缀)且 MUST 以退出码 2 退出;域错误 MUST 以 `Error: <message>` 单一前缀渲染且 MUST 以退出码 1 退出;帮助","scenarios":["未知命令单一前缀与退出码","域错误单一前缀且退出码 1","根裸调用等同帮助","纯父分组缺必需子命令报用法错误","index 与 context 为未知命令","缺必需参数退出码为 2"],"totalScenarios":6},{"req":"@req:r76","title":"报告命令输出旗标共享注册","hardness":"L1","body":"报告命令 list/show/validate/review 的输出旗标 MUST 由共享注册函数统一挂载,旗标面 MUST 一致为 `--output <toon|json|compact-json|human>`、`--json` 与 `--compact-json` 三个(缺省无输出旗标时输出 TOON);各命令文件 MUST NOT 自行重复注册 `","scenarios":["show compact-json 为真实单行 JSON","compact-json 与 human 同用报用法错误","legacy bdd 配置触发迁移 WARNING"],"totalScenarios":3},{"req":"@req:r77","title":"全局旗标面","hardness":"L1","body":"CLI 全局旗标面 MUST 提供 `--max-scan-depth <N>`(语义见 peripheral-commands r58);前代兼容的无交互效果全局旗标 MUST NOT 存在,调用之 MUST 得到 commander unknown option 且退出码 2。","scenarios":["全局兼容旗标为 unknown option"],"totalScenarios":1},{"req":"@req:r107","title":"入口可导入与执行守卫","hardness":"L1","body":"CLI 入口 MUST 拆为只构建命令树的工厂(不解析、不执行)与仅负责装配的执行入口,二者 MUST 都能被同进程 import 而不触发任何命令执行; 执行入口 MUST 以执行守卫判定自身是否为主模块,守卫 MUST 在 `import.meta.main` 不可用时(如 Node 24.0/24.1)回退为比较 `process.argv[1]` 经","scenarios":["被 import 时不执行命令"],"totalScenarios":1},{"req":"@req:r108","title":"上下文注入与进程级 cwd 隔离","hardness":"L1","body":"CLI MUST 在装配期解析一次运行上下文(终端 IO、git 端口、实例根、工作目录)并注入各命令注册函数;运行时代码 MUST NOT 依赖进程级 `process.chdir` 改变后续解析基准,命令体 MUST NOT 直接读进程当前目录作为解析起点(缺省起点由上下文承载);同一实例根下改变 进程工作目录后,MUST NOT 改变任何只读命令的输出","scenarios":["改变进程工作目录不改输出"],"totalScenarios":1},{"req":"@req:r109","title":"实例根发现与 --directory 全命令可用","hardness":"L1","body":"CLI 全部命令 MUST 经同一根发现算子解析实例根:起点为 `--directory <path>` 所指目录,缺省为进程当前工作目录,自起点向上取最近的 有效实例(config.yaml 或 specs/ 判定,MUST 复用 validation r91 的有效性判据);`--directory` MUST 对全部命令可用;仅发现单根时 全部命令输出","scenarios":["子目录运行只读命令解析到实例根","--directory 对只读命令可用","无实例根时报域错误","show 在无有效实例但含 changes 的工作区保持单根行为","缺实例链接 worktree 中 freeze 报域错误且可显式重定向"],"totalScenarios":5}]},"real:completion":{"kind":"doc","title":"completion（真实生产 · 3 规则 / 9 场景 / 64 行）","rules":[{"req":"@req:r110","title":"生成路径——五 shell 动态推导","hardness":"L1","body":"「self completion」MUST 支持五类 shell 值域(bash、zsh、fish、powershell、elvish),集外值 MUST 报错并列出合法值域且退出码非零;缺省生成路径 MUST 将补全脚本写到 stdout,内容 MUST 从 commander 命令树动态推导——覆盖子命令与旗标两层,含 --directory 与报告类全","scenarios":["五 shell 逐一生成非空脚本","未知 shell 值域拒绝","补全内容与命令树同源"],"totalScenarios":3},{"req":"@req:r111","title":"安装路径——marker 幂等与 rc 链","hardness":"L1","body":"「self completion --install」MUST 将补全 snippet 写入目标 shell 的 rc/profile 并以 marker 块(# >>> llman-sdd completion >>> 与 # <<< llman-sdd completion <<<)包裹;重复安装 MUST 按 marker 幂等原位替换且块数不增;目标","scenarios":["install 写入对应 rc 且含 marker","重复安装幂等","bash rc 回退链","powershell profile 越出 home 报错"],"totalScenarios":4},{"req":"@req:r112","title":"确认门——非交互零静默写入","hardness":"L1","body":"「self completion --install」MUST 在写入 rc 前取得确认:交互环境 MUST 提示目标路径并等待确认;显式 -y MUST 跳过确认直接写入;非交互(无 TTY)且未给 -y 时 MUST 报错且 MUST NOT 写入任何文件——静默写入 MUST NOT 发生。","scenarios":["非交互未确认报错零写入","交互确认 y 写入"],"totalScenarios":2}]},"real:config-command":{"kind":"doc","title":"config-command（真实生产 · 2 规则 / 2 场景 / 25 行）","rules":[{"req":"@req:r37","title":"config 只读概览","hardness":"L1","body":"`config`(无子命令)MUST 只读输出 llmanspec/config.yaml 概览,内容 MUST 覆盖 schema/locale/specs(开或关,含经旧 bdd 兼容提升)/archive 四要素;config 缺失或非法 MUST 报错且退出码非零;本命令 MUST NOT 修改任何文件。","scenarios":["config 概览只读"],"totalScenarios":1},{"req":"@req:r38","title":"config 不提供 skills 子命令","hardness":"L1","body":"`config skills` MUST NOT 存在。调用它 MUST 以未知命令失败,退出码为 2,且 MUST NOT 修改 config.yaml。","scenarios":["config skills 不是命令"],"totalScenarios":1}]},"real:config-schema":{"kind":"doc","title":"config-schema（真实生产 · 4 规则 / 8 场景 / 81 行）","rules":[{"req":"@req:r5","title":"顶层字段域","hardness":"L1","body":"llmanspec/config.yaml MUST 位于项目根 llmanspec/ 目录;顶层字段 MUST 仅由 schema/locale/archive/specs/sdd/change_id 组成(specs 承接前代 bdd 段的 spec 验证配置角色;旧 bdd 段在兼容期经兼容提升消费,见旧配置兼容条),未知字段 SHALL 宽松放行(不","scenarios":["顶层字段域与未知字段宽松","遗留已删除的 bdd 键被宽松剥离","bdd 段已移除字段被宽松忽略"],"totalScenarios":3},{"req":"@req:r6","title":"校验失败报告与 artifact 漂移门","hardness":"L1","body":"config 校验失败 MUST 报错且错误明细 MUST 截断至前 5 条;locale 缺省 MUST 为 \"zh-Hans\"(显式写 en 亦按 init-generators r18 归一为 zh-Hans)。schema artifact(artifacts/schema/configs/en/llmanspec-config.schema.jso","scenarios":["非法配置被拒绝","schema artifact 漂移被 check 拒绝"],"totalScenarios":2},{"req":"@req:r59","title":"change_id pattern 契约","hardness":"L1","body":"config `change_id.pattern` MUST 在加载期编译校验(非法正则 MUST 报错;该编译 MUST 由 core 配置加载完成,读取配置的所有命令路径均受其约束);pattern 的强制点 MUST 为 validate 的 change 域(对活跃 change 目录名违反 pattern 者判 ERROR,归档/legacy 不","scenarios":["pattern 在 validate 域强制","非法 pattern 加载即报错"],"totalScenarios":2},{"req":"@req:r102","title":"specs.check_transitions 遗留键剥离契约","hardness":"L1","body":"已移除的 specs 段布尔字段 check_transitions 在加载期 MUST 被宽松剥离(不进解析结果、不报结构错,任意取值含非布尔值同径处理)并向 stderr 输出 WARNING 指引改用 @transitions/@no-transitions tag;JSON Schema artifact MUST 不再包含该字段定义。","scenarios":["遗留 check_transitions 键被宽松剥离并提示"],"totalScenarios":1}]},"real:eval-playbook":{"kind":"doc","title":"eval-playbook（真实生产 · 6 规则 / 7 场景 / 83 行）","rules":[{"req":"@req:r82","title":"Harbor 剧本不进入 qa 与 golden","hardness":"L1","body":"外部影响面剧本评测 MUST 以 Harbor 为唯一调度(Docker 隔离、无头 agent、Reward Kit 机械准则);MUST NOT 把 `harbor run`、真 Pi 或剧本基线纳入 `just qa` / `bun test tests/` / golden;缺 Docker、Harbor、Pi 或模型端点时 MUST 非零退出,MU","scenarios":["qa 套件不启动 harbor"],"totalScenarios":1},{"req":"@req:r83","title":"groups 至少一组且比较组可选","hardness":"L1","body":"`eval/groups.yaml` 的 `groups` MUST 为名字自定的映射且 MUST 至少含 1 个 group;第二组及以后(如 experiment) MUST 为可选;`worktree` 缺省、空或 null 时 MUST 解析为当前仓库根;`baseline` 若出现 MUST 为 `groups` 中的一个键(缺省映射第一项);`n","scenarios":["groups 文档校验接受单组与空 worktree"],"totalScenarios":1},{"req":"@req:r84","title":"独立镜像只读挂载并在容器内拷贝","hardness":"L1","body":"eval 镜像 MUST 不含某一版 llman-sdd 源码,MUST NOT 因更换 group 或改种子而重建;被测 worktree 与 demo 种子 MUST 以只读 bind 挂入容器,再由 `setup.sh` 拷到容器内可写 `/app` 后执行 `init` 与 agent;`init` MUST NOT 作为被评阶段;Harbor 步骤","scenarios":["groups 文档校验仍接受可选第二组"],"totalScenarios":1},{"req":"@req:r85","title":"机械准则优先且并发尽量为 2","hardness":"L1","body":"裁判 MUST 以程序化准则验收 git/frontmatter/`validate --specs --strict`/archive 提交次数,MUST NOT 把 `validate <change-id>` 或 `--no-check` 当作绿;LLM judge MVP MUST NOT 作为通过门槛;Harbor `n_concurrent_tr","scenarios":["n_attempts 缺失被校验拒绝"],"totalScenarios":1},{"req":"@req:r86","title":"Pi 注入完整 Responses API 配置且 0731 默认思考 max","hardness":"L1","body":"`just eval` MUST 根据 `eval/groups.yaml` 生成容器内 Pi 的 `models.json`(缺省 provider `fusionsparks`, `api` MUST 为 `openai-responses`, 含 thinkingLevelMap 与 chat-template compat)并只读挂到 `/opt/p","scenarios":["Pi models.json 使用 Responses API 且 0731 thinking 为 max","auth 注入缺失容错与凭据不入库三层"],"totalScenarios":2},{"req":"@req:r98","title":"skill 文风观测断言与 A/B 文风对照","hardness":"L1","body":"eval 套件 MUST 含 skill 文风观测断言(如 tests/skill_style):读取容器内 /app/.agents/skills 的 SKILL.md,统计强度词表外词与直角引号计数并写入 /logs/verifier/,该断言 MUST 为观测维度恒真,MUST NOT 作为通过门槛,MUST NOT 改变 reward 聚合语义;文风","scenarios":["eval 文风断言随套件被发现"],"totalScenarios":1}]},"real:init-generators":{"kind":"doc","title":"init-generators（真实生产 · 15 规则 / 26 场景 / 240 行）","rules":[{"req":"@req:r17","title":"模板渲染语义","hardness":"L1","body":"模板变量 MUST 全部为字符串注入,未定义变量 MUST 渲染为空(Lenient);`unit(id)` MUST 递归展开对应单元内容(同环境同变量),嵌套深度 MUST 以 32 为上限,缺失 id MUST 报错;渲染产物 MUST 去除尾随空白,落盘时 MUST 以单一换行结尾。","scenarios":["模板渲染语义可执行验收"],"totalScenarios":1},{"req":"@req:r18","title":"locale 兜底链","hardness":"L1","body":"locale MUST 先归一化:zh 前缀(zh/zh-cn/zh-hans)、en 前缀、空值与未知取值一律归一为内置默认 `zh-Hans`(项目 config 显式 `locale: en` 亦归一为 zh-Hans);回退链 MUST 为 [归一化值, 语言主部, zh-Hans] 去重序列,链尾 MUST 为内置默认 zh-Hans; 单元资源 ","scenarios":["locale 兜底链可执行验收"],"totalScenarios":1},{"req":"@req:r19","title":"init 产物面与命名空间治理","hardness":"L1","body":"`init` MUST 产出 llmanspec/config.yaml(含 $schema 头行与 locale 缺省)、specs/.gitkeep、 changes/archive/.gitkeep,并以托管块方式写 llmanspec/AGENTS.md(已有内容保留);根 AGENTS.md MUST NOT 写入托管块,`init --updat","scenarios":["渲染与基线归一化一致","手动技能带发现阶段标识"],"totalScenarios":2},{"req":"@req:r49","title":"init 目标路径","hardness":"L1","body":"`init [path]` MUST 支持位置参数指定目标目录(相对或绝对,不存在 MUST 自动创建),全部产物(llmanspec/、llmanspec/AGENTS.md、 .agents/skills/)MUST 落在该目录下;缺省 MUST 为当前目录。","scenarios":["init 子目录目标"],"totalScenarios":1},{"req":"@req:r50","title":"init locale 选项别名与生效 locale 优先级链","hardness":"L1","body":"`init` MUST 接受 `--lang <locale>` 作为 `--locale` 的别名(渲染语义完全等效);两者同给 MUST 报错。 渲染生效 locale MUST 按 `工作区 config 显式 locale 键 > CLI 选项 > 内置默认 'zh-Hans'` 解析;config.yaml 缺失时 MUST 生成 config 并","scenarios":["lang 别名等效","update 时工作区 config locale 压制 CLI 选项","config 缺 locale 键时 CLI 选项生效并告警","config 缺 locale 键且无选项时回退内置并告警"],"totalScenarios":4},{"req":"@req:r66","title":"spec 撰写配对引导判据","hardness":"L1","body":"skills 撰写引导(单轨 feature 撰写节与 tag 语法节)MUST 含「可执行场景优先」判据并附带使用示例:凡 GWT(假如/当/那么)可表达、 绑定步骤代码的自动化判定行为 MUST 落成 `场景:`(原生 gherkin 鼓励形态);仅当需求无法程序化表达(抽象目标、架构决策、 治理/人工约束)或暂不转写时,才以 `规则:` 块承载需求并在","scenarios":["配对判据入渲染产物"],"totalScenarios":1},{"req":"@req:r70","title":"模板指引语义对齐","hardness":"L1","body":"模板 skills 与 units(内置 zh-Hans)中对 CLI 的行为性指引 MUST 与实际值域与行为一致:review 人审检查点 MUST 用无旗标调用(--capability 值域仅限 spec id)、已删除的兼容旗标 MUST NOT 再被推荐、change archive 收口 MUST 表述为自动提交 `archive(sdd)` ","scenarios":["指引语义对齐门禁通过"],"totalScenarios":1},{"req":"@req:r71","title":"authoring helpers 撰写引导","hardness":"L1","body":"propose 撰写引导 MUST 将 spec authoring helpers 声明为结构化新增首选(next-req-id 全局 id 分配、add-req/add-scenario 追加规则与验收、skeleton 新建 capability、resolve-req 反查),手改 .feature MUST 保留为逃生门;feature-contr","scenarios":["authoring helpers 引导入渲染产物"],"totalScenarios":1},{"req":"@req:r80","title":"仓库自带 skills 新鲜度","hardness":"L1","body":"本仓库已提交的 `.agents/skills` 中 `llman-sdd-` 前缀产物 MUST 与 golden 基线 zh-Hans 集(tests/golden/baseline/skills)版本号归一化后一致,非该前缀的目录 MUST NOT 参与比对;比对 MUST 随 check:skills-template-render(qa)运行,比对","scenarios":["仓库自带 skills 与基线一致","自带 skills 过期被报出"],"totalScenarios":2},{"req":"@req:r93","title":"init 逐根与 agent 面 skills 策略","hardness":"L1","body":"init MUST 保持逐根构造(init [path] 定根、路径根相对、无嵌套守卫,根间重叠不做交叉校验);子根 init 写 llmanspec/AGENTS.md 托管块,MUST NOT 写根 AGENTS.md 托管块。`.agents/skills` 仅当目标为仓库根实例时注入:子根 init 缺省 MUST NOT 注入 skills 且 M","scenarios":["子根 init 缺省不注入 skills","子根 update 刷新全部发现根托管块","托管块 marker 更新契约"],"totalScenarios":3},{"req":"@req:r97","title":"模板强度词汇表唯一与 check-stc 文风门","hardness":"L1","body":"模板 skills 与 units 的指令强度词汇在同一语言内 MUST 唯一:zh-Hans 模板正文要求级只用 必须/不得、推荐级只用 宜/不宜、允许级只用 可/不必、能力级只用 能/不能,禁止以 MUST、SHALL、不要、禁止、勿、务必、应、建议 表达强度;引用 spec 合约原文的语句(如 specs 的 MUST/SHALL 逐条落实)保留被引对","scenarios":["check-stc 门禁与 MUST 边界断言通过"],"totalScenarios":1},{"req":"@req:r106","title":"init 新建实例告警","hardness":"L1","body":"目标根不存在有效 llmanspec 实例而其祖先存在有效实例时,init MUST 输出 WARNING 指明将新建独立实例与最近既有实例的位置;祖先也不存在有效实例时 MUST NOT 告警。实例根判定 MUST 复用根发现算子的有效性判据(config.yaml 或 specs/ 子目录)。","scenarios":["新建实例触发告警","空白项目不告警"],"totalScenarios":2},{"req":"@req:r122","title":"init --check 核对技能版本","hardness":"L1","body":"`init --check` MUST 读取 `.agents/skills/llman-sdd-*/SKILL.md` 的 metadata.version,且 MUST NOT 写入文件。主版本号与次版本号都等于当前 CLI 时退出码 MUST 为 0。没有 llman-sdd 技能、读不出版本、或主/次版本不同时退出码 MUST 非零,且输出 MUST","scenarios":["版本匹配的技能通过检查","主次版本不同要求更新","check 与 update 互斥"],"totalScenarios":3},{"req":"@req:r123","title":"版本戳路径","hardness":"L1","body":"`init` 与 `init --update` MUST 把 CLI 版本写到 `llmanspec/.sdd-state.json`，且 MUST NOT 创建或改写 `llmanspec/.context/sdd-state.json`。读取 MUST 先读新路径；新路径不存在时 MUST 读旧路径。新路径存在但损坏时 MUST 视为没有记录，不得改读","scenarios":["新建实例只写新路径","旧路径只读回退且更新保留旧文件"],"totalScenarios":2},{"req":"@req:r138","title":"Studio CLI 协商技能指引与基线同步","hardness":"L1","body":"内置 zh-Hans 模板中的 `llman-sdd-explore` 与 `llman-sdd-propose` MUST 包含 Studio CLI 协商指引，提示 Agent 收到 Studio 草稿 ID 时优先通过 `llman-sdd studio diff`、`llman-sdd studio validate`、`llman-sdd stud","scenarios":["explore 与 propose 渲染产物含 Studio CLI 协商指引"],"totalScenarios":1}]},"real:monorepo-structure":{"kind":"doc","title":"monorepo-structure（真实生产 · 6 规则 / 6 场景 / 80 行）","rules":[{"req":"@req:r1","title":"工作区布局","hardness":"L1","body":"仓库 MUST 采用 Bun workspaces 单仓布局:根 package.json 声明 workspaces 且 MUST 包含 packages/core 与 apps/cli 两个工作区(包 exports 直指 .ts 源码,core 无构建步骤)。packages/core MUST NOT 依赖任何 apps/* 工作区。.bun-ver","scenarios":["工作区布局合约对账通过"],"totalScenarios":1},{"req":"@req:r2","title":"质量门禁","hardness":"L1","body":"justfile MUST 提供 check 聚合门禁(typecheck = tsc --noEmit、oxlint、oxfmt --check 三项全过)与 qa 聚合门禁;qa MUST 依次聚合 check、bun test、check:skills-template-render(skills 模板渲染基线门)、check:stc(模板中文文风门,","scenarios":["质量门禁合约对账通过"],"totalScenarios":1},{"req":"@req:r3","title":"core 纯域纪律","hardness":"L1","body":"packages/core MUST 保持纯域逻辑:文件系统、git 子进程、终端副作用 MUST 经接口(ports)注入,不得在域逻辑内直连;对进程环境(process.* 读取,含环境变量与 pid)与墙钟(无参 Date 构造、Date.now)的访问同属副作用,MUST 经注入或参数传入。纯度门禁 MUST 检出上述全部类别(无过渡白名单条目)。n","scenarios":["core 纯域纪律合约对账通过"],"totalScenarios":1},{"req":"@req:r4","title":"BDD runner 就绪","hardness":"L1","body":"tests/bdd MUST 提供 Gherkin→bun:test 桥接 runner(移植自 crystalith),MUST 支持 zh-CN 关键字(假如/当/那么/而且)与 {param}/{param:d} 占位符语义。config.yaml 的 bdd.run_command MUST 指向 bun test tests/bdd。带步骤的 `场","scenarios":["BDD runner 就绪合约对账通过"],"totalScenarios":1},{"req":"@req:r67","title":"模板命令对账","hardness":"L1","body":"模板 skills 与 units(内置 zh-Hans)中对 CLI 命令与旗标的字面引用 MUST 与 CLI 实际命令面对账:引用的命令路径 MUST 存在,引用的每个旗标 MUST 为该命令已注册旗标;对账 MUST 以自动门禁纳入 bun test 套件(随 qa 运行),违例 MUST 致门禁失败并逐条报出来源模板与违例原因。对账面为 packa","scenarios":["模板命令对账门禁通过"],"totalScenarios":1},{"req":"@req:r72","title":"core 模块依赖对账","hardness":"L1","body":"packages/core/src 顶层模块间的跨模块相对导入 MUST 落在门禁测试内声明的允许边表内(节点为顶层目录与根文件;公共 barrel src/index.ts 豁免;import type 与值导入同权;同模块内部导入不计);新增边 MUST 先在声明表中显式登记并说明理由,收窄(断环/搬移)MUST 同步删表防漂移;对账 MUST 以自动门","scenarios":["模块依赖对账门禁通过"],"totalScenarios":1}]},"real:peripheral-commands":{"kind":"doc","title":"peripheral-commands（真实生产 · 16 规则 / 33 场景 / 314 行）","rules":[{"req":"@req:r20","title":"list 合同","hardness":"L1","body":"`list --json` MUST 输出 changes 数组,元素字段 MUST 为 name/path/stage/completedTasks/totalTasks/lastModified/idleDays/status;status 枚举 MUST 为 no-tasks(无任务)、complete(全部完成)、in-progress(进行中);`","scenarios":["输出结构合法","list 遗留 scope 旗标为 unknown option"],"totalScenarios":2},{"req":"@req:r21","title":"show 与 graph 合同","hardness":"L1","body":"`show <change> --output json` 字段集 MUST 覆盖 id/path/title/stage/artifacts/readyToImplement/specsLanded/needsSpecsChange/attached/gateChecks/matchedViaPrefix;`show <spec>` MUST 直出头注释与","scenarios":["show 与 graph 输出契约"],"totalScenarios":1},{"req":"@req:r61","title":"change id 前缀解析","hardness":"L1","body":"`show`、`validate <item>` 与 `change start/attach/diff/finalize/archive` 的 change id 解析 MUST 按前代 r112 优先级链:exact match 优先于前缀;唯一前缀命中 MUST 解析到该 change,且人读输出 MUST 向 stderr 打 `'input' ->","scenarios":["唯一前缀解析生效"],"totalScenarios":1},{"req":"@req:r22","title":"spec 助手与 migrate 引导壳","hardness":"L1","body":"`spec new <cap>` MUST 生成通过单轨校验的骨架(locale 按 config);骨架 MUST NOT 创建仓库根 `src/` 目录,且 MUST NOT 写入 `# scope:` 或 `# capability:` 头注释(头部仅 `# language:`/`# purpose:`);`spec next-req-id` MUS","scenarios":["spec 助手产物与 migrate 三态","空缺号段不被复用","spec new 不产生仓库根 src"],"totalScenarios":3},{"req":"@req:r30","title":"graph 依赖边解析双风格","hardness":"L1","body":"graph 的 frontmatter depends_on 解析 MUST 同时支持流式(`depends_on: [a, b]`)与块式(`depends_on:` 逐行 `- ` 列表)两种 YAML 风格,两种风格解析出的节点与依赖边集合 MUST 一致;`change new` 生成的空流式 `depends_on: []` MUST 兼容;畸形 ","scenarios":["流式依赖边被解析","块式依赖与畸形 frontmatter 不中断"],"totalScenarios":2},{"req":"@req:r51","title":"list 排序与紧凑 JSON","hardness":"L1","body":"`list` MUST 支持 `--sort recent|name`(缺省 recent,按 mtime 降序)与 `--compact-json`(单行紧凑 JSON,须与 `--json` 同用)。","scenarios":["list 排序与紧凑输出"],"totalScenarios":1},{"req":"@req:r52","title":"show 文本输出与 Why/What Changes 门","hardness":"L1","body":"`show <change>` 仅 `--output human` MUST 输出人类可读文本(含 `Stage:`、`path:`、proposal 全文与 `Gates: n/m pass` 尾节),文本模式 MUST NOT 对 `## Why`/`## What Changes` 设门(前代语义);`show` 缺省(无 --output)MUST","scenarios":["show 文本与 What Changes 门"],"totalScenarios":1},{"req":"@req:r53","title":"show spec 检视与 output 修饰","hardness":"L1","body":"`show <spec>` 文本模式 MUST 忽略 `-r/--requirement`、`--output compact|meta-only|no-scenarios|reqs-only` 而渲染全量源码+Morphology(前代语义,修饰仅作用于 JSON);`--output json[,meta-only|no-scenarios|reqs-o","scenarios":["spec 检视与 output 修饰","show 拒绝已删除的 output token"],"totalScenarios":2},{"req":"@req:r54","title":"graph 范围与深度","hardness":"L1","body":"`graph` MUST 支持 `--scope active|archived|all` 及逗号组合(缺省 active)、`--depth <N>`(缺省 1)与位置参数 `[change]`(种子);archived 节点 MUST 仅在 scope 含 archived 且被活跃依赖引用或种子可达时出现;`--format` MUST 仅接受 `me","scenarios":["scope 与种子子图","冻结平铺卡节点与依赖链","非 mermaid 输出格式被拒","全图模式受 --depth 约束","存量围栏卡依赖链兼容"],"totalScenarios":5},{"req":"@req:r55","title":"spec 助手兼容 flag","hardness":"L1","body":"`spec new` MUST 支持 `--force`(覆盖已存在 .feature,无 force 时已存在 MUST 报错);`spec next-req-id` MUST 支持 `--json`(输出 {reqId})。","scenarios":["skeleton force 与 next-req-id json"],"totalScenarios":1},{"req":"@req:r58","title":"proposal 扫描深度全局旋钮","hardness":"L1","body":"sdd 命令面 MUST 提供全局 `--max-scan-depth <N>`(下限 1,缺省 8),约束 `llmanspec/changes/` 下 proposal.md 的递归扫描深度,并对所有扫描 changes/ 的命令(list/show/validate --all/review/graph)统一生效;低于下限 MUST 报错。review","scenarios":["扫描深度旋钮","深度 1 下 review 与 graph 均不发现深层 change"],"totalScenarios":2},{"req":"@req:r89","title":"spec unbound 未绑定需求检索","hardness":"L1","body":"`spec unbound [--limit N]` MUST 输出未绑定需求(无 runnable 嵌套场景的规则,与 review unbound 信号、validate 聚合 INFO 同口径),缺省 --limit 1,`--limit 0` 输出全部,`--limit N` 输出前 N 条;排序 MUST 确定性(按 capability 文件扫描","scenarios":["缺省返回一条并提示剩余","--limit 0 返回全部且排序确定","human 输出给出剩余数与提示","全 @skip 场景的规则计入未绑定","无未绑定需求时 total 为 0"],"totalScenarios":5},{"req":"@req:r90","title":"绑定计量字段与术语口径","hardness":"L1","body":"`list --specs` 与 `show <spec> --json` 的 morphology 计量字段 MUST 以 requirement 系命名:`requirementBoundCount`(有至少一个 runnable 嵌套场景的规则数)与 `requirementUnboundCount`(无 runnable 嵌套场景的规则数);「未绑定","scenarios":["morphology 计量字段命名对账"],"totalScenarios":1},{"req":"@req:r94","title":"spec 助手注册表按根","hardness":"L1","body":"spec 助手的 rN 注册表(next-req-id/add-req/skeleton/resolve-req)MUST 以当前实例根(cwd 或 --directory 解析)为扫描根,各根注册表独立、跨根不保证唯一;max+1 取号语义不变。","scenarios":["子根取号只扫子根注册表"],"totalScenarios":1},{"req":"@req:r100","title":"project migrate 按版本组织的迁移手册与存量头剥离","hardness":"L1","body":"迁移注册表 MUST 按单版本组织(每版本声明自己的迁移条目,条目含标题、逐步命令与自检清单),`project migrate` 裸调用 MUST 在既有总览之上追加已知迁移版本清单(含获取方式提示); `project migrate prompt --from-version <v> --to-version <v>` MUST 输出面向 agent ","scenarios":["迁移手册按版本范围聚合输出","范围左开右闭排除下界版本","空范围输出无迁移提示","非法版本与逆序范围报错"],"totalScenarios":4},{"req":"@req:r105","title":"spec transitions 只读内省输出契约","hardness":"L1","body":"llman-sdd spec transitions MUST 为零参数只读子命令:输出状态流转校验的判定细节,内容 MUST 含特征词列别名族(from/初始状态、event/事件、to/目标状态)、无 tag 时的嗅探判据(三族至少两族)、@transitions/@no-transitions 双向覆盖语义与 1-4 道门禁清单;内容常量 MUST 由","scenarios":["spec-transitions-introspection"],"totalScenarios":1}]},"real:review-freeze":{"kind":"doc","title":"review-freeze（真实生产 · 7 规则 / 21 场景 / 196 行）","rules":[{"req":"@req:r23","title":"review 四信号聚合合同","hardness":"L1","body":"`review` MUST 支持 `--output <toon|json|compact-json|human>` 且缺省(无输出 flag)输出 TOON(IR 与 json 同载荷);`--json`/`--compact-json` 为兼容别名,其 JSON 输出与前代字节一致;`--output human` 输出前代人读行形态;退出码语义不随输出","scenarios":["review 信号形状合法","review sweep 与 validate --all 同判定","review 兼容输出别名可用","export-html 产出自包含报告"],"totalScenarios":4},{"req":"@req:r24","title":"freeze 冷备合同","hardness":"L1","body":"`freeze` MUST 将候选归档目录的正文(proposal.md/design.md/tasks.md/specs 等)写入 `llmanspec/changes/archive/freezed_changes.7z.archived`,并为每个冻结候选生成平铺卡 `llmanspec/changes/archive/<YYYY-MM-DD>-<id","scenarios":["freeze 冷备合同可执行验收","freeze 生成平铺冻结卡","非主检出 freeze 警告且归档仍产出","平铺卡为纯 YAML 且 title 优先取 frontmatter"],"totalScenarios":4},{"req":"@req:r25","title":"thaw 回置与双向兼容","hardness":"L1","body":"`thaw --change <名>`(可重复)MUST 将冷备中的归档目录回置到 `llmanspec/changes/archive/`;`<名>` 匹配平铺卡 `<YYYY-MM-DD>-<id>.yaml` 或冷备 7z 内 `<YYYY-MM-DD>-<id>/` 条目,匹配卡时 MUST 在成功后删除对应卡;未知名 MUST 报错并列出可用条目;","scenarios":["冻结解冻自洽","thaw 回置并移除平铺卡","thaw 未知名报错并列出可用条目"],"totalScenarios":3},{"req":"@req:r121","title":"冻结卡形态归一","hardness":"L1","body":"平铺卡 MUST 只以无围栏单文档 YAML 形态写出(`freeze` 与 `thaw` 写出一律如此);通用单文档 YAML 校验器 MUST 能直接解析本工具写出的卡。读取侧 MUST 继续兼容 `---` 围栏卡(存量前代 产物),使未迁移的仓库照常可读、graph 归档节点与依赖边不变。","scenarios":["归一动作 dry-run 零写入","归一动作幂等且零误改","归一后通用单文档校验器可解析"],"totalScenarios":3},{"req":"@req:r33","title":"review --capability 过滤口径","hardness":"L1","body":"`review --capability <C>` MUST 将 unbound 信号限定为 C(其余 capability 的同类信号 MUST NOT 输出),locked 与 validate 汇总 MUST 保持全局口径,退出码语义不变;`--json` 输出 MUST 同样过滤;未提供 `--capability` 时 MUST 保持全量信号。","scenarios":["capability 过滤生效"],"totalScenarios":1},{"req":"@req:r56","title":"thaw 目的地覆盖","hardness":"L1","body":"`thaw` MUST 支持 `--dest <path>` 将回置目标改为指定目录(目录不存在 MUST 自动创建);缺省回置目标 MUST 仍为 `llmanspec/changes/archive/`。","scenarios":["thaw 目的地覆盖"],"totalScenarios":1},{"req":"@req:r120","title":"freeze 内容过滤(gitignore 层叠)","hardness":"L1","body":"freeze 内容过滤 MUST 在打包前对每个候选目录求值忽略链,仅将未被忽略的文件清单传入 7z,不再整目录吸入; 忽略判定 MUST 为 git 式层叠 .gitignore 求值:候选目录树内各层 .gitignore 由里向外、最深匹配层优先,链 MUST 自候选目录经实例根上溯至项目根(自实例根向上探测 .git 定位),无 .git 时 MUS","scenarios":["freeze 依据根 .gitignore 排除被忽略产物","嵌套 .gitignore 层叠且项目根规则上溯生效","ignore-file 用户补充忽略文件最高优先","ignore-file 指向不存在文件时报错且零变更","过滤后的冷备可自洽解冻"],"totalScenarios":5}]},"real:scope-boundaries":{"kind":"doc","title":"scope-boundaries（真实生产 · 5 规则 / 16 场景 / 108 行）","rules":[{"req":"@req:r113","title":"命名空间唯一性域按实例根","hardness":"L1","body":"四类命名空间的唯一性域 MUST 各自锚定单一实例根:req id(`rN`)域以 peripheral-commands r94 为唯一出处(各根注册表独立、跨根不保证唯一);change id 域为当前实例根的 `changes/` 树(含 `changes/archive/<日期>-<id>/` 与叶目录名,门见 validation r87);cap","scenarios":["同名 capability 与同号 change 跨根并存不阻断聚合校验"],"totalScenarios":1},{"req":"@req:r114","title":"跨根同号 MUST 可观测且不阻断","hardness":"L1","body":"跨根同名或同号 MUST 在聚合校验面可观测:MUST 以「类别(spec|req|change) + 共享值 + 涉及根列表」明细条目与计数汇总的形式出现在 `validate --all-roots` 的聚合报告中;human 形态 MUST 附带指向 `--directory` 的处置指引,machine 形态 MUST NOT 携带该指引行;观测 M","scenarios":["跨根同号在聚合报告可观测且不改退出码","单根聚合不产出观测段"],"totalScenarios":2},{"req":"@req:r115","title":"根限定一律经 --directory","hardness":"L1","body":"跨实例根消歧 MUST 仅经 cli r109 的 `--directory <path>`;MUST NOT 引入 id 内嵌根限定语法(形如 `<path>#<id>` 或 `<root>:<id>`),任何命令的参数面 MUST NOT 接受或解析此类复合标识符。解析出的实例根 MUST 决定该命令的全部读写目标。","scenarios":["index 与 context 不再写入任何实例","req 注册表按 --directory 限定实例根","复合根限定标识符不被接受","冒号形态复合标识符同样不被任何命令解析","validate 按 --directory 判定被限定实例根的注册表","相对 --directory 与绝对写法等价"],"totalScenarios":7},{"req":"@req:r116","title":"写入目标默认限当前实例根","hardness":"L1","body":"写入或改写文件的命令,其默认目标 MUST 限于当前解析出的实例根之内,其他实例根的文件 MUST NOT 被隐式改写。两处显式豁免:`init` 及其 `--update` 按发现算子刷新其他实例根的托管块(既有多根写先例);用户显式传入的路径参数按参数原义处理。`spec migrate-native` MUST NOT 存在。","scenarios":["spec 写面只改写命中实例根","change 写面只改写命中实例根","archive 写面只改写命中实例根","init --update 跨根刷新托管块属显式豁免","显式路径参数按原义处理属显式豁免"],"totalScenarios":5},{"req":"@req:r117","title":"路径单一归属门不回归","hardness":"L1","body":"MUST NOT 重新引入跨实例根的 `# scope:` 路径单一归属校验:根 `specs/` 的 `# scope:` 命中另一个已存在的实例目录时 MUST NOT 报 ERROR、MUST NOT 使 validate 失败或退出码非零。该判定自 0.8.0 起为报告制观察面而非错误门,重新引入会与 per-root 唯一性域自相矛盾。","scenarios":["根 scope 覆盖已带 llmanspec 的子包目录不报错"],"totalScenarios":1}]},"real:spec-authoring":{"kind":"doc","title":"spec-authoring（真实生产 · 3 规则 / 11 场景 / 96 行）","rules":[{"req":"@req:r41","title":"spec add-req 追加规则","hardness":"L1","body":"`spec add-req <capability> <req_id> --title <T> --statement <S>`(别名 add-requirement)MUST 校验 req_id 全局唯一(重复 MUST 报错;statement 为自由文本,不校验规范语义词),然后向目标 spec 追加一个 `@req:<id>` + 规则块并写盘——块","scenarios":["authoring 追加解析注册表闭环","add-req 追加原生规则块","add-req 目录式布局自动发现"],"totalScenarios":3},{"req":"@req:r42","title":"spec add-scenario 追加验收场景","hardness":"L1","body":"`spec add-scenario <capability> <req_id> <scenario_id> --when <W> --then <T> [--given <G>]` MUST 在目标 req 存在时向该规则块插入一个嵌套场景(given 缺省为空;场景与步骤关键字 MUST 取自目标 spec 方言在官方 gherkin 词表(@cucum","scenarios":["add-scenario 追加与缺失零副作用","add-scenario 目录式布局自动发现"],"totalScenarios":2},{"req":"@req:r43","title":"resolve-req 反查与注册表去重","hardness":"L1","body":"`spec resolve-req <req_id>` MUST 输出该 req 的 capability 与 statement,未命中 MUST 报错;`project dedupe-req-ids` MUST 扫描主库(非归档 specs)冲突 rN(同文件内多条规则共用或跨文件)并重映射,重映射取号 MUST 消费与全局取号同一的数字 id 分配器(","scenarios":["resolve-req 输出 statement 与未命中报错","dedupe dry-run 零副作用","dedupe 重映射冲突","dedupe 重映射同文件冲突","dedupe 重映射取 max+1 序列而非最小空闲号","dedupe 重映射不误伤前缀相近句柄"],"totalScenarios":6}]},"real:spec-parsing":{"kind":"doc","title":"spec-parsing（真实生产 · 8 规则 / 17 场景 / 148 行）","rules":[{"req":"@req:r7","title":"解析语言兜底链","hardness":"L1","body":".feature 解析 MUST 以 en 匹配器起步(`# language:` 头自动生效),失败后 MUST 回退 zh-CN 匹配器再试,仍失败才报错。config locale MUST 先按 init-generators r18 归一为内置默认 zh-Hans(未知取值同样归一),归一值 zh-Hans MUST 映射为 gherkin 语言代","scenarios":["语言兜底链与 locale 映射","skeleton 语言头经映射派生"],"totalScenarios":2},{"req":"@req:r8","title":"头注释契约","hardness":"L1","body":"每个 capability .feature 的头注释区(连续 `#` 行,至首个非 `#` 行止)MUST 含 `# purpose:` 且非空;其构成 CapabilityDoc 头部的唯一结构化字段 `purpose`,缺失或空 MUST 报错。`# language:` 仍按 Gherkin 方言头处理。历史或未知的头注释行(含 `# capabil","scenarios":["缺 purpose 头注释报错","历史头注释行按普通注释解析"],"totalScenarios":2},{"req":"@req:r101","title":"spec id 全局分配与消歧","hardness":"L1","body":"在单个 `llmanspec/specs/` 实例内,discover 全部 `.feature` 后 MUST 为每文件分配 spec id(与 CLI 参数 `show`/`validate`/`spec add-req` 的 capability 同名)。设 `rel` 为相对 specs 根的 路径、`stem` 为文件名去 `.feature`、`","scenarios":["扁平与目录主文件短 id","preferred 撞名时改用相对路径 id","功能标题必须等于 spec id"],"totalScenarios":3},{"req":"@req:r9","title":"原生分层解析语义","hardness":"L1","body":".feature MUST 按 功能→规则→场景 原生分层解析:`规则:` 块的标题与描述(自由文本)+ `@req:<id>` 句柄(块头标签)进 RuleIR, 块内嵌套 `场景:` 进该规则的 scenarios(步骤原样);不在任何 `规则:` 内的顶层 `场景:` 为功能级示例(Gherkin 原生允许,无规则句柄、 不参与规则统计;官方解析器下首","scenarios":["中文 feature 解析为 IR","历史标签惰性与原生结构"],"totalScenarios":2},{"req":"@req:r10","title":"全局 rN 注册表","hardness":"L1","body":"跨全部 specs 的 @req:rN MUST 构成全局唯一注册表;重复 id(同一文件内多条规则共用或跨文件,按携带该 id 的规则条数 > 1 判定)MUST 被报告且报告 MUST 含每个出现位置(文件与文件内规则)。","scenarios":["重复 req id 被发现","同文件内重复 req id 被发现"],"totalScenarios":2},{"req":"@req:r65","title":"迁移保留规则场景自身步骤","hardness":"L1","body":"原生迁移渲染规则块时,legacy 规则场景(@req + @rule/@human)自身解析出的验收步骤 MUST 合成为该规则块内的自动嵌套 `场景: 验收示例`(紧跟描述行之后、既有归属验收之前),步骤关键字与文本 MUST 原样保留,不得静默丢弃;该自动嵌套场景 MUST 计入迁移摘要的 scenario 计数。带 @skip 的规则场景,其自动嵌套","scenarios":["描述与步骤同体的规则场景迁移保留步骤","带 @skip 的同体规则场景迁移继承跳过"],"totalScenarios":2},{"req":"@req:r88","title":"迁移输出方言一致并强制解析自检","hardness":"L1","body":"原生迁移的产物 MUST 与源 feature 的解析方言一致(方言按统一口径判定:文件 `# language:` 头注释优先,无头内容经语言兜底链自动发现,仍不可判时兜底英文),规则/场景块关键字 MUST 取自该方言在官方 gherkin 词表(@cucumber/gherkin dialects)中的合法关键字,且 MUST 确定性选取:过滤 `* ","scenarios":["en 方言 legacy 迁移保持方言一致","zh-CN 方言迁移输出保持中文关键字","官方词表跨方言迁移"],"totalScenarios":3},{"req":"@req:r103","title":"原生 Gherkin 场景大纲与例子表解析及行展开","hardness":"L1","body":"parseCapability MUST 将原生 Gherkin 场景大纲(Scenario Outline)及其例子(Examples)表解析入 ScenarioIR.examples(含 headers 与 rows,不引入任何额外 Tag 字段);空例子表(0 数据行)的场景大纲 MUST 判定为非 runnable;BDD runner MUST 按","scenarios":["场景大纲与例子表进入 IR 且空表不计入 runnable"],"totalScenarios":1}]},"real:studio-cli":{"kind":"doc","title":"studio-cli（真实生产 · 4 规则 / 4 场景 / 58 行）","rules":[{"req":"@req:r134","title":"纯父分组、原子存储、缺省 state-id 消歧与会话管理","hardness":"L1","body":"`llman-sdd studio` MUST 作为纯父分组挂载于 CLI 根命令，裸调不带子命令 MUST 向 stderr 输出用法并以退出码 2 退出；所有 Studio 子命令 MUST 声明并接受 `--directory <path>` 经统一实例根发现解析工作区。 本地草稿持久化 MUST 经 `makeNodeStudioStateIo(in","scenarios":["studio 纯父分组裸调、会话列表清理与多草稿消歧"],"totalScenarios":1},{"req":"@req:r135","title":"只读语义 Diff、图校验预检与结构化 Prompt","hardness":"L1","body":"`studio diff [state-id]` MUST 输出各状态机的语义 Diff、未解决评论与基于 `jsdiff` 的内存 Unified Diff 预览，支持 `--json`、`--compact-json`、`--no-unified` 与 `--directory`，MUST NOT 新增 TOON 耦合。 `studio validate","scenarios":["只读 diff、validate --patch 预检与 prompt 输出"],"totalScenarios":1},{"req":"@req:r136","title":"评论回复与非破坏性 Agent 修订建议写回","hardness":"L1","body":"`studio comment reply <state-id> <comment-id> --body <text>` MUST 将 Agent 回复原子追加到目标草稿并关联 `replyTo`，传入 `--resolve` 时 MUST 同时将目标评论置为 `resolved`。 `studio revise <state-id>` MUST 支持从 `","scenarios":["评论回复与 revise 建议写回不覆盖人类草稿"],"totalScenarios":1},{"req":"@req:r137","title":"studio apply 语义直写与默认分支强护栏","hardness":"L1","body":"`studio apply <state-id>` MUST 先对草稿中全部非移除状态机运行 E1–E4 图校验，存在阻断错时 MUST 拒绝落盘并以退出码 1 退出。 传入 `--dry-run` 时 MUST 在任意分支（含默认分支）零副作用地输出各目标 `.feature` 的内存 Unified Diff 并以退出码 0 退出。 未传入 `--dry","scenarios":["默认分支拒写、dry-run 预览与特性分支抗行号偏移语义写回"],"totalScenarios":1}]},"real:studio-core":{"kind":"doc","title":"studio-core（真实生产 · 6 规则 / 6 场景 / 59 行）","rules":[{"req":"@req:r128","title":"状态机图 IR 与双来源提取","hardness":"L1","body":"Studio 纯域 MUST 复用 validation 的状态流转发现与列映射逻辑，从 `SpecEntry[]` 提取纳管状态机为带稳定 `uid` 的纯 JSON `StudioMachineIR`，同时支持 `mode: 'modify'`、`mode: 'create'` 与 `mode: 'remove'`；布局坐标 `(x, y)` MUST ","scenarios":["从 specs 提取纳管状态机并支持从零新建草稿"],"totalScenarios":1},{"req":"@req:r129","title":"可扩展 Linter 全量图校验","hardness":"L1","body":"`validateMachineGraph(machine)` MUST 一次收集全部诊断项而非首错短路，每条诊断携带 `code`、`severity`（`error` 或 `warning`）、精确图元定位及可选 `fixable` 标记；阻断错层严格覆盖 E1 结构完整性、E2 确定性冲突、E3 孤岛不可达与 E4 死锁陷阱，并支持非阻断警告规则（如 ","scenarios":["全量诊断同时报告冲突孤岛死锁与警告"],"totalScenarios":1},{"req":"@req:r130","title":"忽略坐标并识别状态改名的语义 Diff","hardness":"L1","body":"`computeMachineDiff(draft)` MUST 仅对比 `baseline` 与 `current` 而忽略布局坐标，按 `uid` 精准区分状态新增、删除与重命名（状态改名不得引爆相连边的假删增），并细粒度标注转移变化的字段；`formatSemanticDiff` MUST 产出简洁的 `+ / - / ~` 人读摘要。","scenarios":["重命名状态与调整坐标不产生假边删除"],"totalScenarios":1},{"req":"@req:r131","title":"图元锚定评论与不覆盖人类草稿的修订建议层","hardness":"L1","body":"评论线程与 Agent 修订建议 MUST 锚定到稳定图元句柄；Agent 提交的 `StudioRevisionProposal`（支持 `rename_state`、`add_state`、`remove_state`、`add_transition`、`remove_transition`、`update_transition`）MUST 仅以 `pe","scenarios":["Agent 修订建议经预演与显式采纳后才生效"],"totalScenarios":1},{"req":"@req:r132","title":"本地时间线草稿存储契约与内置样例","hardness":"L1","body":"本地草稿会话持久化于 `<instanceRoot>/.llman-sdd/studio/states/<stateId>.json`，经注入式 `StudioStateIo` 以临时文件加原子 `rename` 写盘并做 `zod` 与路径安全校验；文档内置以不可变实际真理为 `BASE` 的 Git 式线性变更时间线（统一撤销、只读观测、回滚与净 Dif","scenarios":["原子读写本地时间线草稿并校验内置样例全绿"],"totalScenarios":1},{"req":"@req:r133","title":"无损更新 .feature 表格、提案草案与内存 Unified Diff 预览","hardness":"L1","body":"`renderUpdatedFeatureSour     function buildDecisionTreeSvg(detail) {
      // Compile any multi-column truth table into an intuitive left-to-right visual Decision Tree SVG!
      const headers = detail.headers || [];
      const rows = detail.rows || [];
      const condCols = headers.slice(0, -1);
      const outCol = headers[headers.length - 1] || '结论';
      if (!condCols.length || !rows.length) return '';

      function buildNode(colIdx, subset) {
        const outs = [...new Set(subset.map(r => r[r.length - 1]))];
        if (outs.length === 1 || colIdx >= condCols.length) {
          return { leaf: true, label: outs.join(' / '), rowIndices: subset.map(r => rows.indexOf(r)) };
        }
        const groups = new Map();
        subset.forEach(r => {
          const v = r[colIdx] || '—';
          if (!groups.has(v)) groups.set(v, []);
          groups.get(v).push(r);
        });
        const children = [...groups.entries()].map(([val, sub]) => ({ edgeLabel: val, node: buildNode(colIdx + 1, sub) }));
        return { leaf: false, label: condCols[colIdx], children };
      }

      const root = buildNode(0, rows);
      let leafY = 0;
      const rowH = 54, colW = 195;
      function layout(n, depth) {
        n.x = 76 + depth * colW;
        if (n.leaf) {
          n.y = 36 + leafY * rowH;
          leafY += 1;
        } else {
          n.children.forEach(c => layout(c.node, depth + 1));
          const ys = n.children.map(c => c.node.y);
          n.y = (Math.min(...ys) + Math.max(...ys)) / 2;
        }
      }
      layout(root, 0);
      const maxDepth = condCols.length;
      const svgW = Math.max(660, 150 + (maxDepth + 1) * colW);
      const svgH = Math.max(210, 44 + leafY * rowH);
      const inkHex = cssVar('--ink', '#14171f'), surfHex = cssVar('--surface', '#ffffff'), bdHex = cssVar('--border-strong', '#c5ccd9');
      const accHex = cssVar('--accent', '#2f54eb'), grnHex = cssVar('--green', '#0f7b55'), redHex = cssVar('--red', '#c92a2a');
      let edgesSvg = '', nodesSvg = '';
      function draw(n) {
        if (!n.leaf) {
          n.children.forEach(c => {
            const x1 = n.x + 64, y1 = n.y, x2 = c.node.x - 66, y2 = c.node.y;
            const mx = (x1 + x2) / 2;
            const eCol = c.edgeLabel === '否' || c.edgeLabel === '无' ? '#94a3b8' : accHex;
            edgesSvg += `<path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" stroke="${eCol}" stroke-width="1.6"/>`;
            edgesSvg += `<rect x="${mx - 16}" y="${(y1 + y2) / 2 - 9}" width="32" height="16" rx="4" fill="${surfHex}" stroke="${eCol}" stroke-width="1"/>`;
            edgesSvg += `<text x="${mx}" y="${(y1 + y2) / 2 + 2.5}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${eCol}">${esc(c.edgeLabel)}</text>`;
            draw(c.node);
          });
          nodesSvg += `<g><rect x="${n.x - 64}" y="${n.y - 17}" width="128" height="34" rx="8" fill="${cssVar('--t-flow-bg', '#f5f3ff')}" stroke="${cssVar('--t-flow-bd', '#d6c9ff')}" stroke-width="1.5"/><text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="${inkHex}">${esc(n.label)}？</text></g>`;
        } else {
          const isBlock = /BLOCK|拒绝|失败/i.test(n.label);
          const fill = isBlock ? cssVar('--red-soft', '#fdf0f0') : cssVar('--green-soft', '#eefaf4');
          const stroke = isBlock ? redHex : grnHex;
          const bw = Math.max(122, Math.min(188, n.label.length * 8 + 26));
          nodesSvg += `<g class="dt-leaf-node" data-leaf-rows="${n.rowIndices.join(',')}" style="cursor:pointer;"><rect x="${n.x - 66}" y="${n.y - 17}" width="${bw}" height="34" rx="17" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/><text x="${n.x - 66 + bw / 2}" y="${n.y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="${stroke}">${esc(n.label)}</text></g>`;
        }
      }
      draw(root);
      return `<div class="dt-tree-wrap"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;color:var(--text-muted);"><span>条件判断树（由 ${rows.length} 行真值表实时投影 · 点击右侧绿色/红色结论胶囊可直接修改或留评论）</span><span style="font-family:var(--mono);">输出：${esc(outCol)}</span></div><svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;min-height:200px;max-height:360px;display:block;">${edgesSvg}${nodesSvg}</svg></div>`;
    }

    function renderDrillDoc() {
      const stage = document.getElementById('stage'); stage.innerHTML = '';
      const docId = store.activeDocId;
      const docNode = store.forestNodes.find(n => n.id === docId || n.docKey === docId);
      const docKey = docNode?.docKey || docId;
      const doc = resolveTextFold(docKey);
      const detail = DOC_DETAILS[docKey] || DOC_DETAILS[docId] || {
        kind: docNode?.kind || 'doc',
        title: `${docId} · 规则契约摘要`,
        rules: [{ req: '@req:spec', hardness: 'L0', title: '规格核心约束', body: doc.levels[0] }],
      };
      const isDecision = detail.kind === 'decision';
      const hasRules = Array.isArray(detail.rules) && detail.rules.length > 0;
      const frame = document.createElement('div'); frame.className = 'doc-frame';
      let decisionBlockHtml = '';
      let rulesBlockHtml = '';

      if (isDecision && detail.headers && detail.rows) {
        const vMode = store.decisionViewMode || 'tree';
        const wi = store.whatIfFilters[docKey] || {};
        const condCols = detail.headers.slice(0, -1);
        const hasWi = Object.values(wi).some(Boolean);
        const wiBar = `
          <div class="whatif-bar">
            <strong style="color:var(--ink);">条件推演：</strong>
            ${condCols.map((h, ci) => {
              const vals = [...new Set(detail.rows.map(r => r[ci]))];
              return `<span style="display:inline-flex;align-items:center;gap:3px;"><span>${esc(h)}=</span>${vals.map(v => `<button class="q-chip ${wi[ci] === v ? 'active' : ''}" style="${wi[ci] === v ? 'background:var(--ink);color:var(--surface);border-color:var(--ink);' : ''}" data-wi-col="${ci}" data-wi-val="${esc(v)}">${esc(v)}</button>`).join('')}</span>`;
            }).join('<span style="color:var(--border-strong);">·</span>')}
            ${hasWi ? '<button class="q-chip" id="wiClear">重置</button>' : ''}
          </div>

        const tableHtml = `
          ${wiBar}
          <table class="truth-table">
            <thead><tr>${detail.headers.map((h, i) => `<th style="${i === detail.headers.length - 1 ? 'color:var(--green);' : ''}">${esc(h)}</th>`).join('')}</tr></thead>
            <tbody>${detail.rows.map((r, rIdx) => {
              const match = !hasWi || condCols.every((_, ci) => !wi[ci] || r[ci] === wi[ci] || r[ci] === '—');
              return `<tr class="${hasWi ? (match ? 'wi-hit' : 'wi-dim') : ''}">${r.map((c, idx) => `<td>${idx === r.length - 1 ? `<strong style="cursor:pointer;color:var(--accent);" data-edit-row="${rIdx}" title="点击调整此行结论（进入草稿）">${esc(c)} ✎</strong>` : esc(c)}</td>`).join('')}</tr>`;
            }).join('')}</tbody>
          </table>`;
        decisionBlockHtml = `
          <div class="card" style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <div style="font-weight:700;">${esc(detail.title)}</div>
              <div class="cl-seg">
                <button class="cl-seg-btn ${vMode === 'tree' ? 'active' : ''}" data-dvm="tree">${ICONS.flow(11)} 决策树图</button>

      }

      if (hasRules || !isDecision) {
        const allRules = detail.rules || [];
        const q = (store.docSearchQuery || '').trim().toLowerCase();
        const weakCnt = allRules.filter(r => (r.hardness || 'L0') === 'L0').length;
        const shownRules = allRules.filter(r => {
          if (store.docHardnessFilter === 'weak' && (r.hardness || 'L0') !== 'L0') return false;
          if (!q) return true;
          return `${r.req} ${r.title} ${r.body} ${(r.scenarios || []).join(' ')}`.toLowerCase().includes(q);
        });
        const hardLabel = (h) => h === 'L0' ? '仅文档' : h === 'L1' ? '已绑测试' : h === 'L2' ? '防漂移' : '形式化';
        rulesBlockHtml = `

            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">

            ${detail.convertible ? `

                <span>💡 建议：可将以上流转/分支规则升级为「${esc(detail.convertible.targetKind)}」以便画布直接调整</span>
                <button class="mini-act" id="btnConvertRule" style="flex:none;color:var(--accent);border-color:var(--accent-border);">生成转图 Prompt</button>
              </div>` : ''}
          </div>`;
      }
      const detailHtml = `${decisionBlockHtml}${rulesBlockHtml}`;

      const docOpenComments = store.comments.filter(c => c.machineId === '__doc__' && c.anchorKind === 'doc' && c.anchorId === docId && c.status !== 'resolved').length;
      frame.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="type-icon-box ${isDecision ? 'decision' : 'doc'}" style="width:34px;height:34px;">${isDecision ? ICONS.decision(17) : ICONS.doc(17)}</span>
            <div>
              <h2 style="margin:0;font-size:15.5px;color:var(--ink);">${esc(docId)}.feature · ${isDecision ? '决策树 / 真值表' : '规则条款'}</h2>
              <p style="margin:3px 0 0;font-size:11px;color:var(--text-muted);">
                ${store.textFoldProvider === 'serve' ? '语义折展：已连接本机 TextFold 服务' : '语义折展：内置自动折展（可在左下「画布」配置外部 TextFold 服务）'}

          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <button class="ibtn" id="docCommentBtn">${ICONS.note(12)}<span>评论${docOpenComments ? ` (${docOpenComments})` : ''}</span></button>
            <button class="ibtn" id="docShareBtn">${ICONS.link(12)}<span>分享状态</span></button>
            <button class="dock-cta primary" id="docPromptBtn">${ICONS.commit(12)}<span>生成调整 Prompt</span></button>
          </div>
        </div>
        <div class="card card-warm" style="font-size:13.5px;line-height:1.72;white-space:pre-wrap;">${esc(doc.levels[store.textFoldLevel])}</div>

      frame.querySelectorAll('[data-dvm]').forEach(b => b.onclick = () => { store.decisionViewMode = b.dataset.dvm; renderDrillDoc(); });
      frame.querySelectorAll('[data-dhf]').forEach(b => b.onclick = () => { store.docHardnessFilter = b.dataset.dhf; renderDrillDoc(); });
      const searchEl = frame.querySelector('#docRuleSearch');
      if (searchEl) {

      const convBtn = frame.querySelector('#btnConvertRule');
      if (convBtn) {

          `规则转${detail.convertible.targetKind} · Prompt`,

      frame.querySelector('#docShareBtn').onclick = (ev) => {

      frame.querySelector('#docPromptBtn').onclick = () => {

        const lines = [

      };
      stage.appendChild(frame);
    }

    function renderDrillMachine() {
      const { stage, world } = createWorldLayer();
      const diff = computeDiff(), issues = validateE1E4();
      const errS = new Set(issues.filter(i => i.targetKind === 'state').map(i => i.targetId));
      const errE = new Set(issues.filter(i => i.targetKind === 'edge').map(i => i.targetId));

      const pending = store.revisions.find(r => r.status === 'pending' && r.machineId === store.activeMachineId);
      const rStates = [...curDraft().states], rEdges = [...curDraft().transitions];
      if (pending?.addState && !rStates.some(s => s.uid === pending.addState.uid)) rStates.push({ ...pending.addState, _ghost: true, _source: pending.source });
      if (pending) pending.addEdges.forEach(ge => rEdges.push({ ...ge, _ghost: true, _source: pending.source }));

      // In ReviewDiff mode, ALSO overlay deleted baseline states & edges as red-dashed ghosts!
      if (store.mode === 'review' && curModeFlag() !== 'remove') {
        for (const uid of diff.statesRemoved) {
          const bs = curBase().states.find(s => s.uid === uid);
          if (bs) rStates.push({ ...bs, _deleted: true });

      }

      // Worldline live 1:1 canvas overlay diff: inject states & transitions removed vs comparison baseline A!
      const wlStateDiff = getWorldlineLiveDiff(store.activeMachineId);
      if (wlStateDiff) {
        wlStateDiff.removedItems.forEach(rs => {
          if (!rStates.some(s => s.uid === rs.uid)) rStates.push(rs);
        });
        wlStateDiff.removedEdges.forEach(re => {
          if (!rEdges.some(e => e.fromUid === re.fromUid && e.toUid === re.toUid && e.event === re.event)) rEdges.push(re);
        });
      }

      const outDeg = new Map(rStates.map(s => [s.uid, 0]));
      rEdges.forEach(e => outDeg.set(e.fromUid, (outDeg.get(e.fromUid) || 0) + 1));

      const hoverDimOn = store.mode === 'explore' && isHoverDimActive();
      const hvNbr = new Set();
      if (hoverDimOn) {
        hvNbr.add(store.hoveredId);
        rEdges.forEach(e => { if (e.fromUid === store.hoveredId) hvNbr.add(e.toUid); if (e.toUid === store.hoveredId) hvNbr.add(e.fromUid); });
      }

      // Machine Boundary Frame + Optional Outer Parent Context Frame (Box-in-Box for Nested Graphs!)
      let bMinX = Infinity, bMaxX = -Infinity, bMinY = Infinity, bMaxY = -Infinity;
      rStates.forEach(s => {
        bMinX = Math.min(bMinX, s.x); bMaxX = Math.max(bMaxX, s.x);
        bMinY = Math.min(bMinY, s.y); bMaxY = Math.max(bMaxY, s.y);
      });
      if (!Number.isFinite(bMinX)) { bMinX = 120; bMaxX = 800; bMinY = 120; bMaxY = 420; }
      const boxLeft = Math.round(bMinX - 155), boxRight = Math.round(bMaxX + 155);
      const boxTop = Math.round(bMinY - 78), boxBottom = Math.round(bMaxY + 110);
      const boxMidY = Math.round((boxTop + boxBottom) / 2);
      const isFlowView = curBase()?.graphKind === 'flow';
      const parentCtx = getParentNestContext();

      // Build Portals: when nested, dynamically project REAL parent-layer incoming/outgoing neighbor nodes!
      let portals = [];
      if (parentCtx) {
        const layVert = (items, xPos) => {
          const span = 104;
          const startY = boxMidY - ((items.length - 1) * span) / 2;
          return items.map((it, i) => ({ ...it, x: xPos, y: Math.round(startY + i * span), isParentCtx: true }));
        };
        const inPortals = layVert(parentCtx.incoming, boxLeft - 235);
        let outItems = parentCtx.outgoing;
        if (!outItems.length && !isFlowView) {
          outItems = [{ uid: null, title: 'finance', desc: '下游打款契约', edgeLabel: '终态触发', dir: 'out', parentIdx: parentCtx.parentIdx, isExternalFallback: true }];
        }
        const outPortals = layVert(outItems, boxRight + 235);
        portals = [...inPortals, ...outPortals];

        // Outer Parent Context Frame wrapping both parent neighbor portals & inner child boundary!
        const outerLeft = inPortals.length ? boxLeft - 360 : boxLeft - 42;
        const outerRight = outPortals.length ? boxRight + 360 : boxRight + 42;
        const outerTop = boxTop - 62;
        const outerBottom = boxBottom + 42;
        const pFrame = document.createElement('div');
        pFrame.className = 'parent-context-frame';

        pFrame.style.top = `${outerTop}px`;
        pFrame.style.width = `${outerRight - outerLeft}px`;
        pFrame.style.height = `${outerBottom - outerTop}px`;

        // Ergonomic Breadcrumb anchored directly on the top edge of the nested container (Fitts's Law!)
        const crumb = document.createElement('div');
        crumb.className = 'nest-frame-crumb';
        const backBtn = document.createElement('button');
        backBtn.className = 'nest-crumb-btn back';
        backBtn.innerHTML = `${ICONS.back(11)}<span>返回上层</span>`;

        backBtn.onclick = (ev) => { ev.stopPropagation(); jumpNestLevel(store.nestStack.length - 2, parentCtx.hostUid); };
        crumb.appendChild(backBtn);
        crumb.appendChild(Object.assign(document.createElement('span'), { className: 'sep-v', style: 'height:14px;' }));
        store.nestStack.forEach((step, idx) => {
          if (idx > 0) {

            sep.textContent = '›';
            sep.style.cssText = 'color:var(--text-muted);font-size:12px;';

        crumb.appendChild(lvlTag);
        pFrame.appendChild(crumb);
        world.appendChild(pFrame);
      } else {
        portals = store.activeMachineId === 'studio-web'

              { title: 'cli', dir: 'out', x: boxRight + 125, y: boxMidY - 82, evidence: '协商态生成 CLI 回调（studio diff / revise / apply）' },

      const mFrame = document.createElement('div');

        pop.querySelector('#ppOpenTab').onclick = () => { const t = store.portalPopover.title; store.portalPopover = null; openInNewTab(pIsGraph ? 'machine' : 'doc', pIsGraph ? pKey : (TF_DOCS[pKey] ? pKey : 'validation'), t); };

      }

      const accentHex = cssVar('--accent', '#2f54eb');
      const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svgEl.setAttribute('class', 'edges-layer'); svgEl.setAttribute('viewBox', '-1400 -1400 5200 4200');

        <marker id="ma-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="${accentHex}"/></marker>
        <marker id="ma-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#0f7b55"/></marker>
        <marker id="ma-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9a5b13"/></marker>
        <marker id="ma-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c92a2a"/></marker>
      </defs>`;

      // Cross-boundary connectors between parent-layer / external portals and the active Boundary Frame wall!
      portals.forEach(p => {
        const isIn = p.dir === 'in';
        const halfW = p.isParentCtx ? 82 : 62;
        const x1 = isIn ? p.x + halfW : boxRight;
        const x2 = isIn ? boxLeft : p.x - halfW;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        line.setAttribute('d', `M ${x1} ${p.y} L ${x2} ${p.y}`);
        line.setAttribute('fill', 'none');
        line.setAttribute('stroke', p.isParentCtx ? accentHex : '#98a2b3');
        line.setAttribute('stroke-width', p.isParentCtx ? '1.6' : '1.4');
        line.setAttribute('stroke-dasharray', p.isParentCtx ? '5 3' : '4 4');
        line.setAttribute('opacity', p.isParentCtx ? '0.82' : '0.7');
        line.setAttribute('marker-end', p.isParentCtx ? 'url(#ma-t)' : 'url(#ma)');
        svgEl.appendChild(line);

        if (p.edgeLabel) {
          const mx = (x1 + x2) / 2;
          const my = p.y - 14;
          const lbl = p.edgeLabel;
          const w = Math.min(148, lbl.length * 7.2 + 16);
          const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          bg.setAttribute('x', mx - w / 2); bg.setAttribute('y', my - 9);
          bg.setAttribute('width', w); bg.setAttribute('height', 18); bg.setAttribute('rx', 5);
          bg.setAttribute('fill', cssVar('--surface', '#ffffff'));
          bg.setAttribute('stroke', cssVar('--border', '#dfe3eb'));
          bg.setAttribute('stroke-width', '1');
          svgEl.appendChild(bg);
          const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          txt.setAttribute('x', mx); txt.setAttribute('y', my + 3.5);
          txt.setAttribute('text-anchor', 'middle');
          txt.setAttribute('font-size', '10');
          txt.setAttribute('fill', cssVar('--text-secondary', '#4b5465'));
          txt.textContent = lbl.length > 18 ? `${lbl.slice(0, 17)}…` : lbl;
          svgEl.appendChild(txt);
        }
      });

      let foundSelectedDrillEdge = false;
      const drillPlacedSegments = [];
      const drillPlacedLabels = [];
      for (const e of rEdges) {
        const a = rStates.find(s => s.uid === e.fromUid), b = rStates.find(s => s.uid === e.toUid);
        if (!a || !b) continue;
        const hasOpp = rEdges.some(o => o.uid !== e.uid && o.fromUid === e.toUid && o.toUid === e.fromUid);
        const pairIdx = rEdges.filter(o => o.fromUid === e.fromUid && o.toUid === e.toUid).findIndex(o => o.uid === e.uid);

        let dPath, lx, ly, sxPt, syPt, txPt, tyPt, drillObs = [];
        if (e.fromUid === e.toUid) {
          sxPt = a.x + 22; syPt = a.y - 36; txPt = a.x - 22; tyPt = a.y - 36;
          dPath = `M ${sxPt} ${syPt} C ${a.x + 76} ${a.y - 115}, ${a.x - 76} ${a.y - 115}, ${txPt} ${tyPt}`;
          lx = a.x; ly = a.y - 102;
        } else {
          const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy) || 1;
          const isLongBack = dx < -600 && Math.abs(dy) < 90;
          const nx = -dy / dist, ny = dx / dist;
          const oppBend = Math.abs(dy) > Math.abs(dx) ? 74 : 44;
          const bend = (hasOpp ? oppBend : 0) + pairIdx * 46;
          const bendX = isLongBack ? 0 : nx * bend;
          const bendY = isLongBack ? 310 : ny * bend;
          const trimX = store.tier === 'glyph' ? 52 : store.tier === 'map' ? 98 : 124;
          const trimY = store.tier === 'glyph' ? 52 : store.tier === 'map' ? 42 : 58;
          sxPt = isLongBack ? a.x : a.x + (dx / dist) * Math.min(trimX, dist * 0.35);
          syPt = isLongBack ? a.y + trimY : a.y + (dy / dist) * Math.min(trimY, dist * 0.35);
          txPt = isLongBack ? b.x : b.x - (dx / dist) * Math.min(trimX + 8, dist * 0.38);
          tyPt = isLongBack ? b.y + trimY + 6 : b.y - (dy / dist) * Math.min(trimY + 8, dist * 0.38);
          drillObs = rStates
            .filter(os => os.uid !== e.fromUid && os.uid !== e.toUid)
            .map(os => ({ x1: os.x - trimX, y1: os.y - trimY, x2: os.x + trimX, y2: os.y + trimY }));
          const g = computeEdgeGeom(
            sxPt, syPt, txPt, tyPt, store.edgePreset, bendX, bendY,
            drillObs, { ax: a.x, ay: a.y, bx: b.x, by: b.y, hwA: trimX, hhA: trimY, hwB: trimX, hhB: trimY },
            { placedSegments: drillPlacedSegments, manualOffset: e._bendOffset }
          );
          dPath = g.d; lx = g.lx; ly = g.ly;
          if (g.samplePts) {
            for (let i = 0; i < g.samplePts.length - 1; i++) drillPlacedSegments.push([g.samplePts[i], g.samplePts[i + 1]]);
          }
        }

        const isAdd = diff.edgesAdded.includes(e.uid) || e._ghost || !!wlStateDiff?.addedEdgeIds.has(e.uid);
        const isMod = diff.edgesModified.some(m => m.uid === e.uid);
        const isRem = curModeFlag() === 'remove' || !!e._deleted || !!e._wlRemoved, isErr = errE.has(e.uid);
        const isSel = store.selected?.kind === 'edge' && store.selected.id === e.uid;
        if (isSel) { store.selectedEdgeAnchor = { x: lx, y: ly }; foundSelectedDrillEdge = true; }
        const dim = !isSel && ((hoverDimOn && e.fromUid !== store.hoveredId && e.toUid !== store.hoveredId) || (store.mode === 'review' && !isAdd && !isMod && !isRem && !isErr));

        let color = '#7c8799', marker = 'url(#ma)';
        if (isErr || isRem) { color = '#c92a2a'; marker = 'url(#ma-r)'; }
        else if (isAdd) { color = '#0f7b55'; marker = 'url(#ma-g)'; }
        else if (isMod) { color = '#9a5b13'; marker = 'url(#ma-a)'; }
        else if (isSel) { color = accentHex; marker = 'url(#ma-t)'; }

        const grp = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        grp.setAttribute('class', 'edge-grp');

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'edge-vis');
        path.setAttribute('d', dPath); path.setAttribute('fill', 'none'); path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', store.tier === 'glyph' ? '3' : (isSel ? '2.6' : (isAdd || isMod || isErr ? '2.2' : '1.5')));
        if (e._ghost || isRem) path.setAttribute('stroke-dasharray', '6 4');
        path.setAttribute('opacity', dim ? '0.15' : (e._deleted ? '0.68' : '0.92')); path.setAttribute('marker-end', marker);
        grp.appendChild(path);

        const onEdgeClick = (ev) => {
          ev.stopPropagation();
          closeAllTransient(true);
          if (store.mode === 'simulate') {
            if (e.fromUid === store.sim.currentUid) {
              const ok = !e.guard || !!store.sim.guards[e.guard];
              if (!ok) { toast(`守卫 [${e.guard}] 当前为假，请在底栏勾选守卫开关`); return; }
              store.sim.currentUid = e.toUid;
              store.sim.trace.push(`${e.event} → ${stateName(e.toUid)}`);
              render();
            } else {
              toast(`试跑态仅可触发当前状态「${stateName(store.sim.currentUid)}」的出边`);
            }
            return;
          }
          if (e._deleted) { toast('该转移已在草稿中删除（可在时间线观测或回滚）'); return; }
          if (e._ghost) { store.mode = 'negotiate'; store.selected = { kind: 'negotiate' }; store.selectedEdgeAnchor = null; render(); return; }
          store.selected = { kind: 'edge', id: e.uid };
          store.edgeDrawerOpen = false;
          store.selectedEdgeAnchor = { x: lx, y: ly };
          if (checkDoubleClick(`edge:${e.uid}`)) {

          render();
        };
        const onEdgeDblClick = (ev) => {

          if (store.mode === 'simulate' || e._deleted || e._ghost) return;

          store.selectedEdgeAnchor = { x: lx, y: ly };

        const onEdgeCtx = (ev) => {

          hSrc.onmousedown = (ev) => startEdgeEndpointDrag(ev, 'drill', e.uid, 'source', txPt, tyPt);

    function renderDagPanel() {
      const panel = document.getElementById('dagPanel'), bd = document.getElementById('dagBackdrop');

      const sel = DAG_CHANGES.find(c => c.id === store.dagSelectedId) || DAG_CHANGES[0];
      const related = new Set([sel.id]);
      sel.deps.forEach(d => related.add(d));

      const isTB = store.dagDir === 'TB', isCompact = store.dagDensity === 'compact';

        : { C1: { x: 108, y: 142 }, C2: { x: 350, y: 74 }, C3: { x: 350, y: 210 }, C4: { x: 608, y: 58 }, C5: { x: 608, y: 144 }, C6: { x: 608, y: 230 } };
      const vb = isTB ? '0 0 294 402' : '0 0 726 286';
      const svgW = store.dagExpanded ? (isTB ? 'min(480px, 100%)' : 'min(920px, 100%)') : '100%';

      let edgesSvg = '', nodesSvg = '';
      for (const c of DAG_CHANGES) {
        for (const depId of c.deps) {
          const a = pos[depId], b = pos[c.id], hl = (c.id === sel.id || depId === sel.id);
          const sx = isTB ? a.x : a.x + nw / 2, sy = isTB ? a.y + nh / 2 : a.y;
          const tx = isTB ? b.x : b.x - nw / 2, ty = isTB ? b.y - nh / 2 : b.y;
          const g = computeEdgeGeom(sx, sy, tx, ty, store.dagEdgeStyle, isTB ? 0 : 12, isTB ? 10 : 0);
          edgesSvg += `<path d="${g.d}" fill="none" stroke="${hl ? accentHex : bdHex}" stroke-width="${hl ? 2 : 1.35}" opacity="${hl ? 0.95 : 0.6}" marker-end="${hl ? 'url(#dagA)' : 'url(#dagG)'}"/>`;
        }
        const p = pos[c.id], isSel = c.id === sel.id, isRel = related.has(c.id);
        nodesSvg += `<g class="dag-node-hit" data-dag-id="${c.id}" opacity="${isRel ? 1 : 0.48}">
          <rect x="${p.x - nw / 2}" y="${p.y - nh / 2}" width="${nw}" height="${nh}" rx="${isCompact ? 6 : 8}" fill="${isSel ? softBg : surfHex}" stroke="${isSel ? accentHex : bdHex}" stroke-width="${isSel ? 1.8 : 1.2}"/>

        </g>`;
      }

      panel.innerHTML = `
        <div class="dag-head drag-handle" id="dagDragHead" title="拖动标题栏移动 · 双击复位">
          <div style="min-width:0;">
            <div class="drawer-eyebrow"><span class="drag-grip">⋮⋮</span>CHANGE DEPENDENCY · ⌘K</div>

              <marker id="dagG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="${bdHex}"/></marker>

    // =========================================================================

    function renderMiniMachineSvg(machine, highlightMap, edgeColorMap) {
      const inkHex = cssVar('--ink', '#14171f'), surfHex = cssVar('--surface', '#ffffff'), bdHex = cssVar('--border-strong', '#c5ccd9');
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      machine.states.forEach(s => { minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x); minY = Math.min(minY, s.y); maxY = Math.max(maxY, s.y); });
      const sc = Math.min(400 / Math.max(320, maxX - minX + 200), 210 / Math.max(180, maxY - minY + 140));
      const mapP = (s) => ({ x: 40 + (s.x - minX + 80) * sc, y: 26 + (s.y - minY + 55) * sc });

      let edgesSvg = '', nodesSvg = '';
      machine.transitions.forEach(e => {
        const sa = machine.states.find(s => s.uid === e.fromUid), sb = machine.states.find(s => s.uid === e.toUid);
        if (!sa || !sb) return;
        const a = mapP(sa), b = mapP(sb);
        const col = edgeColorMap.get(e.uid) || bdHex;
        const g = computeEdgeGeom(a.x, a.y, b.x, b.y, store.edgePreset, 0, -14);
        edgesSvg += `<path d="${g.d}" fill="none" stroke="${col}" stroke-width="${col === bdHex ? 1.3 : 2.1}" marker-end="url(#sdArr)"/>`;
        edgesSvg += `<text x="${g.lx}" y="${g.ly - 3}" text-anchor="middle" font-size="8.5" fill="${col === bdHex ? '#64748b' : col}">${esc(e.event)}${e.guard ? ` [${esc(e.guard)}]` : ''}</text>`;
      });
      machine.states.forEach(s => {
        const p = mapP(s), hl = highlightMap.get(s.uid);
        const fill = hl === 'add' ? cssVar('--green-soft', '#eefaf4') : hl === 'del' ? cssVar('--red-soft', '#fdf0f0') : hl === 'mod' ? cssVar('--amber-soft', '#fcf6ec') : surfHex;
        const stroke = hl === 'add' ? '#0f7b55' : hl === 'del' ? '#c92a2a' : hl === 'mod' ? '#9a5b13' : bdHex;
        nodesSvg += `<g><rect x="${p.x - 52}" y="${p.y - 16}" width="104" height="32" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="${hl ? 1.8 : 1.1}" ${hl === 'del' ? 'stroke-dasharray="4 3"' : ''}/><text x="${p.x}" y="${p.y + 4}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${hl === 'del' ? '#c92a2a' : inkHex}">${esc(s.name.slice(0, 12))}</text></g>`;
      });
      return `<svg viewBox="0 0 470 250" style="width:100%;height:240px;display:block;"><defs><marker id="sdArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7c8799"/></marker></defs>${edgesSvg}${nodesSvg}</svg>`;
    }

    function renderMiniMacroSvg(nodes, edges, highlightMap, edgeColorMap) {
      const inkHex = cssVar('--ink', '#14171f'), surfHex = cssVar('--surface', '#ffffff'), bdHex = cssVar('--border-strong', '#c5ccd9');
      if (!nodes.length) return '<svg viewBox="0 0 470 250" style="width:100%;height:240px;"></svg>';
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      nodes.forEach(n => { minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y); });
      const sc = Math.min(350 / Math.max(360, maxX - minX + 260), 185 / Math.max(200, maxY - minY + 170));
      const mapP = (n) => ({ x: 64 + (n.x - minX + 90) * sc, y: 34 + (n.y - minY + 55) * sc });
      let edgesSvg = '', nodesSvg = '';
      edges.forEach(e => {
        const na = nodes.find(x => x.id === e.from), nb = nodes.find(x => x.id === e.to);
        if (!na || !nb) return;
        const a = mapP(na), b = mapP(nb);
        const col = edgeColorMap.get(e.id) || bdHex;
        const isHi = col !== bdHex;
        const g = computeEdgeGeom(a.x, a.y, b.x, b.y, store.edgePreset, 0, -12);
        edgesSvg += `<path d="${g.d}" fill="none" stroke="${col}" stroke-width="${isHi ? 2.4 : 1.3}" ${e.kind === 'manual' || col === '#c92a2a' ? 'stroke-dasharray="5 3"' : ''} marker-end="url(#sdArr)"/>`;
        if (isHi || e.label) {
          const eTag = col === '#c92a2a' ? `⛔ ${e.label || '阻塞'}` : col === '#0f7b55' ? `+ ${e.label || '新增'}` : (e.label || '');
          if (eTag) edgesSvg += `<text x="${g.lx}" y="${g.ly - 4}" text-anchor="middle" font-size="8.5" font-weight="${isHi ? 700 : 500}" fill="${isHi ? col : '#64748b'}">${esc(eTag)}</text>`;
        }
      });
      nodes.forEach(n => {
        const p = mapP(n), hl = highlightMap.get(n.id);
        const fill = hl === 'add' ? cssVar('--green-soft', '#eefaf4') : hl === 'del' ? cssVar('--red-soft', '#fdf0f0') : hl === 'mod' ? cssVar('--amber-soft', '#fcf6ec') : surfHex;
        const stroke = hl === 'add' ? '#0f7b55' : hl === 'del' ? '#c92a2a' : hl === 'mod' ? '#9a5b13' : bdHex;
        const label = hl === 'add' ? `+ ${n.title}` : hl === 'del' ? `⛔ ${n.title}` : n.title;
        const bw = Math.max(106, Math.min(168, label.length * 7.4 + 22));
        nodesSvg += `<g><rect x="${p.x - bw / 2}" y="${p.y - 16}" width="${bw}" height="32" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${hl ? 2.2 : 1.1}" ${hl === 'del' ? 'stroke-dasharray="4 3"' : ''}/><text x="${p.x}" y="${p.y + 3.5}" text-anchor="middle" font-size="9.5" font-weight="${hl ? 700 : 600}" fill="${hl === 'del' ? '#c92a2a' : hl === 'add' ? '#0f7b55' : inkHex}">${esc(label)}</text></g>`;
      });
      return `<svg viewBox="0 0 470 250" style="width:100%;height:240px;display:block;"><defs><marker id="sdArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7c8799"/></marker></defs>${edgesSvg}${nodesSvg}</svg>`;
    }

    function diffTwoMachines(leftM, rightM) {
      const lS = new Map(leftM.states.map(s => [s.uid, s])), rS = new Map(rightM.states.map(s => [s.uid, s]));
      const beforeS = new Map(), afterS = new Map(), beforeE = new Map(), afterE = new Map();
      let addS = 0, delS = 0, modS = 0, addE = 0, delE = 0, modE = 0;
      leftM.states.forEach(s => { if (!rS.has(s.uid)) { beforeS.set(s.uid, 'del'); delS++; } else if (rS.get(s.uid).name !== s.name) { beforeS.set(s.uid, 'mod'); afterS.set(s.uid, 'mod'); modS++; } });
      rightM.states.forEach(s => { if (!lS.has(s.uid)) { afterS.set(s.uid, 'add'); addS++; } });
      const lE = new Map(leftM.transitions.map(e => [e.uid, e])), rE = new Map(rightM.transitions.map(e => [e.uid, e]));
      leftM.transitions.forEach(e => { if (!rE.has(e.uid)) { beforeE.set(e.uid, '#c92a2a'); delE++; } else { const re = rE.get(e.uid); if (re.event !== e.event || (re.guard || '') !== (e.guard || '') || re.fromUid !== e.fromUid || re.toUid !== e.toUid) { beforeE.set(e.uid, '#9a5b13'); afterE.set(e.uid, '#9a5b13'); modE++; } } });
      rightM.transitions.forEach(e => { if (!lE.has(e.uid)) { afterE.set(e.uid, '#0f7b55'); addE++; } });
      return { beforeS, afterS, beforeE, afterE, addS, delS, modS, addE, delE, modE };
    }

    function renderOverlayGraphSvg(isMacro, leftObj, rightObj, beforeS, afterS, beforeE, afterE) {
      // Figma Branch Review style Overlay Diff: identical items fade cleanly to background; red/green diffs pop on ONE canvas!
      const nodes = isMacro
        ? [...rightObj.nodes, ...leftObj.nodes.filter(ln => !rightObj.nodes.some(rn => rn.id === ln.id))]
        : [...rightObj.states, ...leftObj.states.filter(ls => !rightObj.states.some(rs => rs.uid === ls.uid))];
      const edges = isMacro
        ? [...rightObj.edges, ...leftObj.edges.filter(le => !rightObj.edges.some(re => re.id === le.id))]
        : [...rightObj.transitions, ...leftObj.transitions.filter(le => !rightObj.transitions.some(re => re.uid === le.uid))];
      const mergedHighlight = new Map();
      beforeS.forEach((v, k) => mergedHighlight.set(k, v));
      afterS.forEach((v, k) => mergedHighlight.set(k, v));
      const mergedEdge = new Map();
      beforeE.forEach((v, k) => mergedEdge.set(k, v));
      afterE.forEach((v, k) => mergedEdge.set(k, v));
      return isMacro
        ? renderMiniMacroSvg(nodes, edges, mergedHighlight, mergedEdge)
        : renderMiniMachineSvg({ states: nodes, transitions: edges }, mergedHighlight, mergedEdge);
    }

          const lines = [];

          leftSnap.edges.filter(e => !rEIds.has(e.id)).forEach(e => lines.push(`- 拦截/删除连线: ${e.from} --[${e.label}]--> ${e.to}`));

          const lines = [];

          rightM.states.filter(s => !lS.has(s.uid)).forEach(s => lines.push(`+ 新增/替代节点: ${s.name}`));
          leftM.states.filter(s => !rS.has(s.uid)).forEach(s => lines.push(`- 删除节点: ${s.name}`));
          const lE = new Map(leftM.transitions.map(e => [e.uid, e])), rE = new Map(rightM.transitions.map(e => [e.uid, e]));
          rightM.transitions.filter(e => !lE.has(e.uid)).forEach(e => lines.push(`+ 新增/替代边: ${rS.get(e.fromUid)?.name || e.fromUid} --[${e.event}${e.guard ? ` | ${e.guard}` : ''}]--> ${rS.get(e.toUid)?.name || e.toUid}`));
          leftM.transitions.filter(e => !rE.has(e.uid)).forEach(e => lines.push(`- 拦截/删除边: ${lS.get(e.fromUid)?.name || e.fromUid} --[${e.event}${e.guard ? ` | ${e.guard}` : ''}]--> ${lS.get(e.toUid)?.name || e.toUid}`));
          diffText = lines.length ? lines.join('\n') : '# 期望目标与实际结果完全一致（0 差异）';
        }

        const alignItems = rep?.items || [];
        const okItems = alignItems.filter(x => x.status === 'verified');
        const blkItems = alignItems.filter(x => x.status === 'blocked');
        const cpItems = alignItems.filter(x => x.status === 'counter_proposal');
        const statusSummaryHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 14px 4px;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              ${rep
                ? (blkItems.length === 0
                  ? `<span class="badge-chip badge-green">✅ 目标已对齐 · ${esc(rep.bddPass)} · ${esc(rep.tracePct)}</span>`
                  : `<span class="badge-chip badge-red">🔴 ${blkItems.length} 处做不到 / 冲突</span><span class="badge-chip badge-amber">🟡 ${cpItems.length} 处 Agent 替代建议</span><span class="badge-chip badge-muted">${esc(rep.bddPass)}</span>`)
                : `<span class="badge-chip ${lint.errors.length ? 'badge-red' : 'badge-green'}">${lint.errors.length ? `🔴 图校验有 ${lint.errors.length} 处错误` : '✅ 图校验全绿 · 可直接生成调整 Prompt'}</span>`
              }

            <div style="display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-muted);">

              <span style="color:var(--red);font-weight:600;">■ 红色虚线 = 删除 / 阻塞</span>
              <span style="color:var(--amber);font-weight:600;">■ 琥珀 = 调整</span>

        const alignCardsHtml = alignItems.length ? `

                <div>
                  <strong>${it.status === 'verified' ? '✅ 已对齐' : it.status === 'blocked' ? '🔴 做不到（需协商）' : '🟡 Agent 替代建议'}：</strong>${esc(it.title)}
                  <div style="color:var(--text-secondary);margin-top:2px;white-space:pre-wrap;">${esc(it.evidence)}</div>
                </div>
                ${it.status === 'counter_proposal' && store.view === 'drill-machine' ? '<button class="dock-cta primary" data-sd-accept="1" style="height:24px;font-size:11px;padding:0 9px;flex:none;">采用建议</button>' : ''}
              </div>

        const canvasBodyHtml = layout === 'overlay'

                 <div class="diff-pane-svg" style="overflow:auto;"><div style="transform:scale(${zoom});transform-origin:center center;transition:transform 0.12s;width:100%;">${rightSvg}</div></div>

        const html = `

                <div class="drawer-eyebrow">TARGET ALIGNMENT · 前后对比与目标对齐</div>

              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                ${hasDelivered ? `

                  </div>` : ''}
                <div class="cl-seg">
                  <button class="cl-seg-btn ${layout === 'split' ? 'active' : ''}" data-dl="split">并排对照</button>
                  <button class="cl-seg-btn ${layout === 'overlay' ? 'active' : ''}" data-dl="overlay">同图叠加</button>
                </div>
                <div class="cl-seg">
                  <button class="cl-seg-btn" id="sdZOut">−</button>
                  <button class="cl-seg-btn" id="sdZReset" style="font-family:var(--mono);">${Math.round(zoom * 100)}%</button>
                  <button class="cl-seg-btn" id="sdZIn">+</button>
                </div>
                ${badgeHtml}
                <button class="ibtn" id="sdFull">${store.diffFullscreen ? ICONS.collapse(12) : ICONS.expand(12)}<span>${store.diffFullscreen ? '退出全屏' : '全屏查看'}</span></button>

        el.querySelector('#sdZOut').onclick = () => { store.diffZoom = Math.max(0.6, +(zoom - 0.2).toFixed(2)); renderSplitDiffModal(); };
        el.querySelector('#sdZIn').onclick = () => { store.diffZoom = Math.min(2.0, +(zoom + 0.2).toFixed(2)); renderSplitDiffModal(); };

        el.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => { store.diffViewLayout = b.dataset.dl; renderSplitDiffModal(); });
        const accBtn = el.querySelector('[data-sd-accept]');
        if (accBtn) accBtn.onclick = () => {
          const rev = store.revisions.find(r => r.status === 'pending' && r.machineId === scopeId);
          if (rev && store.drafts[scopeId]) {
            const draft = store.drafts[scopeId];
            if (rev.addState && !draft.states.some(s => s.uid === rev.addState.uid)) draft.states.push(clone(rev.addState));
            rev.addEdges.forEach(ae => draft.transitions.push(clone(ae)));
            rev.status = 'accepted';

          store.splitDiffOpen = false;
          toast('已采用 Agent 替代建议并写入当前修改');
          render();

      } catch (err) {
        store.splitDiffOpen = false;
        el.classList.add('hidden'); el.innerHTML = '';
        toast('对比视图渲染异常，已自动关闭');
        console.error(err);
      }
    }

    // =========================================================================

    function openWorldlinePage(scopeId = currentTimelineScope()) {
      closeAllTransient(false);
      const tl = ensureTimeline(scopeId);
      const alreadyOpen = store.worldline.open && store.worldline.scopeId === scopeId;
      if (alreadyOpen) {
        store.worldline.open = false;
        store.worldline.comparing = false;
        render();
        return;
      }
      store.worldline = {
        open: true,
        scopeId,
        nodeA: tl.entries.length > 1 ? 'BASE' : null,
        nodeB: tl.entries[tl.headIdx]?.id || 'BASE',
        comparing: tl.entries.length > 1,
      };
      store.timelineOpen = false;
      store.splitDiffOpen = false;
      render();
    }

    function getTimelineSnapshotObj(scopeId, entry) {
      if (!entry) return null;
      return scopeId === '__macro__' ? entry.snapshot : (entry.snapshot?.draft || entry.snapshot);
    }

    function getWorldlineLiveDiff(scopeId) {
      if (!store.worldline.open || !store.worldline.comparing || store.worldline.scopeId !== scopeId || !store.worldline.nodeA) return null;
      const tl = store.timelines[scopeId];
      if (!tl) return null;
      const entryA = tl.entries.find(e => e.id === store.worldline.nodeA);
      const entryB = tl.entries[tl.headIdx];
      if (!entryA || !entryB || entryA.id === entryB.id) return null;
      const objA = getTimelineSnapshotObj(scopeId, entryA);
      const objB = getTimelineSnapshotObj(scopeId, entryB);
      if (!objA || !objB) return null;

      const addedIds = new Set(), changedIds = new Set(), removedItems = [];
      const addedEdgeIds = new Set(), removedEdges = [];
      if (scopeId === '__macro__') {
        const aIds = new Set(objA.nodes.map(n => n.id));
        const bIds = new Set(objB.nodes.map(n => n.id));
        objB.nodes.forEach(n => { if (!aIds.has(n.id)) addedIds.add(n.id); });
        objA.nodes.forEach(n => { if (!bIds.has(n.id)) removedItems.push({ ...clone(n), _wlRemoved: true }); });
        const aEdgeKeys = new Set((objA.edges || []).map(e => `${e.from}->${e.to}:${e.label}`));
        const bEdgeKeys = new Set((objB.edges || []).map(e => `${e.from}->${e.to}:${e.label}`));
        (objB.edges || []).forEach(e => { if (!aEdgeKeys.has(`${e.from}->${e.to}:${e.label}`)) addedEdgeIds.add(e.id); });
        (objA.edges || []).forEach(e => { if (!bEdgeKeys.has(`${e.from}->${e.to}:${e.label}`)) removedEdges.push({ ...clone(e), _wlRemoved: true }); });
      } else {
        const aMap = new Map(objA.states.map(s => [s.uid, s]));
        const bMap = new Map(objB.states.map(s => [s.uid, s]));
        objB.states.forEach(s => {
          if (!aMap.has(s.uid)) addedIds.add(s.uid);
          else if (aMap.get(s.uid).name !== s.name) changedIds.add(s.uid);
        });
        objA.states.forEach(s => { if (!bMap.has(s.uid)) removedItems.push({ ...clone(s), _wlRemoved: true }); });
        const aEdgeKeys = new Set((objA.transitions || []).map(e => `${e.fromUid}->${e.toUid}:${e.event}`));
        const bEdgeKeys = new Set((objB.transitions || []).map(e => `${e.fromUid}->${e.toUid}:${e.event}`));
        (objB.transitions || []).forEach(e => { if (!aEdgeKeys.has(`${e.fromUid}->${e.toUid}:${e.event}`)) addedEdgeIds.add(e.uid); });
        (objA.transitions || []).forEach(e => { if (!bEdgeKeys.has(`${e.fromUid}->${e.toUid}:${e.event}`)) removedEdges.push({ ...clone(e), _wlRemoved: true }); });
      }
      return { entryA, entryB, addedIds, changedIds, removedItems, addedEdgeIds, removedEdges };
    }

    // [DEMO-ONLY] Create a sibling human branch from parent so user can immediately test A <-> B comparison on the live canvas!
    function simulateWorldlineFork(scopeId) {
      const tl = ensureTimeline(scopeId);
      const rootEntry = tl.entries.length > 2 ? tl.entries[1] : tl.entries[0];
      const baseObj = clone(getTimelineSnapshotObj(scopeId, rootEntry));
      const seq = tl.entries.length;
      if (scopeId === '__macro__') {
        const altId = `alt-domain-${seq}`;
        const anchor = baseObj.nodes[0];
        const minX = baseObj.nodes.reduce((m, n) => Math.min(m, n.x || 170), Infinity);
        const placeX = (Number.isFinite(minX) ? minX : 170) - 315;
        const placeY = (anchor?.y || 135) + ((seq - 1) % 3) * 235;
        baseObj.nodes.push({ id: altId, title: altId, sub: `specs/${altId}.feature`, x: placeX, y: placeY, kind: 'machine', machineId: 'studio-web', docKey: 'studio-web', verifyLevel: 'L1', tags: ['#alt-branch'], blame: '你 (方案B)', rules: 3 });
        if (anchor) baseObj.edges.push({ id: `alt_e_${seq}`, from: anchor.id, to: altId, label: '方案 B 拆分域', kind: 'spec-ref' });
        tl.entries.push({ seq, id: `#${seq}`, parentId: rootEntry.id, actor: 'human', ts: nowTimeStr(), isBase: false, label: `方案 B：拆分「${altId}」`, delta: '+1规格 +1连线', snapshot: baseObj });
      } else {
        const s0 = baseObj.states[0];
        const s1 = baseObj.states[1] || s0;
        const nUid = `alt_s_${seq}`;
        baseObj.states.push({ uid: nUid, name: `方案B·人工审批`, x: (s1?.x || 460) + 40, y: (s1?.y || 240) - 135, desc: '从历史节点分叉出的平行方案' });
        baseObj.transitions.push({ uid: `alt_t_${seq}`, fromUid: s0?.uid, toUid: nUid, event: '走方案B', guard: '' });
        if (s1 && s1.uid !== s0?.uid) baseObj.transitions.push({ uid: `alt_t2_${seq}`, fromUid: nUid, toUid: s1.uid, event: '汇合', guard: '' });
        tl.entries.push({ seq, id: `#${seq}`, parentId: rootEntry.id, actor: 'human', ts: nowTimeStr(), isBase: false, label: `方案 B：新增「人工审批」分叉`, delta: '+1态 +2边', snapshot: { draft: baseObj, modeFlag: 'modify' } });
      }
      const prevHeadId = tl.entries[tl.headIdx]?.id || 'BASE';
      rollbackTimelineTo(scopeId, tl.entries.length - 1);
      store.worldline.nodeA = prevHeadId;
      store.worldline.comparing = true;
      toast(`已切至新分叉 #${seq}，并在左侧真实画布叠加对比 ${prevHeadId} ↔ #${seq}`);
      render();
    }

              <span style="display:inline-flex;align-items:center;gap:4px;">
