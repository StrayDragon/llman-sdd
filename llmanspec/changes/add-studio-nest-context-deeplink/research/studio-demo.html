              </span>
            </div>
            <div style="font-size:12px;font-weight:600;color:var(--ink);">${esc(e.label)}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:5px;">
              <span style="font-size:10px;color:var(--text-muted);">${esc(e.ts)} · ${esc(e.delta)}</span>
              <span style="display:inline-flex;gap:4px;">
                ${!isHead ? `<button class="mini-act" data-wl-cmp="${esc(e.id)}" style="height:20px;font-size:10px;padding:0 6px;">${isCmpA ? '取消对比' : '与当前对比'}</button>` : ''}
                ${!isHead ? `<button class="mini-act" data-wl-go="${idx}" style="height:20px;font-size:10px;padding:0 6px;color:var(--accent);border-color:var(--accent-border);">切到此节点</button>` : ''}
              </span>
            </div>
          </div>`;
      }).join('');

      page.classList.remove('hidden');
      page.innerHTML = `
        <div class="wl-head">
          <div style="min-width:0;">
            <div style="font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:5px;">${ICONS.history(13)}<span>世界线 · ${esc(isMacro ? `${ws.repo} 主视图` : scopeId)}</span></div>
            <div style="font-size:10.5px;color:var(--text-muted);margin-top:2px;">点节点切左侧 1:1 真实画布；点「与当前对比」直接在画布上红绿高亮</div>
          </div>
          <button class="ibtn icon-only" id="wlCloseBtn" style="height:24px;width:24px;flex:none;">${ICONS.close(12)}</button>
        </div>
        <div class="tl-wt-strip">
          <span style="display:inline-flex;align-items:center;gap:5px;">${ICONS.branch(12)}<strong style="font-family:var(--mono);color:var(--ink);">${esc(ws.branch)}</strong></span>
          ${peerWts.length ? `<span style="display:inline-flex;gap:4px;">${peerWts.map(pw => `<button class="mini-act" data-wl-wt="${esc(pw.key)}" style="height:19px;font-size:10px;">切 ${esc(pw.branch)}</button>`).join('')}</span>` : '<span style="opacity:0.7;">单工作树</span>'}
        </div>
        <div class="wl-list">
          ${rep?.items?.length ? rep.items.map(it => `<div class="card ${it.status === 'verified' ? 'card-green' : it.status === 'blocked' ? 'card-err' : 'card-amber'}" style="padding:7px 9px;margin:0;font-size:11px;"><strong>${it.status === 'verified' ? '已对齐' : it.status === 'blocked' ? '冲突阻塞' : 'Agent 建议'}：</strong>${esc(it.title)}</div>`).join('') : ''}
          ${rowsHtml}
        </div>
        <div class="wl-foot">
          <button class="dock-cta primary" id="wlGenPrompt" style="justify-content:center;width:100%;">${ICONS.commit(12)}<span>生成调整 Prompt</span></button>
          ${rep && rep.matchPct === 100 ? '<button class="ibtn accent" id="wlPromote" style="justify-content:center;width:100%;">确认生效（更新原规格）</button>' : ''}
          <!-- [DEMO-ONLY] Simulation box; production C3/C5/C6 never ships this -->
          <div class="demo-sim-box">
            <div class="demo-sim-tag">[DEMO-SIM] 原型演示控制</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;">
              <button class="mini-act" id="wlSimFork" style="justify-content:center;background:var(--surface);">新分叉</button>
              <button class="mini-act" id="wlSimOk" style="justify-content:center;background:var(--surface);color:var(--green);border-color:var(--green);">对齐</button>
              <button class="mini-act" id="wlSimBlk" style="justify-content:center;background:var(--surface);color:var(--red);border-color:var(--red);">冲突</button>
            </div>

      `;

      page.querySelector('#wlCloseBtn').onclick = () => { store.worldline.open = false; store.worldline.comparing = false; render(); };
      page.querySelectorAll('[data-wl-wt]').forEach(b => b.onclick = () => { store.worldline.open = false; switchWorkspace(b.dataset.wlWt, false); });
      page.querySelectorAll('[data-wl-go]').forEach(b => b.onclick = (ev) => { ev.stopPropagation(); rollbackTimelineTo(scopeId, Number(b.dataset.wlGo)); });
      page.querySelectorAll('[data-wl-cmp]').forEach(b => b.onclick = (ev) => {
        ev.stopPropagation();
        const id = b.dataset.wlCmp;
        if (store.worldline.comparing && store.worldline.nodeA === id) {
          store.worldline.comparing = false;
        } else {
          store.worldline.nodeA = id;
          store.worldline.comparing = true;
        }
        render();
      });
      page.querySelectorAll('.wl-tree-row').forEach(r => {
        r.onclick = () => {
          const idx = Number(r.dataset.wlIdx);
          if (idx !== tl.headIdx) rollbackTimelineTo(scopeId, idx);
        };
      });
      page.querySelector('#wlGenPrompt').onclick = () => openAggregatedPromptFromTimeline(scopeId);
      const proBtn = page.querySelector('#wlPromote');
      if (proBtn) proBtn.onclick = () => { store.worldline.open = false; store.worldline.comparing = false; promoteDeliveredToBase(scopeId); };
      page.querySelector('#wlSimFork').onclick = () => simulateWorldlineFork(scopeId);
      page.querySelector('#wlSimOk').onclick = () => {
        simulateAgentReport(scopeId, 'verified');
        store.worldline.nodeA = store.intentSnapshots[scopeId]?.id || 'BASE';
        store.worldline.comparing = true;
        render();
      };
      page.querySelector('#wlSimBlk').onclick = () => {
        simulateAgentReport(scopeId, 'blocked_and_counter');
        store.worldline.nodeA = store.intentSnapshots[scopeId]?.id || 'BASE';
        store.worldline.comparing = true;
        render();
      };
    }

    // =========================================================================
    // 10. Interactive Hover-Enlarging Minimap
    // =========================================================================
    let minimapBounds = { minX: 0, minY: 0, scale: 0.1 };
    function renderMinimap() {
      const m = document.getElementById('minimapIsland');
      const show = store.showMinimap && !store.dagExpanded && store.view !== 'drill-doc' && store.view !== 'start';
      m.style.display = show ? 'block' : 'none';
      if (!show) return;

      const pts = store.view === 'macro' ? getVisibleMacroGraph().nodes : curDraft().states;
      if (!pts.length) return;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      pts.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); });
      minX -= 220; maxX += 220; minY -= 180; maxY += 180;
      const sc = Math.min(150 / Math.max(400, maxX - minX), 74 / Math.max(300, maxY - minY));
      minimapBounds = { minX, minY, scale: sc };

      m.innerHTML = `<div class="minimap-label">MAP · ${pts.length}</div><div class="minimap-viewport" id="minimapVp"></div><div class="minimap-hint">拖拽导航</div>`;
      pts.forEach(p => {
        const d = document.createElement('div');
        const col = store.view === 'macro'
          ? (p.kind === 'machine' ? cssVar('--t-machine', '#0d7a6c') : p.kind === 'decision' ? cssVar('--t-decision', '#2f54eb') : cssVar('--t-doc', '#9a5b13'))
          : (store.mode === 'simulate' && store.sim.currentUid === p.uid ? cssVar('--accent', '#2f54eb') : p.initial ? cssVar('--ink', '#14171f') : '#94a3b8');
        d.style.cssText = `position:absolute;width:10px;height:5px;border-radius:2px;background:${col};left:${10 + (p.x - minX) * sc - 5}px;top:${22 + (p.y - minY) * sc - 2.5}px;pointer-events:none;`;
        m.appendChild(d);
      });
      updateMinimapViewport();
    }

    function updateMinimapViewport() {
      const vp = document.getElementById('minimapVp'); if (!vp) return;
      const { minX, minY, scale } = minimapBounds;
      const wLeft = -store.cam.x / store.cam.zoom, wTop = -store.cam.y / store.cam.zoom;
      const wW = window.innerWidth / store.cam.zoom, wH = window.innerHeight / store.cam.zoom;
      const left = Math.max(5, Math.min(154, 10 + (wLeft - minX) * scale));
      const top = Math.max(18, Math.min(94, 22 + (wTop - minY) * scale));
      vp.style.left = `${left}px`; vp.style.top = `${top}px`;
      vp.style.width = `${Math.max(14, Math.min(162 - left, wW * scale))}px`;
      vp.style.height = `${Math.max(10, Math.min(100 - top, wH * scale))}px`;
    }

    const mmEl = document.getElementById('minimapIsland');
    function panFromMinimapEvent(ev) {
      const r = mmEl.getBoundingClientRect();
      const lx = ((ev.clientX - r.left) / r.width) * 170;
      const ly = ((ev.clientY - r.top) / r.height) * 106;
      const wx = minimapBounds.minX + (lx - 10) / minimapBounds.scale;
      const wy = minimapBounds.minY + (ly - 22) / minimapBounds.scale;
      store.smoothCam = false;
      store.cam.x = window.innerWidth / 2 - wx * store.cam.zoom;
      store.cam.y = window.innerHeight / 2 - wy * store.cam.zoom;
      applyCameraTransform();
    }
    mmEl.addEventListener('mousedown', (ev) => {
      if (ev.button !== 0) return;
      ev.stopPropagation(); closeAllTransient(true);
      mmEl.classList.add('dragging'); panFromMinimapEvent(ev);
      startDragSession((m) => panFromMinimapEvent(m), () => mmEl.classList.remove('dragging'));
    });

    // =========================================================================
    // Canonical Deep-Link Sharing & Transparent Agent HTTP Content Negotiation
    // =========================================================================
    function buildShareHash(kind, id, scopeId) {
      const params = new URLSearchParams();
      params.set('ws', store.activeWsKey);
      if (kind === 'state' || kind === 'edge') {
        params.set('tab', `m:${scopeId}`);
        if (store.nestStack.length > 1) params.set('nest', store.nestStack.map(x => x.machineId).join(','));
      } else if (kind === 'doc') {
        params.set('tab', `doc:${id}`);
      } else {
        params.set('tab', 'default');
      }
      params.set('focus', `${kind}:${id}`);
      return `#${params.toString()}`;
    }

    function buildAgentSharePayload(kind, id, scopeId) {
      const ws = curWs();
      const hash = buildShareHash(kind, id, scopeId);
      const canonicalUrl = `http://127.0.0.1:4710/p/${encodeURIComponent(ws.key)}${hash}`;
      const openComments = store.comments.filter(c => c.machineId === scopeId && c.anchorKind === kind && c.anchorId === id && c.status !== 'resolved');
      const anchorLabel = describeCommentAnchor({ machineId: scopeId, anchorKind: kind, anchorId: id });
      const data = {
        schema: 'llman-sdd.studio.focus/v1',
        workspace: { key: ws.key, repo: ws.repo, branch: ws.branch, instanceRel: ws.instanceRel },
        anchor: { kind, id, scopeId, label: anchorLabel },
        canonicalUrl,
        comments: openComments.map(c => ({ id: c.id, author: c.author, body: c.body })),
      };

      const md = [
        `> [Studio Context] format=md (default for non-browser HTTP GET) · override via \`?format=json\` | \`?format=html\` | \`Accept: text/html\``,
        '',
        `# Studio 焦点状态：${anchorLabel}`,
        `- 工作区: \`${ws.repo}\` (\`${ws.branch}\`, instance: \`${ws.instanceRel}\`)`,
        `- 规范链接: ${canonicalUrl}`,
      ];

      if (kind === 'state') {
        const base = store.baselines[scopeId];
        const m = activeMachineDraft(scopeId);
        const st = m?.states.find(x => x.uid === id);
        const incoming = (m?.transitions || []).filter(e => e.toUid === id);
        const outgoing = (m?.transitions || []).filter(e => e.fromUid === id);
        const lint = runLinter().findings.filter(f => f.targetId === id);
        data.machine = { key: base?.key, file: base?.file, graphKind: base?.graphKind || 'machine', nestPath: store.nestStack.map(x => x.machineId) };
        data.state = st ? { uid: st.uid, name: st.name, initial: !!st.initial, isGateway: !!st.isGateway, subMachineId: st.subMachineId || null, desc: st.desc || '' } : null;
        data.incoming = incoming.map(e => ({ uid: e.uid, from: stateName(e.fromUid), event: e.event, guard: e.guard || '' }));
        data.outgoing = outgoing.map(e => ({ uid: e.uid, to: stateName(e.toUid), event: e.event, guard: e.guard || '' }));
        data.diagnostics = lint.map(f => ({ code: f.code, severity: f.severity, message: f.msg }));
        md.push(`- 规格文件: \`${base?.file || ''}\` (${base?.key || scopeId})`);
        if (st?.desc) md.push(`- 语义说明: ${st.desc}`);
        if (st?.subMachineId) md.push(`- 嵌套子图: \`${st.subMachineId}\``);
        md.push('', '## 入边（Incoming）');
        if (!incoming.length) md.push('- (无，初始入口)');
        else incoming.forEach(e => md.push(`- \`${stateName(e.fromUid)}\` --[${e.event}${e.guard ? ` | guard: ${e.guard}` : ''}]--> **${st?.name || id}** (\`${e.uid}\`)`));
        md.push('', '## 出边（Outgoing）');
        if (!outgoing.length) md.push('- (无，终态)');
        else outgoing.forEach(e => md.push(`- **${st?.name || id}** --[${e.event}${e.guard ? ` | guard: ${e.guard}` : ''}]--> \`${stateName(e.toUid)}\` (\`${e.uid}\`)`));
        if (lint.length) {
          md.push('', '## Linter 诊断');
          lint.forEach(f => md.push(`- [${f.code}] ${f.msg}`));
        }
      } else if (kind === 'edge') {
        const base = store.baselines[scopeId];
        const m = activeMachineDraft(scopeId);
        const e = m?.transitions.find(x => x.uid === id);
        data.machine = { key: base?.key, file: base?.file };
        data.edge = e ? { uid: e.uid, from: stateName(e.fromUid), to: stateName(e.toUid), event: e.event, guard: e.guard || '' } : null;
        md.push(`- 规格文件: \`${base?.file || ''}\``);
        if (e) md.push(`- 转移定义: \`${stateName(e.fromUid)}\` --[${e.event}${e.guard ? ` | guard: ${e.guard}` : ''}]--> \`${stateName(e.toUid)}\` (\`${e.uid}\`)`);
      } else if (kind === 'forest') {
        const n = store.forestNodes.find(x => x.id === id);
        const relEdges = store.forestEdges.filter(e => e.from === id || e.to === id);
        data.spec = n ? { id: n.id, title: n.title, kind: n.kind, sub: n.sub, tags: n.tags } : null;
        data.relations = relEdges.map(e => ({ id: e.id, from: e.from, to: e.to, label: e.label, kind: e.kind }));
        if (n) md.push(`- 规格路径: \`llmanspec/${n.sub}\` (${KIND_META[n.kind]?.label || n.kind})`, `- 标签: ${n.tags.join(' ')}`);
        md.push('', '## 关联契约边');
        if (!relEdges.length) md.push('- (孤立规格，无上下游连线)');
        else relEdges.forEach(e => md.push(`- \`${e.from}\` --[${e.label}]--> \`${e.to}\` (${e.kind === 'spec-ref' ? '自动实线' : '人工虚线'})`));
      } else if (kind === 'macro-edge') {
        const e = store.forestEdges.find(x => x.id === id);
        data.relation = e || null;
        if (e) md.push(`- 全景连线: \`${e.from}\` --[${e.label}]--> \`${e.to}\` (${e.kind === 'spec-ref' ? '自动规格引用' : '人工参考虚线'})`);
      } else if (kind === 'doc') {
        const doc = TF_DOCS[id] || TF_DOCS['validation'];
        data.doc = { id, summary: doc?.levels?.[1] || '' };
        md.push(`- 规格文档: \`llmanspec/specs/${id}.feature\``, '', '## 关键摘要', doc?.levels?.[1] || '');
      }

      md.push('', '## 未解决评论');
      if (!openComments.length) md.push('- (无)');
      else openComments.forEach(c => md.push(`- [${c.author}] ${c.body}`));

      md.push('', '## 下一步 CLI 协作指令（零 MCP 门槛）', '```bash', `llman-sdd studio comment reply <stateId> --anchor "${kind}:${id}" --body "..."`, `llman-sdd studio revise <stateId> --ops-file ops.json`, '```');

      return { canonicalUrl, hash, markdown: md.join('\n'), json: JSON.stringify(data, null, 2), data };
    }

      closeAllTransient(true);

      const tab = p.get('tab') || '';

      if (tab.startsWith('m:')) {

          openInNewTab('machine', rootId, rootId);

    // Resilient double-click detector that survives full canvas re-renders between click #1 and click #2!
    let _lastClickState = { key: null, ts: 0 };

      if (_lastClickState.key === key && (now - _lastClickState.ts) < 380) {

        const mBox = document.getElementById('marqueeBox');
        const sx = ev.clientX, sy = ev.clientY;

        let moved = false;

          if (Array.isArray(wsSaved.tabGroups)) store.tabGroups = wsSaved.tabGroups;
        } else if (Array.isArray(saved.tabs) && !ws.nodes) TABS = saved.tabs;
        TABS.forEach(t => { if (t.id === 'default' && t.title === '全景') t.title = '主视图'; });
        if (applyDeepLinkFromHash()) return;
        const targetTabId = wsSaved?.activeTabId ?? saved.activeTabId;
        if (targetTabId && TABS.some(t => t.id === targetTabId)) {
          activateTab(targetTabId);
          return;
        }
        if (TABS.length === 0) {
          store.activeTabId = null; store.view = 'start'; render();
          return;
        }
      }
      if (applyDeepLinkFromHash()) return;
      recordNavState();
      fitMacro(false);
      render();
    })();
    window.addEventListener('hashchange', () => applyDeepLinkFromHash());
  </script>
</body>
</html>
