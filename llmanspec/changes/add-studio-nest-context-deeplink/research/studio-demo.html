            : e.isIntent
              ? '<span class="badge-chip badge-accent" style="font-size:9.5px;padding:1px 5px;">已发指令</span>'
              : e.isReport
                ? '<span class="badge-chip badge-amber" style="font-size:9.5px;padding:1px 5px;">交付分叉</span>'
                : e.isBase
                  ? '<span class="badge-chip badge-ink" style="font-size:9.5px;padding:1px 5px;">原规格</span>'
                  : '';
        row.innerHTML = `
          <span class="tl-dot"></span>
          <div class="tl-item-top">
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;">${actorBadge}<span>${esc(e.label)}</span></span>
            ${tagHtml}
          </div>
          <div class="tl-item-meta">
            <span>${esc(e.id)}${e.parentId ? ` ← ${esc(e.parentId)}` : ''} · ${esc(e.ts)}</span>
            <span>${esc(e.delta)}</span>
          </div>
          <div class="tl-item-acts">
            <button class="mini-act" data-prev="${i}">${isPrev ? '回到当前' : '观测快照'}</button>
            ${!isHead ? `<button class="mini-act" data-rb="${i}">切到此分叉</button>` : ''}
          </div>
        `;
        row.onclick = () => previewTimelineCommit(scopeId, i);
        row.querySelector('[data-prev]').onclick = (ev) => { ev.stopPropagation(); isPrev ? exitTimelinePreview(scopeId) : previewTimelineCommit(scopeId, i); };
        const rbBtn = row.querySelector('[data-rb]');
        if (rbBtn) rbBtn.onclick = (ev) => { ev.stopPropagation(); rollbackTimelineTo(scopeId, i); };
        listEl.appendChild(row);
      }

      panel.querySelectorAll('[data-tl-wt]').forEach(b => { b.onclick = () => switchWorkspace(b.dataset.tlWt, false); });
      panel.querySelector('#tlCloseBtn').onclick = () => { store.timelineOpen = false; renderTimelinePanel(); renderTopRightDock(); };
      panel.querySelector('#tlPromptBtn').onclick = () => openAggregatedPromptFromTimeline(scopeId);
      panel.querySelector('#tlVisualDiffBtn').onclick = () => {
        store.diffCompareMode = store.executionReports[scopeId] ? 'intent-vs-delivered' : 'base-vs-head';
        store.splitDiffOpen = true;
        renderSplitDiffModal();
      };
      panel.querySelector('#tlResetBaseBtn').onclick = () => rollbackTimelineTo(scopeId, 0);
      panel.querySelector('#tlSimOk').onclick = () => simulateAgentReport(scopeId, 'verified');
      panel.querySelector('#tlSimBlk').onclick = () => simulateAgentReport(scopeId, 'blocked_and_counter');
      bindWindowDrag(panel, panel.querySelector('#tlDragHead'), 'timeline');
    }

    // =========================================================================
    // 3.6 Centralized Bulletproof Drag Session Controller (Zero Stuck Drags!)
    // =========================================================================
    let activeDragCleanup = null;
    function cancelActiveDrag() {
      if (activeDragCleanup) {
        const fn = activeDragCleanup;
        activeDragCleanup = null;
        fn(true);
      }
    }
    function startDragSession(onMove, onEnd) {
      cancelActiveDrag();
      let finished = false;
      const finish = (cancelled = false) => {
        if (finished) return;
        finished = true;
        window.removeEventListener('mousemove', handleMove);
        window.removeEventListener('mouseup', handleUp);
        if (activeDragCleanup === finish) activeDragCleanup = null;
        if (onEnd) onEnd(cancelled);
      };
      const handleMove = (m) => {
        // Self-heal immediately if left button was released outside window or swallowed by WM!
        if ((m.buttons & 1) === 0) { finish(false); return; }
        onMove(m);
      };
      const handleUp = () => finish(false);
      activeDragCleanup = finish;
      window.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleUp);
      return finish;
    }

    // Mutual-Exclusion Popover Controller (guarantees only ONE transient menu at a time!)
    function togglePopover(kind, triggerElOrRect) {
      store.radial = null;
      if (store.activePopover === kind) {
        store.activePopover = null;
        store.popoverAnchorRect = null;
      } else {
        store.activePopover = kind;
        store.popoverAnchorRect = triggerElOrRect
          ? (typeof triggerElOrRect.getBoundingClientRect === 'function' ? triggerElOrRect.getBoundingClientRect() : triggerElOrRect)
          : null;
      }
      renderPopovers();
      renderTopRightDock();
      renderBottomLeft();
      if (store.dagOpen) renderDagPanel();
      renderRadialMenu();
    }

    function closeAllTransient(reRenderDocks = true) {
      const had = store.activePopover || store.radial || store.pendingDropWire;
      store.activePopover = null;
      store.popoverAnchorRect = null;
      store.radial = null;
      const hadWire = !!store.pendingDropWire;
      store.pendingDropWire = null;
      if (!had) return;
      renderPopovers();
      renderRadialMenu();
      if (hadWire) { if (store.view === 'macro') renderMacro(); else if (store.view === 'drill-machine') renderDrillMachine(); }
      if (reRenderDocks) {
        renderTopRightDock();
        renderBottomLeft();
        if (store.dagOpen) renderDagPanel();
      }
    }

    // Bring any clicked/dragged floating window to top of L3 (40..49)
    function focusWindow(el) {
      if (!el || el.classList.contains('expanded')) return;
      if (store.topWinZ >= 49) {
        document.querySelectorAll('.float-win').forEach(w => { w.style.zIndex = '40'; });
        store.topWinZ = 40;
      }
      store.topWinZ += 1;
      el.style.zIndex = String(store.topWinZ);
    }

    function positionPopoverNearAnchor(popEl, rect, prefer = 'below-right') {
      if (!popEl) return;
      const pw = popEl.offsetWidth || parseInt(popEl.style.width, 10) || 276;
      const ph = popEl.offsetHeight || 220;
      const vw = window.innerWidth, vh = window.innerHeight;
      let left = vw - pw - 12, top = 54;
      if (rect) {
        if (prefer === 'above-left') {
          left = rect.left;
          top = rect.top - ph - 8;
          if (top < 54) top = rect.bottom + 8;
        } else {
          left = rect.right - pw;
          top = rect.bottom + 8;
          if (top + ph > vh - 12) top = rect.top - ph - 8;
        }
      }
      left = Math.max(10, Math.min(vw - pw - 10, left));
      top = Math.max(50, Math.min(vh - ph - 10, top));
      popEl.style.left = `${Math.round(left)}px`;
      popEl.style.top = `${Math.round(top)}px`;
    }

    // =========================================================================
    // 4. Camera, Window Dragging & Edge Geometry
    // =========================================================================
    function syncTierFromZoom() {
      if (!store.autoLod) return false;
      const z = store.cam.zoom, prev = store.tier;
      let next = prev;
      if (prev === 'work') { if (z <= 0.86) next = z <= 0.40 ? 'glyph' : 'map'; }
      else if (prev === 'map') { if (z >= 0.94) next = 'work'; else if (z <= 0.40) next = 'glyph'; }
      else { if (z >= 0.94) next = 'work'; else if (z >= 0.47) next = 'map'; }
      if (next !== prev) { store.tier = next; return true; }
      return false;
    }

    function applyCameraTransform() {
      const world = document.getElementById('worldLayer');
      if (world) {
        world.classList.toggle('smooth', store.smoothCam);
        world.style.transform = `translate(${store.cam.x}px, ${store.cam.y}px) scale(${store.cam.zoom})`;
      }
      const pct = document.getElementById('zoomPct');
      if (pct) pct.textContent = `${Math.round(store.cam.zoom * 100)}%`;
      positionEdgeQuickBar();
      positionMultiSelBar();
      updateMinimapViewport();
    }

    function fitCameraToPoints(points, targetZoomCap = 0.80, animate = false) {
      if (!points.length) return;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of points) {
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      }
      const padX = 240, padY = 200;
      const bw = Math.max(360, (maxX - minX) + padX * 2);
      const bh = Math.max(280, (maxY - minY) + padY * 2);
      const vw = window.innerWidth, vh = window.innerHeight;
      const z = Math.max(0.32, Math.min(targetZoomCap, Math.min((vw - 140) / bw, (vh - 180) / bh)));
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      store.smoothCam = animate;
      store.cam = { x: vw / 2 - cx * z, y: vh / 2 - cy * z - 8, zoom: z };
      syncTierFromZoom();
    }

    function zoomAroundPoint(newZoom, screenX, screenY, animate = false) {
      const clamped = Math.max(0.24, Math.min(1.65, newZoom));
      const worldX = (screenX - store.cam.x) / store.cam.zoom;
      const worldY = (screenY - store.cam.y) / store.cam.zoom;
      store.smoothCam = animate;
      store.cam.zoom = clamped;
      store.cam.x = screenX - worldX * clamped;
      store.cam.y = screenY - worldY * clamped;
      if (syncTierFromZoom()) render();
      else applyCameraTransform();
    }

    function snapToTier(targetTier) {
      if (!store.autoLod) { store.tier = targetTier; render(); return; }
      const targetZ = targetTier === 'glyph' ? 0.35 : targetTier === 'map' ? 0.74 : 1.08;
      store.tier = targetTier;
      zoomAroundPoint(targetZ, window.innerWidth / 2, window.innerHeight / 2, true);
      render();
    }

    function bindWindowDrag(winEl, handleEl, key, resetFn) {
      if (!winEl || !handleEl) return;
      winEl.onmousedown = () => focusWindow(winEl);
      const saved = store.winPos[key];
      if (saved) {
        const cx = Math.max(8, Math.min(window.innerWidth - 140, saved.x));
        const cy = Math.max(50, Math.min(window.innerHeight - 70, saved.y));
        winEl.style.left = `${cx}px`; winEl.style.top = `${cy}px`;
        winEl.style.right = 'auto'; winEl.style.bottom = 'auto';
      }
      handleEl.onmousedown = (ev) => {
        if (ev.button !== 0 || ev.target.closest('button, input')) return;
        if (key === 'dag' && store.dagExpanded) return;
        ev.preventDefault();
        focusWindow(winEl);
        closeAllTransient(true);
        const r = winEl.getBoundingClientRect();
        const ox = ev.clientX - r.left, oy = ev.clientY - r.top;
        startDragSession((m) => {
          const nx = Math.max(8, Math.min(window.innerWidth - 140, m.clientX - ox));
          const ny = Math.max(50, Math.min(window.innerHeight - 70, m.clientY - oy));
          store.winPos[key] = { x: nx, y: ny };
          winEl.style.left = `${nx}px`; winEl.style.top = `${ny}px`;
          winEl.style.right = 'auto'; winEl.style.bottom = 'auto';
        }, () => { if (key === 'dag') renderLeftPalette(); });
      };
      handleEl.ondblclick = (ev) => {
        if (ev.target.closest('button, input')) return;
        store.winPos[key] = null;
        winEl.style.left = ''; winEl.style.top = ''; winEl.style.right = ''; winEl.style.bottom = '';
        toast('窗口已复位');
        if (resetFn) resetFn();
      };
    }

    function setSkin(skinId, syncPaper = true) {
      store.skin = skinId;
      document.documentElement.dataset.skin = skinId;
      if (syncPaper) {
        const s = SKINS.find(x => x.id === skinId);
        if (s) { store.paper = s.defaultPaper; document.documentElement.dataset.paper = s.defaultPaper; }
      }
      persistWorkspace();
      render();
    }
    function setPaper(p) { store.paper = p; document.documentElement.dataset.paper = p; persistWorkspace(); render(); }
    function cssVar(name, fb) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb; }

    function segIntersectsRect(x1, y1, x2, y2, r) {
      let t0 = 0, t1 = 1;
      const dx = x2 - x1, dy = y2 - y1;
      const checks = [[-dx, x1 - r.x1], [dx, r.x2 - x1], [-dy, y1 - r.y1], [dy, r.y2 - y1]];
      for (const [p, q] of checks) {
        if (Math.abs(p) < 1e-6) { if (q < 0) return false; }
        else {
          const t = q / p;
          if (p < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
          else { if (t < t0) return false; if (t < t1) t1 = t; }
        }
      }
      return t0 <= t1;
    }

    function countPolyHits(pts, obstacles) {
      let hits = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
        for (const r of obstacles) {
          if (segIntersectsRect(x1, y1, x2, y2, r)) hits++;
        }
      }
      return hits;
    }

    function polyLength(pts) {
      let len = 0;
      for (let i = 0; i < pts.length - 1; i++) len += Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      return len;
    }

    function buildRoundedOrthPath(rawPts, radius = 16) {
      // Remove near-duplicate points
      const pts = [rawPts[0]];
      for (let i = 1; i < rawPts.length; i++) {
        const prev = pts[pts.length - 1];
        if (Math.hypot(rawPts[i][0] - prev[0], rawPts[i][1] - prev[1]) > 1.5) pts.push(rawPts[i]);
      }
      if (pts.length < 2) return { d: `M ${rawPts[0][0]} ${rawPts[0][1]}`, lx: rawPts[0][0], ly: rawPts[0][1] };
      if (pts.length === 2) {
        return { d: `M ${pts[0][0]} ${pts[0][1]} L ${pts[1][0]} ${pts[1][1]}`, lx: (pts[0][0] + pts[1][0]) / 2, ly: (pts[0][1] + pts[1][1]) / 2 };
      }
      let d = `M ${Math.round(pts[0][0])} ${Math.round(pts[0][1])}`;
      let bestLen = -1, lx = (pts[0][0] + pts[pts.length - 1][0]) / 2, ly = (pts[0][1] + pts[pts.length - 1][1]) / 2;
      for (let i = 0; i < pts.length - 1; i++) {
        const sl = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
        if (sl > bestLen) {
          bestLen = sl;
          lx = (pts[i][0] + pts[i + 1][0]) / 2;
          ly = (pts[i][1] + pts[i + 1][1]) / 2;
        }
      }
      for (let i = 1; i < pts.length - 1; i++) {
        const pPrev = pts[i - 1], pCur = pts[i], pNext = pts[i + 1];
        const v1x = pCur[0] - pPrev[0], v1y = pCur[1] - pPrev[1], l1 = Math.hypot(v1x, v1y) || 1;
        const v2x = pNext[0] - pCur[0], v2y = pNext[1] - pCur[1], l2 = Math.hypot(v2x, v2y) || 1;
        const r = Math.min(radius, l1 * 0.45, l2 * 0.45);
        const ax = pCur[0] - (v1x / l1) * r, ay = pCur[1] - (v1y / l1) * r;
        const bx = pCur[0] + (v2x / l2) * r, by = pCur[1] + (v2y / l2) * r;
        d += ` L ${Math.round(ax)} ${Math.round(ay)} Q ${Math.round(pCur[0])} ${Math.round(pCur[1])} ${Math.round(bx)} ${Math.round(by)}`;
      }
      const last = pts[pts.length - 1];
      d += ` L ${Math.round(last[0])} ${Math.round(last[1])}`;
      return { d, lx: Math.round(lx), ly: Math.round(ly) };
    }

    function segsCross(a, b, c, d) {
      const ccw = (p1, p2, p3) => (p3[1] - p1[1]) * (p2[0] - p1[0]) - (p2[1] - p1[1]) * (p3[0] - p1[0]);
      const d1 = ccw(a, b, c), d2 = ccw(a, b, d), d3 = ccw(c, d, a), d4 = ccw(c, d, b);
      if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return true;
      // Collinear overlap (shared corridor segment)
      if (Math.abs(d1) < 1e-2 && Math.abs(d2) < 1e-2) {
        const ox = Math.min(Math.max(a[0], b[0]), Math.max(c[0], d[0])) - Math.max(Math.min(a[0], b[0]), Math.min(c[0], d[0]));
        const oy = Math.min(Math.max(a[1], b[1]), Math.max(c[1], d[1])) - Math.max(Math.min(a[1], b[1]), Math.min(c[1], d[1]));
        if (ox > 8 || oy > 8) return true;
      }
      return false;
    }

    function countEdgeCrossings(pts, placedSegments) {
      if (!placedSegments || !placedSegments.length) return 0;
      let cross = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const p1 = pts[i], p2 = pts[i + 1];
        for (const seg of placedSegments) {
          // Skip segments sharing nearly identical endpoints
          if (Math.hypot(p1[0] - seg[0][0], p1[1] - seg[0][1]) < 14 || Math.hypot(p2[0] - seg[1][0], p2[1] - seg[1][1]) < 14) continue;
          if (segsCross(p1, p2, seg[0], seg[1])) cross++;
        }
      }
      return cross;
    }

    function rectsOverlap(a, b, pad = 4) {
      return a.x1 - pad < b.x2 && a.x2 + pad > b.x1 && a.y1 - pad < b.y2 && a.y2 + pad > b.y1;
    }

    function resolveLabelPos(lx, ly, w, h, placedLabels, obsRects) {
      const testOffsets = [
        [0, 0], [0, -24], [0, 24], [0, -48], [0, 48],
        [-58, 0], [58, 0], [-58, -24], [58, 24], [58, -24], [-58, 24], [0, -72], [0, 72]
      ];
      let best = { lx, ly, score: Infinity };
      for (const [ox, oy] of testOffsets) {
        const cx = lx + ox, cy = ly + oy;
        const r = { x1: cx - w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2 };
        let hits = 0;
        for (const pl of placedLabels) if (rectsOverlap(r, pl, 5)) hits += 10;
        for (const ob of obsRects) if (rectsOverlap(r, ob, 3)) hits += 6;
        const score = hits * 1000 + Math.hypot(ox, oy);
        if (score < best.score) best = { lx: cx, ly: cy, score };
        if (hits === 0) break;
      }
      placedLabels.push({ x1: best.lx - w / 2, y1: best.ly - h / 2, x2: best.lx + w / 2, y2: best.ly + h / 2 });
      return { lx: Math.round(best.lx), ly: Math.round(best.ly) };
    }

    function attachEdgeBendDrag(el, edgeObj, onClick, onDblClick, onCtx) {
      el.style.cursor = 'grab';
      el.innerHTML = '<title>按住拖拽微调连线弯曲位置 · 双击编辑标签 · 右键菜单</title>';
      el.oncontextmenu = onCtx;
      el.ondblclick = onDblClick;
      el.onmousedown = (ev) => {
        if (ev.button !== 0) return;
        ev.stopPropagation(); ev.preventDefault();
        const sx = ev.clientX, sy = ev.clientY;
        const orig = edgeObj._bendOffset ? { ...edgeObj._bendOffset } : { dx: 0, dy: 0 };
        let moved = false;
        startDragSession((mv) => {
          const dx = (mv.clientX - sx) / store.cam.zoom;
          const dy = (mv.clientY - sy) / store.cam.zoom;
          if (!moved && Math.hypot(dx, dy) < 4) return;
          moved = true;
          edgeObj._bendOffset = { dx: Math.round(orig.dx + dx), dy: Math.round(orig.dy + dy) };
          render();
        }, () => {
          if (!moved) onClick(ev);
        });
      };
    }

    function computeEdgeGeom(sx, sy, tx, ty, preset, bendX = 0, bendY = 0, obstacles = null, ep = null, routingCtx = null) {
      // User manual drag override: always honor manual _bendOffset smoothly so human can resolve any edge ambiguity directly!
      if (routingCtx?.manualOffset && (Math.abs(routingCtx.manualOffset.dx) > 1 || Math.abs(routingCtx.manualOffset.dy) > 1)) {
        const cx = (sx + tx) / 2 + bendX + routingCtx.manualOffset.dx * 2;
        const cy = (sy + ty) / 2 + bendY + routingCtx.manualOffset.dy * 2;
        const sp = [];
        for (let i = 0; i <= 12; i++) {
          const t = i / 12, mt = 1 - t;
          sp.push([mt * mt * sx + 2 * mt * t * cx + t * t * tx, mt * mt * sy + 2 * mt * t * cy + t * t * ty]);
        }
        return { d: `M ${sx} ${sy} Q ${cx} ${cy} ${tx} ${ty}`, lx: (sx + 2 * cx + tx) / 4, ly: (sy + 2 * cy + ty) / 4, samplePts: sp };
      }

      const baseGeom = (() => {
        if (preset === 'straight') return { d: `M ${sx} ${sy} L ${tx} ${ty}`, lx: (sx + tx) / 2, ly: (sy + ty) / 2, samplePts: [[sx, sy], [tx, ty]] };
        if (preset === 'smoothstep') {
          const horiz = Math.abs(tx - sx) >= Math.abs(ty - sy);
          if (horiz) {
            const mx = (sx + tx) / 2 + bendX * 0.35;
            const r = Math.min(14, Math.abs(mx - sx) * 0.45, Math.abs(ty - sy) * 0.45);
            const sgnX = tx >= sx ? 1 : -1, sgnY = ty >= sy ? 1 : -1;
            const sp = [[sx, sy], [mx, sy], [mx, ty], [tx, ty]];
            if (r < 2) return { d: `M ${sx} ${sy} L ${tx} ${ty}`, lx: mx, ly: (sy + ty) / 2, samplePts: [[sx, sy], [tx, ty]] };
            return { d: `M ${sx} ${sy} L ${mx - sgnX * r} ${sy} Q ${mx} ${sy} ${mx} ${sy + sgnY * r} L ${mx} ${ty - sgnY * r} Q ${mx} ${ty} ${mx + sgnX * r} ${ty} L ${tx} ${ty}`, lx: mx, ly: (sy + ty) / 2, samplePts: sp };
          }
          const my = (sy + ty) / 2 + bendY * 0.35;
          const r = Math.min(14, Math.abs(my - sy) * 0.45, Math.abs(tx - sx) * 0.45);
          const sgnX = tx >= sx ? 1 : -1, sgnY = ty >= sy ? 1 : -1;
          const sp = [[sx, sy], [sx, my], [tx, my], [tx, ty]];
          if (r < 2) return { d: `M ${sx} ${sy} L ${tx} ${ty}`, lx: (sx + tx) / 2, ly: my, samplePts: [[sx, sy], [tx, ty]] };
          return { d: `M ${sx} ${sy} L ${sx} ${my - sgnY * r} Q ${sx} ${my} ${sx + sgnX * r} ${my} L ${tx - sgnX * r} ${my} Q ${tx} ${my} ${tx} ${my + sgnY * r} L ${tx} ${ty}`, lx: (sx + tx) / 2, ly: my, samplePts: sp };
        }
        const cx = (sx + tx) / 2 + bendX, cy = (sy + ty) / 2 + bendY;
        const sp = [];
        for (let i = 0; i <= 12; i++) {
          const t = i / 12, mt = 1 - t;
          sp.push([mt * mt * sx + 2 * mt * t * cx + t * t * tx, mt * mt * sy + 2 * mt * t * cy + t * t * ty]);
        }
        return { d: `M ${sx} ${sy} Q ${cx} ${cy} ${tx} ${ty}`, lx: (sx + 2 * cx + tx) / 4, ly: (sy + 2 * cy + ty) / 4, samplePts: sp };
      })();

      if (!obstacles || !obstacles.length) return baseGeom;
      const baseNodeHits = countPolyHits(baseGeom.samplePts, obstacles);
      const baseCrossHits = countEdgeCrossings(baseGeom.samplePts, routingCtx?.placedSegments);
      if (baseNodeHits === 0 && baseCrossHits === 0) return baseGeom;

      // Obstacle-Aware + Edge-Mutex Corridor Routing Axiom:
      // NEVER let a default edge slice behind unrelated node cards OR collide with already-placed edge corridors!
      const ax = ep ? ep.ax : sx, ay = ep ? ep.ay : sy, bx = ep ? ep.bx : tx, by = ep ? ep.by : ty;
      const hwA = ep ? ep.hwA : 0, hhA = ep ? ep.hhA : 0, hwB = ep ? ep.hwB : 0, hhB = ep ? ep.hhB : 0;
      const pad = 26;
      const gMinX = Math.min(ax - hwA, bx - hwB, ...obstacles.map(o => o.x1)) - pad;
      const gMaxX = Math.max(ax + hwA, bx + hwB, ...obstacles.map(o => o.x2)) + pad;
      const gMinY = Math.min(ay - hhA, by - hhB, ...obstacles.map(o => o.y1)) - pad;
      const gMaxY = Math.max(ay + hhA, by + hhB, ...obstacles.map(o => o.y2)) + pad;

      const xs = [...new Set([gMinX, gMaxX, (ax + bx) / 2, ...obstacles.flatMap(o => [o.x1 - pad, o.x2 + pad])])];
      const ys = [...new Set([gMinY, gMaxY, (ay + by) / 2, ...obstacles.flatMap(o => [o.y1 - pad, o.y2 + pad])])];
      const sortedObsX = [...obstacles].sort((u, v) => u.x1 - v.x1);
      for (let i = 0; i < sortedObsX.length - 1; i++) {
        if (sortedObsX[i + 1].x1 - sortedObsX[i].x2 > 14) xs.push((sortedObsX[i].x2 + sortedObsX[i + 1].x1) / 2);
      }
      const sortedObsY = [...obstacles].sort((u, v) => u.y1 - v.y1);
      for (let i = 0; i < sortedObsY.length - 1; i++) {
        if (sortedObsY[i + 1].y1 - sortedObsY[i].y2 > 14) ys.push((sortedObsY[i].y2 + sortedObsY[i + 1].y1) / 2);
      }

      const candidates = [];
      // 0) Keep baseGeom as fallback candidate when only crossing another edge (0 node hits)
      if (baseNodeHits === 0) candidates.push({ pts: baseGeom.samplePts, isBase: true });
      // 1) Side-exit vertical corridors
      for (const lx of xs) {
        const sSide = lx < ax ? ax - hwA : ax + hwA;
        const tSide = lx < bx ? bx - hwB - 6 : bx + hwB + 6;
        candidates.push({ pts: [[sSide, ay], [lx, ay], [lx, by], [tSide, by]] });
      }
      // 2) Top/bottom-exit horizontal corridors
      for (const ly of ys) {
        const sSide = ly < ay ? ay - hhA : ay + hhA;
        const tSide = ly < by ? by - hhB - 6 : by + hhB + 6;
        candidates.push({ pts: [[ax, sSide], [ax, ly], [bx, ly], [bx, tSide]] });
      }
      // 3) 2-gutter elbow corridors
      const nearYA = [ay - hhA - pad, ay + hhA + pad];
      const nearYB = [by - hhB - pad, by + hhB + pad];
      for (const ya of nearYA) {
        const saY = ya < ay ? ay - hhA : ay + hhA;
        for (const yb of nearYB) {
          const tbY = yb < by ? by - hhB - 6 : by + hhB + 6;
          for (const lx of xs) {
            candidates.push({ pts: [[ax, saY], [ax, ya], [lx, ya], [lx, yb], [bx, yb], [bx, tbY]] });
          }
        }
      }

      let best = null, bestScore = Infinity;
      for (const cand of candidates) {
        const hits = countPolyHits(cand.pts, obstacles);
        const crosses = countEdgeCrossings(cand.pts, routingCtx?.placedSegments);
        const score = hits * 1000000 + crosses * 12000 + polyLength(cand.pts) + cand.pts.length * 18;
        if (score < bestScore) { bestScore = score; best = cand; }
      }
      if (!best || best.isBase) return baseGeom;
      const built = buildRoundedOrthPath(best.pts, 14);
      built.samplePts = best.pts;
      return built;
    }

    // =========================================================================
    // 5. Domain Logic (Diff, E1-E4, Triage, Prompt)
    // =========================================================================
    function stateName(uid, src = curDraft()) {
      return src.states.find(s => s.uid === uid)?.name || curBase().states.find(s => s.uid === uid)?.name || uid;
    }

    function computeDiff(machineId = store.activeMachineId) {
      const base = store.baselines[machineId], draft = activeMachineDraft(machineId);
      if (!base || !draft) return { mode: 'modify', hasChanges: false, statesAdded: [], statesRemoved: [], statesRenamed: [], edgesAdded: [], edgesRemoved: [], edgesModified: [] };
      if (activeMachineModeFlag(machineId) === 'remove') {
        return { mode: 'remove', hasChanges: true, statesAdded: [], statesRemoved: base.states.map(s => s.uid), statesRenamed: [], edgesAdded: [], edgesRemoved: base.transitions.map(e => e.uid), edgesModified: [] };
      }
      const bS = new Map(base.states.map(s => [s.uid, s])), cS = new Map(draft.states.map(s => [s.uid, s]));
      const bE = new Map(base.transitions.map(e => [e.uid, e])), cE = new Map(draft.transitions.map(e => [e.uid, e]));
      const statesAdded = [], statesRemoved = [], statesRenamed = [], edgesAdded = [], edgesRemoved = [], edgesModified = [];
      for (const s of draft.states) { const b = bS.get(s.uid); if (!b) statesAdded.push(s.uid); else if (b.name !== s.name) statesRenamed.push({ uid: s.uid, from: b.name, to: s.name }); }
      for (const s of base.states) if (!cS.has(s.uid)) statesRemoved.push(s.uid);
      for (const e of draft.transitions) {
        const b = bE.get(e.uid);
        if (!b) edgesAdded.push(e.uid);
        else if (b.fromUid !== e.fromUid || b.toUid !== e.toUid || b.event !== e.event || (b.guard || '') !== (e.guard || '')) edgesModified.push({ uid: e.uid, before: b, after: e });
      }
      for (const e of base.transitions) if (!cE.has(e.uid)) edgesRemoved.push(e.uid);
      const hasChanges = statesAdded.length + statesRemoved.length + statesRenamed.length + edgesAdded.length + edgesRemoved.length + edgesModified.length > 0;
      return { mode: 'modify', hasChanges, statesAdded, statesRemoved, statesRenamed, edgesAdded, edgesRemoved, edgesModified };
    }

    // Extensible Spec Linter Rule Engine — strictly isolated by Graph Dialect (Statechart vs Flowchart vs Topology)
    const STATE_LINTER_RULES = [
      { code: 'E1', severity: 'error', name: '结构完整性', desc: '状态机至少包含 2 个状态与 1 条转移' },
      { code: 'E2', severity: 'error', name: '确定性冲突', desc: '同一状态不允许出现相同事件与守卫的重复出边' },
      { code: 'E3', severity: 'error', name: '孤岛不可达', desc: '所有状态必须能从初始状态到达' },
      { code: 'E4', severity: 'error', name: '死锁与陷阱', desc: '所有非终态必须能通往终态或回流初始状态' },
      { code: 'W1', severity: 'warn', name: '守卫兜底检查', desc: '带守卫条件的分叉状态建议存在互补或默认出边' },
      { code: 'W2', severity: 'warn', name: '草稿命名检查', desc: '建议把临时占位名（新状态/中间态）改为正式业务名' },
    ];
    const FLOW_LINTER_RULES = [
      { code: 'F1', severity: 'error', name: '起止完整性', desc: '流程图至少包含 1 个起点、1 个终点（出度为 0）与 1 条步骤连线' },
      { code: 'F2', severity: 'error', name: '步骤可达性', desc: '所有步骤必须能从流程起点顺流到达，不允许悬空孤岛' },
      { code: 'F3', severity: 'warn', name: '网关分支检查', desc: '条件判断网关（菱形节点）建议配置至少 2 条输出分支（如是/否）' },
      { code: 'F4', severity: 'warn', name: '草稿命名检查', desc: '建议把临时占位名（新步骤/新判断）改为正式业务步骤名' },
    ];
    const MACRO_LINTER_RULES = [
      { code: 'W3', severity: 'warn', name: '孤立规格节点', desc: '全景拓扑中尚无上下游契约连线的规格卡片' },
    ];
    const LINTER_RULES = STATE_LINTER_RULES;

    function runLinter() {
      const findings = [];
      if (store.view === 'macro') {
        const { nodes, edges } = getVisibleMacroGraph();
        const connected = new Set();
        edges.forEach(e => { connected.add(e.from); connected.add(e.to); });
        nodes.forEach(n => {
          if (!connected.has(n.id)) {
            findings.push({ code: 'W3', severity: 'warn', targetKind: 'forest', targetId: n.id, msg: `孤立规格节点：「${n.title}」尚无任何上下游契约连线` });
          }
        });
        return { scopeKind: 'macro', scopeLabel: 'TOPOLOGY LINTER', rules: MACRO_LINTER_RULES, findings, errors: findings.filter(f => f.severity === 'error'), warnings: findings.filter(f => f.severity === 'warn') };
      }

      const isFlow = curBase()?.graphKind === 'flow';
      if (curModeFlag() === 'remove') {
        return { scopeKind: isFlow ? 'flow' : 'machine', scopeLabel: isFlow ? 'FLOWCHART LINTER' : 'STATE MACHINE LINTER', rules: isFlow ? FLOW_LINTER_RULES : STATE_LINTER_RULES, findings: [], errors: [], warnings: [] };
      }
      const draft = curDraft(), states = draft.states, edges = draft.transitions;

      // Dedicated Flowchart Linter (F1–F4) — never applies state-machine E1–E4 rules!
      if (isFlow) {
        const out = new Map(states.map(s => [s.uid, []]));
        edges.forEach(e => out.get(e.fromUid)?.push(e.toUid));
        const init = states.find(s => s.initial) || states[0];
        const ends = states.filter(s => (out.get(s.uid) || []).length === 0);
        if (states.length < 2 || edges.length < 1 || !init || !ends.length) {
          findings.push({ code: 'F1', gate: 'F1', severity: 'error', targetKind: 'machine', targetId: null, msg: '起止不完整：流程图需包含起点、至少 1 个终点与 1 条步骤连线' });
        }
        if (init) {
          const reach = new Set([init.uid]), q = [init.uid];
          while (q.length) {
            const u = q.shift();
            for (const e of edges) {
              if (e.fromUid === u && !reach.has(e.toUid)) { reach.add(e.toUid); q.push(e.toUid); }
            }
          }
          for (const s of states) {
            if (!reach.has(s.uid)) {
              findings.push({ code: 'F2', gate: 'F2', severity: 'error', targetKind: 'state', targetId: s.uid, msg: `步骤不可达：「${s.name}」无法从流程起点到达` });
            }
          }
        }
        for (const s of states) {
          const outs = edges.filter(e => e.fromUid === s.uid);
          if (s.isGateway && outs.length < 2) {
            findings.push({ code: 'F3', gate: 'F3', severity: 'warn', targetKind: 'state', targetId: s.uid, msg: `网关分支不足：「${s.name}」当前仅 ${outs.length} 条分支，建议补充是/否路径` });
          }
          if (/^(新步骤|新判断|新状态|中间态|终态)\d+$/.test(s.name)) {
            findings.push({ code: 'F4', gate: 'F4', severity: 'warn', targetKind: 'state', targetId: s.uid, msg: `草稿占位名：「${s.name}」尚未改为正式业务步骤名` });
          }
        }
        return { scopeKind: 'flow', scopeLabel: 'FLOWCHART LINTER', rules: FLOW_LINTER_RULES, findings, errors: findings.filter(f => f.severity === 'error'), warnings: findings.filter(f => f.severity === 'warn') };
      }

      // State Machine Linter (E1–E4 + W1–W2)
      if (states.length < 2 || edges.length < 1) {
        findings.push({ code: 'E1', gate: 'E1', severity: 'error', targetKind: 'machine', targetId: null, msg: '结构不足：至少需 2 个状态与 1 条转移' });
      }
      const seen = new Map();
      for (const e of edges) {
        const k = `${e.fromUid}::${e.event}::${e.guard || ''}`;
        if (seen.has(k)) {
          findings.push({ code: 'E2', gate: 'E2', severity: 'error', targetKind: 'edge', targetId: e.uid, fixable: 'delete-edge', msg: `确定性冲突：「${stateName(e.fromUid)}」事件「${e.event}」重复` });
        }
        seen.set(k, e.uid);
      }
      const init = states.find(s => s.initial) || states[0];
      if (init) {
        const reach = new Set([init.uid]), q = [init.uid];
        while (q.length) { const u = q.shift(); for (const e of edges) if (e.fromUid === u && !reach.has(e.toUid)) { reach.add(e.toUid); q.push(e.toUid); } }
        for (const s of states) if (!reach.has(s.uid)) findings.push({ code: 'E3', gate: 'E3', severity: 'error', targetKind: 'state', targetId: s.uid, msg: `孤岛不可达：「${s.name}」无法从初态到达` });
        const out = new Map(states.map(s => [s.uid, []]));
        edges.forEach(e => out.get(e.fromUid)?.push(e.toUid));
        const terms = states.filter(s => (out.get(s.uid) || []).length === 0).map(s => s.uid);
        const can = (st, tg) => { const v = new Set([st]), sp = [st]; while (sp.length) { const u = sp.pop(); if (tg.includes(u)) return true; for (const w of out.get(u) || []) if (!v.has(w)) { v.add(w); sp.push(w); } } return false; };
        if (terms.length) {
          for (const s of states) {
            if (!terms.includes(s.uid) && !can(s.uid, terms)) {
              findings.push({ code: 'E4', gate: 'E4', severity: 'error', targetKind: 'state', targetId: s.uid, msg: `死锁风险：「${s.name}」无法到达任何终态` });
            }
          }
        } else {
          for (const s of states) {
            if (s.uid !== init.uid && !can(s.uid, [init.uid])) {
              findings.push({ code: 'E4', gate: 'E4', severity: 'error', targetKind: 'state', targetId: s.uid, msg: `死循环陷阱：「${s.name}」无法回流初态` });
            }
          }
        }
      }
      // Extensible Warning Rules (W1, W2)
      for (const s of states) {
        const outs = edges.filter(e => e.fromUid === s.uid);
        const guarded = outs.filter(e => e.guard && e.guard.trim());
        const unguarded = outs.filter(e => !e.guard || !e.guard.trim());
        if (guarded.length === 1 && unguarded.length === 0) {
          findings.push({ code: 'W1', gate: 'W1', severity: 'warn', targetKind: 'edge', targetId: guarded[0].uid, msg: `守卫缺兜底：「${s.name}」仅有单一守卫 [${guarded[0].guard}]，缺少假分支处理` });
        }
        if (/^(新状态|中间态|终态)\d+$/.test(s.name)) {
          findings.push({ code: 'W2', gate: 'W2', severity: 'warn', targetKind: 'state', targetId: s.uid, msg: `草稿占位名：「${s.name}」尚未改为正式业务名称` });
        }
      }
      return { scopeKind: 'machine', scopeLabel: 'STATE MACHINE LINTER', rules: STATE_LINTER_RULES, findings, errors: findings.filter(f => f.severity === 'error'), warnings: findings.filter(f => f.severity === 'warn') };
    }

    function validateE1E4() {
      return store.view === 'drill-machine' ? runLinter().errors : [];
    }

    function locateLinterTarget(f) {
      if (!f.targetId) return;
      if (f.targetKind === 'forest') {
        focusMacroNode(f.targetId);
        return;
      }
      store.selected = { kind: f.targetKind, id: f.targetId };
      if (f.targetKind === 'edge') store.edgeDrawerOpen = false;
      const d = curDraft();
      if (f.targetKind === 'state') {
        const st = d.states.find(x => x.uid === f.targetId);
        if (st) { store.smoothCam = true; store.cam.x = window.innerWidth / 2 - st.x * store.cam.zoom; store.cam.y = window.innerHeight / 2 - st.y * store.cam.zoom; }
      } else if (f.targetKind === 'edge') {
        const ed = d.transitions.find(x => x.uid === f.targetId);
        const sa = ed && d.states.find(x => x.uid === ed.fromUid), sb = ed && d.states.find(x => x.uid === ed.toUid);
        if (sa && sb) { store.smoothCam = true; store.cam.x = window.innerWidth / 2 - ((sa.x + sb.x) / 2) * store.cam.zoom; store.cam.y = window.innerHeight / 2 - ((sa.y + sb.y) / 2) * store.cam.zoom; }
      }
      render();
    }

    function buildTriage() {
      const list = [];
      validateE1E4().forEach(i => list.push({ kind: 'error', label: i.msg, targetKind: i.targetKind, targetId: i.targetId }));
      store.revisions.filter(r => r.status === 'pending' && r.machineId === store.activeMachineId).forEach(r => list.push({ kind: r.source === 'drift-trace' ? 'drift' : 'rev', label: r.rationale, targetKind: 'negotiate' }));
      const d = computeDiff();
      d.statesRenamed.forEach(r => list.push({ kind: 'diff', label: `改名：${r.from} → ${r.to}`, targetKind: 'state', targetId: r.uid }));
      d.statesAdded.forEach(uid => list.push({ kind: 'diff', label: `新增状态：${stateName(uid)}`, targetKind: 'state', targetId: uid }));
      d.edgesAdded.forEach(uid => list.push({ kind: 'diff', label: '新增转移', targetKind: 'edge', targetId: uid }));
      d.edgesModified.forEach(m => list.push({ kind: 'diff', label: '修改转移守卫/事件', targetKind: 'edge', targetId: m.uid }));
      return list;
    }

    function buildSemanticDiffText(machineId = store.activeMachineId) {
      const d = computeDiff(machineId);
      const base = store.baselines[machineId], draft = activeMachineDraft(machineId);
      if (!d.hasChanges) return '# 与 llmanspec/specs/ 一致';
      if (d.mode === 'remove') return `- [移除业务线] ${base.key}`;
      const ls = [];
      d.statesRenamed.forEach(r => ls.push(`~ 状态改名: ${r.from} -> ${r.to}`));
      d.statesAdded.forEach(uid => ls.push(`+ 新增状态: ${stateName(uid, draft)}`));
      d.statesRemoved.forEach(uid => ls.push(`- 删除状态: ${stateName(uid, base)}`));
      d.edgesModified.forEach(m => ls.push(`~ 修改转移: ${stateName(m.before.fromUid, base)}→${stateName(m.before.toUid, base)} [${m.before.event}${m.before.guard ? ` (${m.before.guard})` : ''}] -> ${stateName(m.after.fromUid, draft)}→${stateName(m.after.toUid, draft)} [${m.after.event}${m.after.guard ? ` (${m.after.guard})` : ''}]`));
      d.edgesAdded.forEach(uid => { const e = draft.transitions.find(x => x.uid === uid); ls.push(`+ 新增转移: ${stateName(e.fromUid, draft)} --[${e.event}${e.guard ? ` (${e.guard})` : ''}]--> ${stateName(e.toUid, draft)}`); });
      d.edgesRemoved.forEach(uid => { const e = base.transitions.find(x => x.uid === uid); ls.push(`- 删除转移: ${stateName(e.fromUid, base)} --[${e.event}]--> ${stateName(e.toUid, base)}`); });
      return ls.join('\n');
    }

    function getSubtreeMachineIds(rootId, visited = new Set()) {
      if (!rootId || visited.has(rootId) || !store.drafts[rootId]) return [];
      visited.add(rootId);
      const ids = [rootId];
      const d = activeMachineDraft(rootId);
      (d?.states || []).forEach(s => {
        if (s.subMachineId && store.drafts[s.subMachineId]) {
          ids.push(...getSubtreeMachineIds(s.subMachineId, visited));
        }
      });
      return ids;
    }

    function hasSubtreeChanges(rootId) {
      return getSubtreeMachineIds(rootId).some(id => computeDiff(id).hasChanges);
    }

    function buildSubtreeDiffText(rootId = store.activeMachineId) {
      const ids = getSubtreeMachineIds(rootId);
      const parts = [];
      ids.forEach(id => {
        const d = computeDiff(id);
        if (d.hasChanges) {
          const hdr = id === rootId ? '' : `# [子层: ${store.baselines[id]?.capability || id}]\n`;
          parts.push(hdr + buildSemanticDiffText(id));
        }
      });
      return parts.length ? parts.join('\n\n') : '# 与 llmanspec/specs/ 一致';
    }

    function buildPrompt() {
      const subIds = getSubtreeMachineIds(store.activeMachineId);
      const isFlow = curBase()?.graphKind === 'flow';
      const ls = [
        `# llman-sdd studio 协商请求`,
        `- 规格: ${curBase().key} (${curBase().file})`,
        `- 图方言: ${isFlow ? '流程图 (F1–F4 校验)' : '状态机 (E1–E4 校验)'}`,
        `- 草稿: .llman-sdd/studio/states/st-demo-01.json`,
        '',
      ];
      if (store.selectedContext.diff) ls.push('## 语义 Diff（含嵌套子层净改动）', '```diff', buildSubtreeDiffText(store.activeMachineId), '```', '');
      const cs = store.comments.filter(c => subIds.includes(c.machineId) && c.status !== 'resolved' && store.selectedContext.comments[c.id]);
      if (cs.length) {
        ls.push('## 锚定评论（已精确标注对象与 uid）');
        cs.forEach(c => ls.push(`- [定位: ${describeCommentAnchor(c)}] [${c.author}] ${c.body}`));
        ls.push('');
      }
      ls.push('## CLI 回调（含结构化验收/不可达回执）', 'llman-sdd studio diff st-demo-01', 'llman-sdd studio validate st-demo-01', 'llman-sdd studio revise st-demo-01 < rev.json', 'llman-sdd studio report st-demo-01 --status verified|blocked|counter_proposal --reason <code_or_req>');
      return ls.join('\n');
    }

    function renderTextFoldPill() {
      const w = document.createElement('div'); w.className = 'textfold-pill';
      TF_LABELS.forEach((lbl, idx) => {
        if (idx > 0) w.appendChild(Object.assign(document.createElement('span'), { className: 'tf-sep', textContent: '›' }));
        const b = document.createElement('button');
        b.className = `tf-step ${store.textFoldLevel === idx ? 'active' : ''}`;
        b.textContent = lbl;
        b.onclick = (ev) => { ev.stopPropagation(); store.textFoldLevel = idx; render(); };
        w.appendChild(b);
      });
      return w;
    }

    function enterDraft() {
      if (store.mode === 'explore' || store.mode === 'simulate') store.mode = 'draft';
      if (curWs().protected && !store.protectedHintShown) {
        store.protectedHintShown = true;
        setTimeout(() => toast('已暂存本地草稿（当前为主干受保护分支，保存变更时可一键切 Worktree 或导提案）'), 400);
      }
    }
    // Global Pointer Tracker for Spatial-Locality / Attention-Proximity Toasts!
    const _lastPointer = { x: null, y: null, ts: 0 };
    const _trackPtr = (ev) => { _lastPointer.x = ev.clientX; _lastPointer.y = ev.clientY; _lastPointer.ts = Date.now(); };
    window.addEventListener('mousemove', _trackPtr, { passive: true });
    window.addEventListener('mousedown', _trackPtr, { passive: true });

    function toast(msg, anchorRect = null) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.right = 'auto';
      // Measure rendered size cleanly before clamping near pointer / trigger element
      const tw = Math.min(380, Math.max(96, el.offsetWidth || msg.length * 12 + 26));
      const th = el.offsetHeight || 32;
      const vw = window.innerWidth, vh = window.innerHeight;
      let left, top;
      if (anchorRect) {
        left = anchorRect.left + (anchorRect.width || 0) / 2 - tw / 2;
        top = (anchorRect.bottom || anchorRect.top) + 10;
        if (top + th > vh - 14) top = anchorRect.top - th - 10;
      } else if (_lastPointer.x !== null && (Date.now() - _lastPointer.ts) < 10000) {
        left = _lastPointer.x - tw / 2;
        top = _lastPointer.y < 50 ? 52 : _lastPointer.y + 22;
        if (top + th > vh - 18) top = _lastPointer.y - th - 16;
      } else {
        left = (vw - tw) / 2;
        top = 54;
      }
      el.style.left = `${Math.round(Math.max(12, Math.min(vw - tw - 12, left)))}px`;
      el.style.top = `${Math.round(Math.max(50, Math.min(vh - th - 12, top)))}px`;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    // =========================================================================
    // 6. Browser-Grade Workspace Tabs (All Closable + Pin Memory + Start Guide!)
    // =========================================================================
    function sortTabsPinnedFirst() {
      const pinned = TABS.filter(t => t.pinned);
      const unpinned = TABS.filter(t => !t.pinned);
      TABS = [...pinned, ...unpinned];
    }

    let _navJumping = false;
    function currentNavLabel() {
      const tab = TABS.find(t => t.id === store.activeTabId);
      if (store.view === 'drill-machine') {
        const cap = (curBase()?.capability || store.activeMachineId).split('（')[0];
        return store.nestStack.length > 1 ? `${store.nestStack[0].label.split('（')[0]} › ${cap}` : cap;
      }
      return tab?.title || '全景';
    }
    function recordNavState() {
      if (_navJumping || !store.activeTabId) return;
      const entry = {
        tabId: store.activeTabId,
        machineId: store.view === 'drill-machine' ? store.activeMachineId : null,
        nestStack: store.view === 'drill-machine' ? clone(store.nestStack) : [],
        label: currentNavLabel(),
      };
      const cur = store.navHistory.stack[store.navHistory.idx];
      if (cur && cur.tabId === entry.tabId && cur.machineId === entry.machineId && cur.nestStack.length === entry.nestStack.length) {
        return;
      }
      if (store.navHistory.idx < store.navHistory.stack.length - 1) {
        store.navHistory.stack = store.navHistory.stack.slice(0, store.navHistory.idx + 1);
      }
      store.navHistory.stack.push(entry);
      if (store.navHistory.stack.length > 40) store.navHistory.stack.shift();
      store.navHistory.idx = store.navHistory.stack.length - 1;
    }
    function navigateHistory(delta) {
      const nextIdx = store.navHistory.idx + delta;
      if (nextIdx < 0 || nextIdx >= store.navHistory.stack.length) return;
      const target = store.navHistory.stack[nextIdx];
      if (!TABS.some(t => t.id === target.tabId)) {
        store.navHistory.stack.splice(nextIdx, 1);
        if (store.navHistory.idx >= nextIdx && delta < 0) store.navHistory.idx = Math.max(0, store.navHistory.idx - 1);
        renderTopLeftDock();
        toast('该历史标签页已关闭');
        return;
      }
      store.navHistory.idx = nextIdx;
      _navJumping = true;
      activateTab(target.tabId);
      if (target.machineId && store.drafts[target.machineId]) {
        store.activeMachineId = target.machineId;
        store.nestStack = clone(target.nestStack || []);
        fitDrill(true);
        render();
      }
      _navJumping = false;
      toast(`${delta < 0 ? '上一视图' : '下一视图'}：${target.label}`);
    }

    function activateTab(tabId) {
      closeAllTransient(false);
      if (!tabId || !TABS.some(t => t.id === tabId)) {
        store.activeTabId = null;
        store.view = 'start';
        store.selected = null;
        persistWorkspace();
        render();
        return;
      }
      const tab = TABS.find(t => t.id === tabId);
      store.activeTabId = tabId; store.selected = null; store.selectedNodeIds.clear(); store.commentDrawerOpen = false; store.edgeDrawerOpen = false; store.commentPopover = null; store.sharePopover = null; store.toolMode = 'pan'; store.portalPopover = null; store.nestStack = [];
      if (tab.kind === 'start') {
        store.view = 'start';
      } else if (tab.kind === 'macro') {
        store.view = 'macro'; store.bridgeOnly = false; store.macroConnectFrom = null;
        if (tab.stress) { store.egoMode = true; store.egoFocusId = 'studio-web'; toast('大图已默认开启「聚焦邻接」：仅看当前规格及直接上下游'); }
        fitMacro(true);
      } else if (tab.kind === 'machine') {
        store.activeMachineId = tab.machineId; store.view = 'drill-machine'; store.mode = 'explore';
        fitDrill(true);
      } else if (tab.kind === 'doc') {
        store.activeDocId = tab.docId; store.view = 'drill-doc';
      }
      recordNavState();
      persistWorkspace();
      render();
    }

    function openInNewTab(kind, targetId, title, extra = {}) {
      const prevTab = TABS.find(t => t.id === store.activeTabId);
      const prevOrigin = prevTab && prevTab.kind !== 'start'
        ? { fromTabId: prevTab.id, fromTitle: prevTab.title, cam: clone(store.cam), focusNodeId: targetId }
        : null;

      const tabId = kind === 'macro' ? targetId : `detail_${kind}_${targetId}`;
      let tab = TABS.find(t => t.id === tabId);
      if (!tab) {
        if (kind === 'macro') tab = { id: tabId, kind: 'macro', title, tagFilter: extra.tagFilter ?? null, nodeIds: extra.nodeIds ?? null, sourceGroupId: extra.sourceGroupId ?? null, showExternalHops: !!extra.showExternalHops, groups: extra.groups ?? null, stress: !!extra.stress, pinned: false, tabGroupId: null };
        else if (kind === 'machine') tab = { id: tabId, kind: 'machine', machineId: targetId, title, pinned: false, tabGroupId: null };
        else tab = { id: tabId, kind: 'doc', docId: targetId, title, pinned: false, tabGroupId: null };
        const curIdx = TABS.findIndex(t => t.id === store.activeTabId);
        if (curIdx >= 0 && TABS[curIdx].kind === 'start') TABS.splice(curIdx, 1, tab);
        else TABS.push(tab);
        sortTabsPinnedFirst();
        toast(`已在新 Tab 打开「${title}」`);
      }
      if (prevOrigin && prevOrigin.fromTabId !== tab.id) {
        store.tabOrigins[tab.id] = prevOrigin;
      } else {
        delete store.tabOrigins[tab.id];
      }
      activateTab(tab.id);
    }

    function returnToOrigin() {
      const orig = store.tabOrigins[store.activeTabId];
      if (!orig) return;
      const exists = TABS.some(t => t.id === orig.fromTabId);
      if (!exists) { delete store.tabOrigins[store.activeTabId]; toast('原标签页已关闭'); renderReturnOriginPill(); return; }
      const savedCam = orig.cam;
      const focusId = orig.focusNodeId;
      delete store.tabOrigins[store.activeTabId];
      activateTab(orig.fromTabId);
      if (savedCam && store.view === 'macro') {
        store.smoothCam = true;
        store.cam = clone(savedCam);
        syncTierFromZoom();
      }
      if (focusId && store.view === 'macro') store.selected = { kind: 'forest', id: focusId };
      toast(`已返回「${orig.fromTitle}」（改动已实时同步）`);
      render();
    }

    // Minimizable Floating Spec Editor Windows (Live-Synced with Macro Canvas, Spatially Local!)
    function openFloatingWindow(kind, targetId, title, anchorElOrRect = null) {
      const id = `fw_${kind}_${targetId}`;
      let fw = store.floatWins.find(w => w.id === id);
      if (fw) {
        fw.minimized = false;
        render();
        focusWindow(document.getElementById(id));
        return;
      }
      const winW = 420, winH = 420, vw = window.innerWidth, vh = window.innerHeight;
      const offset = (store.floatWins.length % 4) * 24;
      let x = Math.min(vw - winW - 16, Math.max(16, (vw - winW) / 2 + offset));
      let y = Math.min(vh - winH - 72, Math.max(60, 76 + offset));
      const rect = anchorElOrRect
        ? (typeof anchorElOrRect.getBoundingClientRect === 'function' ? anchorElOrRect.getBoundingClientRect() : anchorElOrRect)
        : null;
      if (rect) {
        // Place immediately adjacent to the clicked card (right side preferred, else left side)
        x = (rect.right + 14 + winW <= vw - 12)
          ? rect.right + 14
          : Math.max(12, rect.left - winW - 14);
        y = Math.max(56, Math.min(vh - winH - 68, rect.top));
      }
      fw = {
        id, kind, targetId, title, minimized: false,
        x: Math.round(x), y: Math.round(y),
        selectedStateUid: kind === 'machine' ? store.drafts[targetId]?.states[0]?.uid : null,
      };
      store.floatWins.push(fw);
      toast(`已打开「${title}」悬浮编辑窗（实时同步全景，可最小化）`);
      render();
      focusWindow(document.getElementById(id));
    }

    function demoteCurrentTabToFloat() {
      const curTab = TABS.find(t => t.id === store.activeTabId);
      if (!curTab || (curTab.kind !== 'machine' && curTab.kind !== 'doc')) return;

    function diveIntoSubMachine(subId, label) {
      if (!store.drafts[subId]) return;
      if (store.nestStack.length === 0) {
        store.nestStack.push({ machineId: store.activeMachineId, label: curBase()?.capability || store.activeMachineId });
      }
      store.nestStack.push({ machineId: subId, label: label || store.baselines[subId]?.capability || subId });
      store.activeMachineId = subId;
      store.selected = null; store.selectedEdgeAnchor = null; store.commentDrawerOpen = false;
      recordNavState();
      fitDrill(true);
      toast(`已进入嵌套${store.baselines[subId]?.graphKind === 'flow' ? '子流程图' : '子状态机'}（左右已保留上层关联节点）`);
      render();
    }

    function jumpNestLevel(idx, focusStateUid = null) {
      if (idx < 0 || idx >= store.nestStack.length) return;
      const target = store.nestStack[idx];
      store.nestStack = idx === 0 ? [] : store.nestStack.slice(0, idx + 1);
      store.activeMachineId = target.machineId;
      store.selected = focusStateUid ? { kind: 'state', id: focusStateUid } : null;
      store.selectedEdgeAnchor = null; store.commentDrawerOpen = false;
      recordNavState();
      fitDrill(true);
      if (focusStateUid) {
        const st = curDraft()?.states.find(s => s.uid === focusStateUid);
        if (st) toast(`已返回上层并定位「${st.name}」`);
      }
      render();
    }

    function getParentNestContext() {
      if (store.view !== 'drill-machine' || store.nestStack.length < 2) return null;
      const parentIdx = store.nestStack.length - 2;
      const parentStep = store.nestStack[parentIdx];
      const parentDraft = activeMachineDraft(parentStep.machineId);
      const parentBase = store.baselines[parentStep.machineId];
      if (!parentDraft) return null;
      const hostState = parentDraft.states.find(s => s.subMachineId === store.activeMachineId);
      if (!hostState) return null;
      const incoming = [];
      const outgoing = [];
      for (const e of parentDraft.transitions) {
        const lbl = e.guard ? `${e.event} [${e.guard}]` : e.event;
        if (e.toUid === hostState.uid && e.fromUid !== hostState.uid) {
          const src = parentDraft.states.find(s => s.uid === e.fromUid);
          if (src) incoming.push({ uid: src.uid, title: src.name, desc: src.desc || '', edgeLabel: lbl, dir: 'in', parentIdx });
        }
        if (e.fromUid === hostState.uid && e.toUid !== hostState.uid) {
          const dst = parentDraft.states.find(s => s.uid === e.toUid);
          if (dst) outgoing.push({ uid: dst.uid, title: dst.name, desc: dst.desc || '', edgeLabel: lbl, dir: 'out', parentIdx });
        }
      }
      return {
        parentIdx,
        parentId: parentStep.machineId,
        parentLabel: parentStep.label.split('（')[0],
        parentIsFlow: parentBase?.graphKind === 'flow',
        hostUid: hostState.uid,
        hostName: hostState.name,
        incoming,
        outgoing,
      };
    }

    function buildSubPeekPreviewHtml(subMachineId) {
      const m = activeMachineDraft(subMachineId) || store.baselines[subMachineId];
      if (!m?.states?.length) return '';
      const isFlow = store.baselines[subMachineId]?.graphKind === 'flow';
      const inkHex = cssVar('--ink', '#14171f'), surfHex = cssVar('--surface', '#ffffff'), bdHex = cssVar('--border-strong', '#c5ccd9'), accentHex = cssVar('--accent', '#2f54eb'), flowHex = cssVar('--t-flow', '#6d28d9');
      const vbW = 340, vbH = 152, halfW = 46, halfH = 13;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      m.states.forEach(s => { minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x); minY = Math.min(minY, s.y); maxY = Math.max(maxY, s.y); });
      const spanX = Math.max(240, maxX - minX), spanY = Math.max(100, maxY - minY);
      const sc = Math.min((vbW - 108) / spanX, (vbH - 56) / spanY);
      const midX = (minX + maxX) / 2, midY = (minY + maxY) / 2;
      const mapP = (s) => ({ x: vbW / 2 + (s.x - midX) * sc, y: vbH / 2 + (s.y - midY) * sc });
      const clipToBox = (from, to, pad = 2) => {
        const dx = to.x - from.x, dy = to.y - from.y;
        if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) return from;
        const tX = Math.abs(dx) > 0.01 ? (halfW + pad) / Math.abs(dx) : Infinity;
        const tY = Math.abs(dy) > 0.01 ? (halfH + pad) / Math.abs(dy) : Infinity;
        const t = Math.min(tX, tY, 0.45);
        return { x: from.x + dx * t, y: from.y + dy * t };
      };
      let edgesSvg = '', nodesSvg = '';
      m.transitions.forEach(e => {
        const sa = m.states.find(x => x.uid === e.fromUid), sb = m.states.find(x => x.uid === e.toUid);
        if (!sa || !sb) return;
        const a = mapP(sa), b = mapP(sb);
        const tip = `${sa.name} --[${e.event}${e.guard ? ` | ${e.guard}` : ''}]--> ${sb.name}`;
        let dPath;
        if (e.fromUid === e.toUid) {
          dPath = `M ${a.x + 12} ${a.y - halfH} C ${a.x + 30} ${a.y - halfH - 28}, ${a.x - 30} ${a.y - halfH - 28}, ${a.x - 12} ${a.y - halfH - 2}`;
        } else {
          const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy) || 1;
          const hasOpp = m.transitions.some(o => o.uid !== e.uid && o.fromUid === e.toUid && o.toUid === e.fromUid);
          const nx = -dy / dist, ny = dx / dist;
          const lat = hasOpp ? 6 : 0;
          const aOff = { x: a.x + nx * lat, y: a.y + ny * lat };
          const bOff = { x: b.x + nx * lat, y: b.y + ny * lat };
          const sPt = clipToBox(aOff, bOff, 1), tPt = clipToBox(bOff, aOff, 4);
          const curve = hasOpp ? 14 : 0;
          dPath = curve ? `M ${sPt.x} ${sPt.y} Q ${(sPt.x + tPt.x) / 2 + nx * curve} ${(sPt.y + tPt.y) / 2 + ny * curve} ${tPt.x} ${tPt.y}` : `M ${sPt.x} ${sPt.y} L ${tPt.x} ${tPt.y}`;
        }
        edgesSvg += `<path d="${dPath}" fill="none" stroke="${bdHex}" stroke-width="1.3" marker-end="url(#spPeekArr)"><title>${esc(tip)}</title></path>`;
      });
      m.states.forEach(s => {
        const pt = mapP(s);
        const shortName = s.name.length > 7 ? `${s.name.slice(0, 6)}…` : s.name;
        const strokeCol = s.isGateway ? flowHex : s.initial ? inkHex : s.subMachineId ? accentHex : bdHex;
        nodesSvg += `<g><title>${esc(s.name)}：${esc(s.desc || '')}</title>
          <rect x="${pt.x - halfW}" y="${pt.y - halfH}" width="${halfW * 2}" height="${halfH * 2}" rx="${s.isGateway ? 9 : 6}" fill="${surfHex}" stroke="${strokeCol}" stroke-width="${s.initial || s.isGateway || s.subMachineId ? 1.5 : 1.1}"/>
          <text x="${pt.x}" y="${pt.y + 3.5}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${inkHex}">${esc(shortName)}</text>
        </g>`;
      });
      return `<div class="sub-peek-box" onmousedown="event.stopPropagation()">
        <div class="sub-peek-head">
          <span>${isFlow ? '子流程图' : '子状态机'} · ${m.states.length} 节点 / ${m.transitions.length} 连线</span>
          <span style="font-family:var(--mono);">只读透视</span>
        </div>
        <svg viewBox="0 0 ${vbW} ${vbH}" style="width:100%;height:auto;display:block;border-radius:6px;background:var(--surface);border:1px solid var(--border);">
          <defs><marker id="spPeekArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="${bdHex}"/></marker></defs>
          ${edgesSvg}${nodesSvg}
        </svg>
      </div>`;
    }

    function closeTab(tabId, force = false) {
      const idx = TABS.findIndex(t => t.id === tabId);
      if (idx < 0) return;
      if (TABS[idx].pinned && !force) { toast('该标签页已置顶（右键取消置顶后可关闭）'); return; }

        persistWorkspace();
        toast('所有标签页已关闭，进入空白引导页');

      else { persistWorkspace(); render(); }

    function renderTopLeftDock() {
      const dock = document.getElementById('topLeftDock');
      dock.innerHTML = '';

      const tabIsl = document.createElement('div');
      tabIsl.className = 'island';
      const brand = document.createElement('span');
      brand.className = 'brand-mark';
      brand.innerHTML = `<span class="brand-glyph">${ICONS.brand(11)}</span><span>studio</span>`;
      tabIsl.appendChild(brand);
      tabIsl.appendChild(Object.assign(document.createElement('span'), { className: 'sep-v' }));

      // Bidirectional View History (← Back / → Forward, symmetric to Top-Right Undo / Redo!)
      const canBack = store.navHistory.idx > 0;
      const canFwd = store.navHistory.idx >= 0 && store.navHistory.idx < store.navHistory.stack.length - 1;
      const prevEntry = canBack ? store.navHistory.stack[store.navHistory.idx - 1] : null;
      const nextEntry = canFwd ? store.navHistory.stack[store.navHistory.idx + 1] : null;

      const backNav = document.createElement('button');
      backNav.className = `ibtn icon-only ${canBack ? '' : 'muted-dis'}`;
      backNav.innerHTML = ICONS.chevL(13);
      backNav.title = canBack ? `上一视图：${prevEntry.label} (Alt+←)` : '无上一视图历史 (Alt+←)';
      backNav.onclick = () => { if (canBack) navigateHistory(-1); };
      tabIsl.appendChild(backNav);

      const fwdNav = document.createElement('button');
      fwdNav.className = `ibtn icon-only ${canFwd ? '' : 'muted-dis'}`;
      fwdNav.innerHTML = ICONS.chevR(13);
      fwdNav.title = canFwd ? `下一视图：${nextEntry.label} (Alt+→)` : '无下一视图历史 (Alt+→)';
      fwdNav.onclick = () => { if (canFwd) navigateHistory(1); };
      tabIsl.appendChild(fwdNav);
      tabIsl.appendChild(Object.assign(document.createElement('span'), { className: 'sep-v' }));

      // Subtraction: clean browser tabs (Pin + Drag-and-Drop Reorder only; Tab Groups deferred to Post-MVP!)
      const bindTabDrag = (btn, tab) => {
        btn.draggable = true;
        btn.classList.add('tab-draggable');
        btn.ondragstart = (ev) => {
          store.dragTabId = tab.id;
          btn.classList.add('tab-dragging');
          if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', tab.id); }
        };
        btn.ondragend = () => {
          store.dragTabId = null;
          tabIsl.querySelectorAll('.tab-drop-before,.tab-drop-after,.tab-dragging').forEach(el => el.classList.remove('tab-drop-before', 'tab-drop-after', 'tab-dragging'));
        };
        btn.ondragover = (ev) => {
          if (!store.dragTabId || store.dragTabId === tab.id) return;
          const src = TABS.find(x => x.id === store.dragTabId);
          if (!src || !!src.pinned !== !!tab.pinned) return;
          ev.preventDefault();
          const r = btn.getBoundingClientRect();
          const before = ev.clientX < r.left + r.width / 2;
          btn.classList.toggle('tab-drop-before', before);
          btn.classList.toggle('tab-drop-after', !before);
        };
        btn.ondragleave = () => { btn.classList.remove('tab-drop-before', 'tab-drop-after'); };
        btn.ondrop = (ev) => {
          ev.preventDefault();
          btn.classList.remove('tab-drop-before', 'tab-drop-after');
          const srcId = store.dragTabId || ev.dataTransfer?.getData('text/plain');
          if (!srcId || srcId === tab.id) return;
          const fromIdx = TABS.findIndex(x => x.id === srcId);
          const toIdx = TABS.findIndex(x => x.id === tab.id);
          if (fromIdx < 0 || toIdx < 0 || !!TABS[fromIdx].pinned !== !!TABS[toIdx].pinned) return;
          const r = btn.getBoundingClientRect();
          const before = ev.clientX < r.left + r.width / 2;
          const [moved] = TABS.splice(fromIdx, 1);
          let insertAt = TABS.findIndex(x => x.id === tab.id);
          if (!before) insertAt += 1;
          TABS.splice(insertAt, 0, moved);
          store.dragTabId = null;
          persistWorkspace();
          toast(`已移动标签页「${moved.title}」`);
          renderTopLeftDock();
        };
      };

      for (const t of TABS) {
        const b = document.createElement('button');
        b.className = `ibtn ${store.activeTabId === t.id ? 'active' : ''}`.trim();
        b.title = t.pinned ? '已置顶（拖动换序 · 右键管理）' : '拖动换序 · 右键置顶或关闭';
        const pinHtml = t.pinned ? `<span class="pin-dot">${ICONS.pin(10)}</span>` : '';
        if (t.kind === 'machine') b.innerHTML = `${pinHtml}${ICONS.machine(12)}<span>${esc(t.title)}</span>`;
        else if (t.kind === 'doc') b.innerHTML = `${pinHtml}${ICONS.decision(12)}<span>${esc(t.title)}</span>`;
        else b.innerHTML = `${pinHtml}<span>${esc(t.title)}</span>`;

        if (!t.pinned) {
          const x = document.createElement('span');
          x.className = 'tab-close'; x.innerHTML = ICONS.close(10); x.title = '关闭标签页';
          x.onclick = (ev) => { ev.stopPropagation(); closeTab(t.id); };
          b.appendChild(x);
        }
        b.onclick = () => activateTab(t.id);
        b.oncontextmenu = (ev) => {
          ev.preventDefault(); ev.stopPropagation();
          store.tabCtxId = t.id;
          store.activePopover = 'tabCtx';
          store.popoverAnchorRect = { left: ev.clientX, right: ev.clientX, top: ev.clientY, bottom: ev.clientY };
          store.radial = null;
          renderPopovers();
          renderRadialMenu();
        };
        bindTabDrag(b, t);
        tabIsl.appendChild(b);
      }

      const addTab = document.createElement('button');
      addTab.className = 'ibtn icon-only'; addTab.innerHTML = ICONS.plus(13); addTab.title = '新建空白引导标签页';
      addTab.onclick = () => openBlankStartTab();
      tabIsl.appendChild(addTab);
      dock.appendChild(tabIsl);

      if (store.view === 'drill-machine') {
        const d = computeDiff();
        const subDirty = !d.hasChanges && hasSubtreeChanges(store.activeMachineId);
        const isFlow = curBase()?.graphKind === 'flow';
        const showSim = store.mode === 'simulate';
        const showDiff = (d.hasChanges || subDirty) && !showSim;
        if (showSim || showDiff) {
          const misl = document.createElement('div');
          misl.className = 'island';
          if (showSim) {
            misl.innerHTML = `<span class="badge-chip badge-accent">${isFlow ? '流程推演中' : '单步试跑中'}</span>`;
          } else if (subDirty) {
            misl.innerHTML = `<span class="badge-chip badge-green">子层有未保存改动</span>`;
          } else {
            misl.innerHTML = `<span class="badge-chip ${curModeFlag() === 'remove' ? 'badge-red' : 'badge-green'}">${curModeFlag() === 'remove' ? '待下线' : `草稿 +${d.statesAdded.length}${isFlow ? '步' : '态'} +${d.edgesAdded.length}边 ~${d.statesRenamed.length + d.edgesModified.length}改`}</span>`;
          }
          dock.appendChild(misl);
        }
      }
    }

    function switchWorkspace(wsKey, carryDraft = false) {
      const target = WORKSPACES.find(w => w.key === wsKey);
      if (!target) return;
      const prev = curWs();
      store.activeWsKey = wsKey;
      closeAllTransient(false);

      if (!carryDraft) {
        store.tabOrigins = {};
        store.navHistory = { stack: [], idx: -1 };
        // Load workspace-isolated nodes/edges, exclusive groups, BASE snapshots & tabs (zero cross-repo pollution!)
        if (target.nodes) {
          store.forestBaseNodes = clone(target.nodes);
          store.forestBaseEdges = clone(target.edges);
          store.forestNodes = clone(target.nodes);
          store.forestEdges = clone(target.edges);
          store.macroGroups = target.groups ? clone(target.groups) : [];
          enforceExclusiveGroupSpaces(store.forestNodes, store.macroGroups);
          TABS = [{ id: 'default', kind: 'macro', title: '主视图', tagFilter: null, groups: null, stress: false, pinned: true }];
          store.activeTabId = 'default';
          store.view = 'macro';
        } else {
          store.forestBaseNodes = clone(BASE_FOREST_NODES);
          store.forestBaseEdges = clone(BASE_FOREST_EDGES);
          store.forestNodes = clone(BASE_FOREST_NODES);
          store.forestEdges = clone(BASE_FOREST_EDGES);
          store.macroGroups = clone(DEFAULT_MACRO_GROUPS);
          enforceExclusiveGroupSpaces(store.forestNodes, store.macroGroups);
          const saved = loadPersistedState()?.tabsByWs?.[wsKey];
          TABS = saved?.tabs?.length ? saved.tabs : clone(DEFAULT_TABS);
          store.activeTabId = saved?.activeTabId && TABS.some(t => t.id === saved.activeTabId) ? saved.activeTabId : TABS[0].id;
          store.view = 'macro';
        }
        store.worldline = { open: false, scopeId: null, nodeA: null, nodeB: null, comparing: false };
        store.expandedNodeIds.clear();
        store.selectedNodeIds.clear();
        store.inPlaceDrill = {};
        store.selected = null; store.selectedEdgeAnchor = null; store.commentDrawerOpen = false; store.edgeDrawerOpen = false; store.toolMode = 'pan';
        store.splitDiffOpen = false; store.reportPopover = null; store.sharePopover = null; store.commentPopover = null;
        store.timelines['__macro__'] = undefined;
        delete store.intentSnapshots['__macro__'];
        delete store.executionReports['__macro__'];
        fitMacro(true);
      }
      persistWorkspace();
      const subTag = target.instanceRel === '.' ? '' : ` / ${target.instanceRel}`;
      toast(carryDraft
        ? `已切至可写 Worktree「${target.branch}」并带入当前草稿（现在可直接落盘）`
        : `已切换工作区：${target.repo}${subTag} (${target.branch} · ${target.protected ? '写保护' : '可直写'})`);
      render();
    }

    // =========================================================================
    // 8. Stage Views (Macro w/ In-Place Expansion + Drill Machine + Drill Doc)
    // =========================================================================
    function getVisibleMacroGraph() {
      const tab = TABS.find(t => t.id === store.activeTabId) || TABS[0];
      const tl = store.timelines['__macro__'];
      const previewSnap = (!tab.stress && tl && tl.previewIdx !== null) ? tl.entries[tl.previewIdx]?.snapshot : null;
      const rawNodes = tab.stress ? store.largeForest.nodes : (previewSnap ? previewSnap.nodes : store.forestNodes);
      const rawEdges = tab.stress ? store.largeForest.edges : (previewSnap ? previewSnap.edges : store.forestEdges);
      let nodes;
      let extHopIds = new Set();
      // Live 2-Way Binding: if custom Tab was spawned from a live domain group, always read that group's live nodeIds!
      const boundGroup = tab.sourceGroupId ? store.macroGroups.find(g => g.id === tab.sourceGroupId) : null;
      const effectiveNodeIds = boundGroup ? boundGroup.nodeIds : tab.nodeIds;
      if (effectiveNodeIds && effectiveNodeIds.length) {
        const coreSet = new Set(effectiveNodeIds);
        if (tab.showExternalHops) {
          rawEdges.forEach(e => {
            if (coreSet.has(e.from) && !coreSet.has(e.to)) extHopIds.add(e.to);
            if (coreSet.has(e.to) && !coreSet.has(e.from)) extHopIds.add(e.from);
          });
        }
        nodes = rawNodes.filter(n => coreSet.has(n.id) || extHopIds.has(n.id));
      } else {
        nodes = tab.tagFilter ? rawNodes.filter(n => n.tags.includes(tab.tagFilter)) : rawNodes;
      }
      // Apply Main-View Node Kind Filter (focus attention on live graphs vs weak doc constraints)
      nodes = nodes.filter(n => store.visibleKinds[n.kind] !== false);
      let visIds = new Set(nodes.map(n => n.id));
      let hiddenCount = 0;

      if (tab.stress && store.egoMode) {
        const f = store.egoFocusId || 'studio-web';
        const hop = new Set([f]);
        rawEdges.forEach(e => { if (e.from === f) hop.add(e.to); if (e.to === f) hop.add(e.from); });
        hiddenCount = nodes.length - hop.size;
        nodes = nodes.filter(n => hop.has(n.id));
        visIds = hop;
      }
      const edges = rawEdges.filter(e => visIds.has(e.from) && visIds.has(e.to));
      return { tab, nodes, edges, hiddenCount, extHopIds };
    }

    function fitMacro(animate = false) { fitCameraToPoints(getVisibleMacroGraph().nodes, 0.80, animate); }
    function fitDrill(animate = false) {
      const states = curDraft().states;
      if (!states.length) return;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      states.forEach(s => { minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x); minY = Math.min(minY, s.y); maxY = Math.max(maxY, s.y); });
      const nested = store.nestStack.length > 1;
      const sidePad = nested ? 420 : 250;
      const topPad = nested ? 115 : 50;
      const pts = [...states, { x: minX - sidePad, y: minY - topPad }, { x: maxX + sidePad, y: maxY + 115 }];
      fitCameraToPoints(pts, nested ? 0.80 : 0.86, animate);
    }
